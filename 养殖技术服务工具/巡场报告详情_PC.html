<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>查看巡场报告详情</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #8c8c8c;
      --label-bg: #fafafa;
      --border: #e8e8e8;
      --blue: #1677ff;
      --ok: #52c41a;
      --danger: #ff4d4f;
      --warn: #fa8c16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px 48px;
    }

    .page-wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .modal-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-hd h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .modal-close {
      width: 28px; height: 28px; border: none; background: transparent;
      font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1;
      border-radius: 4px;
    }
    .modal-close:hover { background: #f5f5f5; color: var(--text); }

    .modal-bd { padding: 20px 24px 28px; }

    .sec-title {
      font-size: 15px; font-weight: 600; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .sec-title::before {
      content: ""; width: 3px; height: 14px; background: var(--blue); border-radius: 1px;
    }
    .sec-block { margin-bottom: 24px; }
    .sec-block:last-child { margin-bottom: 0; }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .detail-table th,
    .detail-table td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      vertical-align: top;
      line-height: 1.6;
      text-align: left;
    }
    .detail-table th {
      width: 180px;
      background: var(--label-bg);
      color: #595959;
      font-weight: 400;
      white-space: nowrap;
    }
    .detail-table td { background: #fff; color: var(--text); word-break: break-all; }
    .detail-table td.empty { color: var(--muted); }

    .tag {
      display: inline-block; font-size: 12px; padding: 1px 8px;
      border-radius: 2px; font-weight: 500;
    }
    .tag-ok { color: var(--ok); background: #f6ffed; border: 1px solid #b7eb8f; }
    .tag-no { color: var(--danger); background: #fff2f0; border: 1px solid #ffccc7; }
    .tag-wait { color: var(--warn); background: #fff7e6; border: 1px solid #ffd591; }
    .tag-done { color: #8c8c8c; background: #fafafa; border: 1px solid #d9d9d9; }
    .tag-sent { color: var(--ok); }
    .tag-unsent { color: var(--warn); }

    .plan-text { white-space: pre-line; line-height: 1.7; }
    .dim-list { margin: 0; padding: 0; list-style: none; }
    .dim-list li {
      padding: 6px 0; border-bottom: 1px dashed #f0f0f0;
      display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
    }
    .dim-list li:last-child { border-bottom: none; padding-bottom: 0; }
    .dim-list li:first-child { padding-top: 0; }
    .dim-problem { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .media-cell { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .thumb {
      width: 120px; height: 120px; border-radius: 4px; overflow: hidden;
      position: relative; cursor: pointer;
      background: linear-gradient(135deg, #dbe7f8, #c5d6ef);
      border: 1px solid var(--border);
    }
    .thumb .placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #3a5a8c;
    }
    .thumb .mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.45);
      color: #fff; font-size: 12px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      opacity: 0; transition: opacity .15s;
    }
    .thumb:hover .mask { opacity: 1; }
    .recog { color: var(--ok); font-size: 13px; margin-top: 8px; }

    .toast {
      display: none; position: fixed; left: 50%; top: 24px;
      transform: translateX(-50%); z-index: 100;
      background: rgba(0,0,0,.75); color: #fff;
      padding: 8px 16px; border-radius: 4px; font-size: 13px;
    }
    .toast.show { display: block; }

    .preview-mask {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.65);
      align-items: center; justify-content: center;
    }
    .preview-mask.show { display: flex; }
    .preview-box {
      width: 360px; height: 360px; background: #fff; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #666;
    }
  </style>
</head>
<body>
  <div class="page-wrap">

        <h1>查看巡场报告详情</h1>
        <button type="button" class="modal-close" id="btn-close" title="关闭">×</button>
      </div>
      <div class="modal-bd" id="detail-body">
        <!-- JS 渲染 -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="preview-mask" id="preview-mask">
    <div class="preview-box" id="preview-box">图片预览（原型）</div>
  </div>

  <script>

          { name: "水线与供水", status: "ok" },

        ],

        sent: true,
        orderId: "d4",
        companion: "--"
      },
      "R20260720001": {
        id: "R20260720001",
        reportNo: "782-20260720103",
        customer: "张三",
        phone: "13812345678",
        teacher: "王玉东",
        teacherPhone: "13812345678",
        date: "2026-07-20",
        visitTime: "2026-07-20 10:00:00",
        visitNo: 1,
        mode: "电话",
        valid: false,
        flockType: "鸡",
        flockBreed: "海兰褐",
        flockScale: "5 万羽",
        flockDims: [
          { name: "精神状态", status: "ok" },
          { name: "粪便", status: "ok" },
          { name: "产蛋率", status: "ok" },

        ],
        shedDims: [
          { name: "环控设施（含温湿度/通风）", status: "no", problem: "通风需改善" },
          { name: "水线与供水", status: "ok" },
          { name: "饲料仓储情况", status: "ok" },
          { name: "其他工作 / 其他", status: "ok" }
        ],
        tracks: [],
        summary: ["死淘率偏高", "通风需改善"],
        plan: "1. 建议加药观察。\n2. 改善通风。",
        problemPhotos: [],
        address: "",
        checkinPhotos: [],
        selfiePhotos: [],
        selfieRecog: "",
        sent: true,
        orderId: "d5",
        companion: "--"
      }
    };

    function $(id) { return document.getElementById(id); }

    function getId() {
      var q = new URLSearchParams(window.location.search || "");
      return q.get("id") || "R20260804001";
    }

    function toast(msg) {
      var el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.remove("show"); }, 1600);
    }

    function val(v) {
      if (v == null || v === "") return '<span class="empty">--</span>';
      return v;
    }

    function statusTag(s) {
      if (s === "ok") return '<span class="tag tag-ok">正常</span>';
      if (s === "no") return '<span class="tag tag-no">异常</span>';
      return '<span class="tag tag-done">—</span>';
    }

    function trackTag(s) {
      if (s === "ok") return '<span class="tag tag-ok">已解决</span>';
      if (s === "no") return '<span class="tag tag-no">仍未解决</span>';
      return '<span class="tag tag-done">待确认</span>';
    }

    function dimHtml(list) {
      if (!list || !list.length) return "--";
      return '<ul class="dim-list">' + list.map(function (d) {
        return (
          "<li><div><div>" + d.name + "</div>" +
          (d.problem ? '<div class="dim-problem">' + d.problem + "</div>" : "") +
          "</div>" + statusTag(d.status) + "</li>"
        );
      }).join("") + "</ul>";
    }

    function thumbs(arr) {
      if (!arr || !arr.length) return "--";
      return (
        '<div class="media-cell">' +
        arr.map(function (name) {
          return (
            '<div class="thumb" data-preview="' + name + '">' +
            '<div class="placeholder">' + name + "</div>" +
            '<div class="mask">👁 点击预览</div>' +
            "</div>"
          );
        }).join("") +
        "</div>"
      );
    }

    function row(k, v) {
      return "<tr><th>" + k + "</th><td>" + v + "</td></tr>";
    }

    function section(title, rowsHtml) {
      return (
        '<div class="sec-block">' +
        '<div class="sec-title">' + title + "</div>" +
        '<table class="detail-table">' + rowsHtml + "</table>" +
        "</div>"
      );
    }

    function validTag(valid) {
      if (valid === false) return '<span class="tag tag-wait">无效</span>';
      return '<span class="tag tag-ok">有效</span>';
    }

    function render(r) {
      var baseRows =
        row("拜访时间", val(r.visitTime)) +
        row("是否有效", validTag(r.valid)) +
        row("报告编号", val(r.reportNo)) +
        row("客户名称", val(r.customer)) +
        row("手机号", val(r.phone)) +
        row("技术老师", val(r.teacher)) +
        row("技术老师手机号", val(r.teacherPhone)) +
        row("汇报日期", val(r.date)) +
        row("拜访次数", "第" + r.visitNo + "次拜访") +
        row("拜访方式", val(r.mode)) +
        row("发送客户群", r.sent ? '<span class="tag-sent">已发送</span>' : '<span class="tag-unsent">未发送</span>') +
        row("关联工单", val(r.orderId)) +
        row("陪访人员", val(r.companion));

      var flockRows =
        row("养殖类型", val(r.flockType)) +
        row("养殖品种", val(r.flockBreed)) +
        row("合作规模", val(r.flockScale)) +
        row("鸡群巡检维度", dimHtml(r.flockDims));

      var shedRows = row("场舍巡检维度", dimHtml(r.shedDims));

      var trackRows = "";
      if (r.tracks && r.tracks.length) {
        trackRows = r.tracks.map(function (t, i) {
          return row(
            "历史问题" + (i + 1),
            t.title + " · " + t.time + " " + trackTag(t.status)
          );
        }).join("");
      } else {
        trackRows = row("历史问题", "--");
      }

      var summaryText = (r.summary && r.summary.length) ? r.summary.join("；") : "--";
      var resultRows =
        row("问题汇总", summaryText === "--" ? val("") : summaryText) +
        row("处理方案", '<div class="plan-text">' + (r.plan || "--") + "</div>") +
        row("问题照片", thumbs(r.problemPhotos));

      var checkinRows =
        row("签到地址", r.mode === "实地拜访" ? val(r.address) : "--") +
        row("签到拍照", r.mode === "实地拜访" ? thumbs(r.checkinPhotos) : "--") +
        row("自拍照片", r.mode === "实地拜访" ? thumbs(r.selfiePhotos) : "--") +
        row("自拍照识别", r.selfieRecog ? '<span class="recog">' + r.selfieRecog + "</span>" : "--");

      $("detail-body").innerHTML =
        section("养殖技术巡场报告", baseRows) +
        section("鸡群信息", flockRows) +
        section("养殖场舍检查", shedRows) +
        section("服务问题追踪", trackRows) +
        section("问题与方案", resultRows) +
        section("现场签到", checkinRows);
    }

    $("detail-body").addEventListener("click", function (e) {
      var thumb = e.target.closest(".thumb[data-preview]");
      if (!thumb) return;
      $("preview-box").textContent = thumb.getAttribute("data-preview") + " · 预览（原型）";
      $("preview-mask").classList.add("show");
    });

    $("preview-mask").addEventListener("click", function () {
      $("preview-mask").classList.remove("show");
    });

    $("btn-close").addEventListener("click", function () {
      if (document.referrer) history.back();
      else window.location.assign("巡场报告拜访列表.html");
    });

    var report = reportDb[getId()] || reportDb["R20260804001"];
    render(report);
  </script>
</body>
</html>
