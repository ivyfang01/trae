<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>钉钉 · 鸡蛋物流详情 · 开始卸货</title>
  <style>
    :root {
      --primary: #1677ff;
      --bg: #f2f3f5;
      --text: #333;
      --label: #8c8c8c;
      --line: #f0f0f0;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #dcdcdc;
      color: var(--text);
      font-size: 14px;
    }
    .phone {
      width: 375px;
      min-height: 812px;
      margin: 24px auto;
      background: var(--bg);
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      padding-bottom: calc(72px + var(--safe-bottom));
      position: relative;
      overflow: hidden;
    }
    .nav {
      height: 44px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #eee;
      font-size: 17px;
      font-weight: 600;
    }
    .nav-back {
      position: absolute; left: 0; height: 44px; padding: 0 12px;
      display: flex; align-items: center; font-size: 20px;
    }
    .card {
      background: #fff;
      margin: 12px;
      border-radius: 8px;
      padding: 12px;
    }
    .card h3 {
      font-size: 14px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .row {
      display: flex;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .row .lab { width: 88px; color: var(--label); flex-shrink: 0; }
    .row .val { flex: 1; word-break: break-all; }
    .node {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f7f7f7;
      font-size: 13px;
    }
    .node:last-child { border-bottom: none; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #1677ff; margin-top: 5px; flex-shrink: 0;
    }
    .footer {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      padding: 10px 12px calc(10px + var(--safe-bottom));
      box-shadow: 0 -2px 8px rgba(0,0,0,.06);
      display: flex;
      gap: 10px;
    }
    .footer button {
      flex: 1;
      height: 40px;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-ghost { border: 1px solid #d9d9d9; background: #fff; color: #595959; }
    .btn-primary { border: none; background: var(--primary); color: #fff; }
    .btn-primary:disabled { background: #91caff; cursor: not-allowed; }
    .mask {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: flex-end;
      z-index: 20;
    }
    .mask.show { display: flex; }
    .sheet {
      width: 100%;
      background: #fff;
      border-radius: 12px 12px 0 0;
      padding: 16px 14px calc(16px + var(--safe-bottom));
    }
    .sheet h4 { font-size: 16px; margin-bottom: 8px; text-align: center; }
    .sheet .desc { font-size: 12px; color: var(--label); margin-bottom: 12px; line-height: 1.5; }
    .opt {
      display: flex;
      gap: 8px;
      padding: 12px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      margin-bottom: 8px;
      align-items: flex-start;
    }
    .opt.active { border-color: var(--primary); background: #f0f5ff; }
    .opt .t { font-size: 14px; }
    .opt .d { font-size: 12px; color: var(--label); margin-top: 4px; }
    .sheet-ft { display: flex; gap: 10px; margin-top: 12px; }
    .sheet-ft button {
      flex: 1; height: 40px; border-radius: 6px; font-size: 15px; font-family: inherit; cursor: pointer;
    }
    .toast {
      position: absolute;
      left: 50%; top: 40%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.78);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 30;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="nav">
      <span class="nav-back">‹</span>
      物流单详情
    </div>

    <div class="card">
      <h3>订单信息</h3>
      <div class="row"><div class="lab">物流单号</div><div class="val">JDWL202609080018</div></div>
      <div class="row"><div class="lab">状态</div><div class="val" id="st">运输中（已装货）</div></div>
      <div class="row"><div class="lab">司机</div><div class="val">李师傅 138****2210</div></div>
      <div class="row"><div class="lab">卸货地址</div><div class="val">河南郑州某某农贸市场</div></div>
    </div>

    <div class="card">
      <h3>履约节点</h3>
      <div class="node"><div class="dot"></div><div><div>开始接单</div><div style="color:#8c8c8c;font-size:12px">2026-09-08 08:12:05 · 司机端</div></div></div>
      <div class="node"><div class="dot"></div><div><div>开始装货</div><div style="color:#8c8c8c;font-size:12px">2026-09-08 09:05:33 · 司机端</div></div></div>
      <div class="node" id="nodeUnload" style="display:none"><div class="dot"></div><div><div>开始卸货</div><div style="color:#8c8c8c;font-size:12px" id="unloadMeta">—</div></div></div>
    </div>

    <div class="footer">
      <button type="button" class="btn-ghost">查看轨迹</button>
      <button type="button" class="btn-primary" id="btnStart">开始卸货</button>
    </div>

    <div class="mask" id="mask">
      <div class="sheet">
        <h4>确认开始卸货</h4>
        <div class="desc">请选择经纬度取值方式（后台代操作）</div>
        <label class="opt active">
          <input type="radio" name="geo" value="addr" checked style="margin-top:3px" />
          <div>
            <div class="t">使用卸货地址经纬度</div>
            <div class="d">113.665412, 34.757975</div>
          </div>
        </label>
        <label class="opt">
          <input type="radio" name="geo" value="none" style="margin-top:3px" />
          <div>
            <div class="t">不取经纬度</div>
            <div class="d">仅记录时间与操作人</div>
          </div>
        </label>
        <div class="sheet-ft">
          <button type="button" class="btn-ghost" id="btnCancel">取消</button>
          <button type="button" class="btn-primary" id="btnOk">确认</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const $ = (s, root = document) => root.querySelector(s);
    const phone = $(".phone");
    function toast(msg) {
      const el = $("#toast", phone);
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }
    function nowStr() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    phone.querySelectorAll(".opt").forEach((el) => {
      el.addEventListener("click", () => {
        phone.querySelectorAll(".opt").forEach((o) => o.classList.remove("active"));
        el.classList.add("active");
        el.querySelector("input").checked = true;
      });
    });
    $("#btnStart", phone).addEventListener("click", () => $("#mask", phone).classList.add("show"));
    $("#btnCancel", phone).addEventListener("click", () => $("#mask", phone).classList.remove("show"));
    $("#btnOk", phone).addEventListener("click", () => {
      const mode = phone.querySelector('input[name="geo"]:checked').value;
      const geo = mode === "addr" ? "卸货地址经纬度 113.665412, 34.757975" : "未取经纬度";
      $("#nodeUnload", phone).style.display = "flex";
      $("#unloadMeta", phone).textContent = `${nowStr()} · 钉钉后台 · ${geo}`;
      $("#st", phone).textContent = "运输中（已开始卸货）";
      const btn = $("#btnStart", phone);
      btn.disabled = true;
      btn.textContent = "已开始卸货";
      $("#mask", phone).classList.remove("show");
      toast("开始卸货成功");
    });
  </script>
</body>
</html>
