<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的客户</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app edit-app">
    <!-- 搜索栏 -->
    <header class="search-bar">
      <input
        type="text"
        class="search-input"
        placeholder="客户手机号/名字/id"
      />
      <button class="search-btn">查询</button>
    </header>

    <!-- 客户卡片列表 -->
    <main class="customer-list">
      <article class="customer-card">
        <div class="card-header">
          <h2 class="company-name">泰州市红羽禽业有限公司</h2>
          <span class="source-tag">粮巴巴</span>
        </div>
        <div class="card-tags">
          <span class="tag tag-success">已成交</span>
          <span class="tag">猪</span>
          <span class="tag">1000头</span>
          <span class="tag tag-id">id: 888888</span>
        </div>
        <div class="card-info">
          <span class="info-time">2026-03-05 14:00</span>
          <span class="info-phone">18019999090</span>
        </div>
        <p class="card-address">河南省驻马店市县镇AA村AA道</p>
        <div class="card-footer">
          <a href="edit.html?id=1" class="edit-btn">修改</a>
        </div>
      </article>

      <article class="customer-card">
        <div class="card-header">
          <h2 class="company-name">上海浦耀贸易有限公司</h2>
          <span class="source-tag">粮巴巴</span>
        </div>
        <div class="card-tags">
          <span class="tag tag-expired">已失效</span>
          <span class="tag">鸡</span>
          <span class="tag">300000羽</span>
          <span class="tag">id:99999</span>
        </div>
        <div class="card-info">
          <span class="info-time">2026-03-05 14:00</span>
          <span class="info-phone">18019999090</span>
        </div>
        <p class="card-address">河南省驻马店市县镇AA村AA道</p>
        <div class="card-footer">
          <a href="edit.html?id=2" class="edit-btn">修改</a>
        </div>
      </article>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-text">我的客户</span>
      </a>
      <a href="duplicate-check.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
          <path d="M8 11h6"/>
        </svg>
        <span class="nav-text">客户查重</span>
      </a>
      <a href="add-customer.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span class="nav-text">添加客户</span>
      </a>
      <a href="operation-records.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span class="nav-text">操作记录</span>
      </a>
    </nav>
  </div>
</body>
</html>
