<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>操作记录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app edit-app">
    <header class="page-header page-header-tab">
      <h1 class="page-title">操作记录</h1>
    </header>

    <div class="record-tabs">
      <button type="button" class="record-tab active" data-tab="duplicate">查重记录</button>
      <button type="button" class="record-tab" data-tab="add">添加记录</button>
      <button type="button" class="record-tab" data-tab="invalid">失效记录</button>
      <button type="button" class="record-tab" data-tab="edit">修改记录</button>
    </div>

    <main class="record-panel active" id="panel-duplicate">
      <ul class="record-list" id="duplicateRecordList"></ul>
    </main>

    <main class="record-panel" id="panel-add">
      <ul class="record-list" id="addRecordList"></ul>
    </main>

    <main class="record-panel" id="panel-invalid">
      <ul class="record-list" id="invalidRecordList"></ul>
    </main>

    <main class="record-panel" id="panel-edit">
      <ul class="record-list" id="editRecordList"></ul>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-text">我的客户</span>
      </a>
      <a href="duplicate-check.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
          <path d="M8 11h6"/>
        </svg>
        <span class="nav-text">客户查重</span>
      </a>
      <a href="add-customer.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span class="nav-text">添加客户</span>
      </a>
      <a href="operation-records.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span class="nav-text">操作记录</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
