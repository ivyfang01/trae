<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>客户查重</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app edit-app">
    <header class="page-header page-header-tab">
      <h1 class="page-title">客户查重</h1>
      <div class="edit-mode-switch">
        <label class="switch">
          <input type="checkbox" id="editModeToggle">
          <span class="slider round"></span>
        </label>
        <span class="switch-label">编辑模式</span>
      </div>
    </header>

    <form class="edit-form" id="duplicateForm">
      <div class="form-item form-item-hint">
        <label class="form-label"><span class="required">*</span>客户名字</label>
        <div class="form-control">
          <div class="form-field">
            <input type="text" class="form-input" name="name" id="dupName" placeholder="请填写" />
          </div>
          <p class="form-hint">请填写客户完整真实的名字</p>
        </div>
      </div>

      <div class="form-item">
        <label class="form-label">客户手机号</label>
        <div class="form-control">
          <div class="form-field">
            <input type="tel" class="form-input" name="phone" id="dupPhone" value="18019249090" />
          </div>
        </div>
      </div>

      <!-- <div class="form-item">
        <label class="form-label">地址区域</label>
        <div class="form-control">
          <div class="custom-select" data-target="dupRegion">
            <button type="button" class="form-field form-field-picker custom-select-trigger">
              <span class="form-value form-value-placeholder" id="dupRegionDisplay">请选择</span>
              <svg class="field-icon field-icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <input type="hidden" name="region" id="dupRegion" value="" />
          </div>
        </div>
      </div> -->

      <div class="form-item">
        <label class="form-label">客户地址</label>
        <div class="form-control">
          <button type="button" class="form-field form-field-location" id="dupLocationBtn">
            <svg class="location-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span class="location-text form-value-placeholder" id="dupLocationText">选择定位地址</span>
            <svg class="field-icon field-icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-actions form-actions-single">
        <button type="submit" class="btn btn-submit btn-block">查询</button>
      </div>
    </form>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-text">我的客户</span>
      </a>
      <a href="duplicate-check.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
          <path d="M8 11h6"/>
        </svg>
        <span class="nav-text">客户查重</span>
      </a>
      <a href="add-customer.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span class="nav-text">添加客户</span>
      </a>
      <a href="operation-records.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span class="nav-text">操作记录</span>
      </a>
    </nav>
  </div>

  <div class="picker-overlay" id="pickerOverlay" hidden>
    <div class="picker-mask" id="pickerMask"></div>
    <div class="picker-sheet">
      <ul class="picker-list" id="pickerList"></ul>
      <button type="button" class="picker-cancel" id="pickerCancel">取消</button>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="custom-alert" id="customAlert" hidden>
      <h3 class="alert-title" id="alertTitle">查重提醒</h3>
      <p class="alert-message" id="alertMessage"></p>
      <button type="button" class="alert-confirm" id="alertConfirm">确定</button>
    </div>
    <div class="toast" id="toast" hidden>
      <span id="toastMessage"></span>
    </div>
  </div>

  <!-- 查重结果弹窗 -->
  <div class="result-overlay" id="resultOverlay" hidden>
    <div class="result-modal">
      <div class="result-header">
        <h2 class="result-title">客户查重</h2>
        <button type="button" class="result-close" id="resultClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="result-body" id="resultBody"></div>
      <div class="result-footer" id="resultFooter"></div>
    </div>
  </div>

  <!-- 编辑模式指示器 -->
  <div class="edit-indicator" id="editIndicator" hidden>编辑模式</div>

  <!-- 编辑模式工具栏 -->
  <div class="edit-toolbar" id="editToolbar">
    <button class="btn-add-field" id="btnAddField">添加字段</button>
    <button class="btn-save" id="btnSave">保存修改</button>
    <button class="btn-export" id="btnExport">导出HTML</button>
    <button class="btn-cancel" id="btnCancelEdit">取消编辑</button>
  </div>

  <!-- 添加字段弹窗 -->
  <div class="overlay" id="addFieldOverlay" hidden>
    <div class="add-field-modal">
      <div class="modal-header">
        <h3>添加新字段</h3>
        <button type="button" class="modal-close" id="addFieldClose">×</button>
      </div>
      <div class="modal-body">
        <div class="form-item">
          <label>字段标签</label>
          <input type="text" id="fieldLabel" placeholder="例如：客户邮箱">
        </div>
        <div class="form-item">
          <label>字段类型</label>
          <select id="fieldType">
            <option value="text">文本输入</option>
            <option value="tel">手机号</option>
            <option value="select">下拉选择</option>
            <option value="textarea">多行文本</option>
            <option value="location">地址选择</option>
          </select>
        </div>
        <div class="form-item">
          <label>是否必填</label>
          <input type="checkbox" id="fieldRequired">
        </div>
        <div class="form-item" id="selectOptionsContainer" hidden>
          <label>下拉选项（用逗号分隔）</label>
          <input type="text" id="selectOptions" placeholder="选项1,选项2,选项3">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-cancel" id="addFieldCancel">取消</button>
        <button type="button" class="btn btn-submit" id="addFieldConfirm">添加</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
