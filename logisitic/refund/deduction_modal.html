<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扣款弹窗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal-body {
            padding: 24px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-label {
            width: 120px;
            font-size: 14px;
            color: #666;
            flex-shrink: 0;
        }

        .form-label .required {
            color: #ff4d4f;
            margin-right: 2px;
        }

        .form-value {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .form-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        .form-input:focus {
            outline: none;
            border-color: #1890ff;
        }

        .form-select {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #1890ff;
        }

        .input-with-unit {
            flex: 1;
            position: relative;
        }

        .input-with-unit input {
            width: 100%;
            padding-right: 40px;
        }

        .input-unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #666;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radio-item input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .radio-item label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }

        .form-textarea {
            flex: 1;
            min-height: 80px;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            background: #fff;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #1890ff;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #d9d9d9;
            background: #fff;
            color: #333;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        .btn-primary {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }

        .btn-primary:hover {
            background: #096dd9;
            border-color: #096dd9;
            color: #fff;
        }

        .bank-link {
            color: #1890ff;
            text-decoration: none;
        }

        .bank-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header">
                <h2 class="modal-title">扣款</h2>
                <div class="modal-close" onclick="closeModal()">×</div>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <!-- 手机号码 -->
                <div class="form-row">
                    <div class="form-label">手机号码:</div>
                    <div class="form-value">15811110000</div>
                </div>

                <!-- 当前余额 -->
                <div class="form-row">
                    <div class="form-label">当前余额:</div>
                    <div class="form-value">2954632.69</div>
                </div>

                <!-- 扣款账户 -->
                <div class="form-row">
                    <div class="form-label">
                        <span class="required">*</span>扣款账户:
                    </div>
                    <div class="form-value radio-group">
                        <div class="radio-item">
                            <input type="radio" id="bank1" name="bank">
                            <label for="bank1">上海银行账户</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="bank2" name="bank" checked>
                            <label for="bank2">锡商银行账户</label>
                        </div>
                        <!-- <div class="radio-item">
                            <input type="radio" id="bank3" name="bank">
                            <label for="bank3">锡商银行账户</label>
                        </div> -->
                    </div>
                </div>

                <!-- 扣款金额 -->
                <div class="form-row">
                    <div class="form-label">扣款金额:</div>
                    <div class="input-with-unit">
                        <input type="number" class="form-input" id="amount" placeholder="请输入扣款金额" oninput="calculateBalance()">
                        <span class="input-unit">元</span>
                    </div>
                </div>

                <!-- 退回账户 -->
                <div class="form-row">
                    <div class="form-label">退回账户:</div>
                    <div class="form-value">
                        <select class="form-select">
                            <option value="">请选择退回账户</option>
                            <option value="hongchenglu">鸿程路</option>
                            <option value="shanghaihuiyao">上海慧耀运费账户</option>
                            <option value="shunming">顺铭</option>
                            <option value="xingtai">邢台</option>
                        </select>
                    </div>
                </div>

                <!-- 扣款后余额 -->
                <div class="form-row">
                    <div class="form-label">扣款后余额:</div>
                    <div class="form-value" id="remaining-balance">2954632.69</div>
                </div>

                <!-- 备注 -->
                <div class="form-row">
                    <div class="form-label">
                        <span class="required">*</span>备注:
                    </div>
                    <textarea class="form-textarea" placeholder="请输入备注"></textarea>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmDeduction()">确定</button>
            </div>
        </div>
    </div>

    <script>
        const initialBalance = 2954632.69;

        function calculateBalance() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const remaining = initialBalance - amount;
            document.getElementById('remaining-balance').textContent = remaining.toFixed(2);
        }

        function closeModal() {
            alert('已取消扣款');
        }

        function confirmDeduction() {
            alert('扣款成功！');
        }
    </script>
</body>
</html>
