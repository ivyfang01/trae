<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>退款管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.5;
        }

        .container {
            max-width: 100%;
            padding: 24px;
            margin: 0 auto;
        }

        .page-header {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 24px;
        }

        /* 搜索筛选区域 */
        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-label {
            min-width: 80px;
            text-align: right;
            font-size: 14px;
            color: #666;
        }

        .form-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
        }

        .form-select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #1890ff;
        }

        /* 按钮区域 */
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #d9d9d9;
            background: #fff;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }

        .btn-primary:hover {
            background: #40a9ff;
            border-color: #40a9ff;
        }

        .btn-default {
            color: #666;
        }

        .btn-default:hover {
            color: #1890ff;
            border-color: #1890ff;
        }

        /* 数据表格 */
        .data-table {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .table-header {
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #fafafa;
        }

        th, td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        td {
            font-size: 14px;
            color: #666;
        }

        tr:hover {
            background: #fafafa;
        }

        /* 状态标签 */
        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .status-success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }

        .status-warning {
            background: #fffbe6;
            color: #faad14;
            border: 1px solid #ffe58f;
        }

        .status-error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }

        .status-processing {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }

        /* 操作链接 */
        .action-link {
            color: #1890ff;
            cursor: pointer;
            margin-right: 8px;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 16px 24px;
        }

        .pagination-info {
            font-size: 14px;
            color: #666;
        }

        .pagination-btn {
            padding: 4px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: #1890ff;
            color: #1890ff;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">扣款管理</h1>
            
            <!-- 搜索筛选表单 -->
            <div class="search-form">
                <div class="form-row">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-input" placeholder="请选择">
                </div>
                <div class="form-row">
                    <label class="form-label">手机号</label>
                    <input type="text" class="form-input" placeholder="请输入">
                </div>
                <div class="form-row">
                    <label class="form-label">主体id</label>
                    <input type="text" class="form-input" placeholder="请输入">
                </div>
                

            <!-- 操作按钮 -->
            <div class="action-bar">
                <button class="btn btn-default">重置</button>
                <button class="btn btn-primary">查询</button>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="data-table">
            <div class="table-header">
                <h2 class="table-title">司机/众包方列表</h2>
                <!-- <button class="btn btn-primary">导出</button> -->
            </div>
            <table>
                <thead>
                    <tr>
                        <th>主体id</th>
                        <th>姓名</th>
                        <th>账户类型</th>
                        <th>账号</th>
                        <th>账号状态</th>
                        <th>上银开户状态</th>
                        <th>锡商开户状态</th>
                        <th>上银绑卡状态</th>
                        <th>锡商绑卡状态</th>
                        <th>是否代收账户</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>51000065775</td>
                        <td>方伟萍</td>
                        <td>司机</td>
                        <td>138****1234</td>
                        <td>启用</td>
                        <td>已开户</td>
                        <td>未开户</td>
                        <td>已绑卡</td>
                        <td>未绑卡</span></td>
                        <td>否</td>
                        <td>
                            <span class="action-link">扣款</span>
                            <span class="action-link">申请记录</span>
                        </td>
                    </tr>
                    <tr>
                        <td>51000065775</td>
                        <td>方伟萍</td>
                        <td>众包</td>
                        <td>138****1234</td>
                        <td>启用</td>
                        <td>已开户</td>
                        <td>未开户</td>
                        <td>已绑卡</td>
                        <td>未绑卡</span></td>
                        <td>否</td>
                        <td>
                            <span class="action-link">扣款</span>
                            <span class="action-link">申请记录</span>
                        </td>
                    </tr>
                    
                </tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination">
                <div class="pagination-info">共 128 条</div>
                <button class="pagination-btn" disabled>上一页</button>
                <button class="pagination-btn active">1</button>
                <button class="pagination-btn">2</button>
                <button class="pagination-btn">3</button>
                <button class="pagination-btn">4</button>
                <button class="pagination-btn">5</button>
                <button class="pagination-btn">下一页</button>
            </div>
        </div>
    </div>
</body>
</html>
