<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>下单物流订单</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="nav">
      <a class="nav-back" href="03-order-list.html">‹</a>
      <div class="nav-title">下单物流订单</div>
    </div>

    <div class="card" style="margin-top: 8px">
      <div class="form-item">
        <label><span class="req">*</span>货物名称</label>
        <input type="text" placeholder="请输入货物名称" value="豆粕 42%" />
      </div>
      <div class="form-item">
        <label><span class="req">*</span>吨数</label>
        <input type="number" placeholder="请输入吨数" value="33" />
        <span class="addon">吨</span>
      </div>
      <div class="form-item stack">
        <label><span class="req">*</span>装货地</label>
        <a class="addr-select" href="javascript:;">
          <span class="addr-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#c0c0c0" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
          </span>
          <span class="addr-text placeholder">选择定位地址</span>
          <span class="addr-arrow">›</span>
        </a>
      </div>
      <div class="form-item stack">
        <label><span class="req">*</span>卸货地</label>
        <a class="addr-select" href="javascript:;">
          <span class="addr-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#c0c0c0" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
          </span>
          <span class="addr-text placeholder">选择定位地址</span>
          <span class="addr-arrow">›</span>
        </a>
      </div>
      <div class="form-item">
        <label><span class="req">*</span>配送日期</label>
        <input type="date" value="2026-07-22" />
        <span class="arrow">›</span>
      </div>
      <div class="form-item">
        <label>运费</label>
        <span class="value strong" style="flex:1;text-align:right;color:var(--brand);font-weight:700">
          ¥ 2,640.00
        </span>
      </div>
    </div>

    <p class="hint">运费按运费模板自动计算：80 元/吨 × 33 吨 = 2,640 元</p>

    <!-- <label class="agree">
      <input type="checkbox" checked />
      <span>我已阅读并同意 <a href="javascript:;">《运输协议》</a>，确认货物信息与线路无误</span>
    </label> -->

    <div class="footer-bar">
      <a class="btn-block btn-primary" href="02-pay.html">确认下单</a>
    </div>
  </div>
</body>
</html>
