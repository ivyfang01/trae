<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>支付运费</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .footer-bar .btn-primary {
      background: #2f7cf6;
    }
  </style>
</head>
<body>
  <div class="phone" id="page">
    <div class="nav">
      <a class="nav-back" href="01-create-order.html">‹</a>
      <div class="nav-title">支付运费</div>
    </div>

    <div class="pay-amount">
      <div class="label">应付运费</div>
      <div class="num"><em>¥</em>2,640.00</div>
    </div>

    <div class="card" style="margin-top: 8px">
      <div class="card-block">
        <div class="card-title">订单信息</div>
        <div class="row">
          <span class="label">货物名称</span>
          <span class="value">豆粕 42%</span>
        </div>
        <div class="row">
          <span class="label">吨数</span>
          <span class="value">33 吨</span>
        </div>
        <div class="row">
          <span class="label">配送日期</span>
          <span class="value">2026-07-22</span>
        </div>
        <div class="row">
          <span class="label">订单编号</span>
          <span class="value">
            WL20260720001
            <a class="link" href="javascript:;" style="margin-left:6px">复制</a>
          </span>
        </div>
        <div class="row">
          <span class="label">创建日期</span>
          <span class="value">2026-07-20</span>
        </div>
        <div class="row">
          <span class="label">装货地址</span>
          <span class="value">江苏省南通市通州区某某饲料厂</span>
        </div>
        <div class="row">
          <span class="label">卸货地址</span>
          <span class="value">安徽省合肥市肥东县某某养殖场</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-block pay-methods">
        <div class="card-title">支付方式</div>
        <label class="method">
          <span class="icon">微</span>
          <span class="name">微信支付</span>
          <input type="radio" name="pay" checked />
        </label>
        <label class="method">
          <span class="icon alipay">支</span>
          <span class="name">支付宝</span>
          <input type="radio" name="pay" />
        </label>
      </div>
    </div>

    <div class="footer-bar">
      <a class="btn-block btn-primary" href="04-order-detail.html">确认支付 ¥2,640.00</a>
    </div>
  </div>
</body>
</html>
