<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>有赞订单管理 · Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: rgba(0,0,0,.85);
      font-size: 14px;
      line-height: 1.5715;
      padding: 24px;
    }
    .page {
      max-width: 1400px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      min-height: calc(100vh - 48px);
    }
    .page-hd {
      padding: 14px 24px;
      border-bottom: 1px solid #f0f0f0;
    }
    .page-hd h1 { font-size: 16px; font-weight: 600; }
    .page-bd { padding: 16px 24px 28px; }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 16px;
      margin-bottom: 12px;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .field label {
      flex-shrink: 0;
      width: 100px;
      text-align: right;
      color: rgba(0,0,0,.65);
      font-size: 13px;
    }
    .field label .new { color: #fa8c16; font-size: 11px; margin-left: 2px; }
    .field input,
    .field select {
      flex: 1;
      min-width: 0;
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      padding: 0 11px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .field input:focus,
    .field select:focus { border-color: #40a9ff; }
    .field.highlight select {
      border-color: #ffa940;
      background: #fffbe6;
    }
    .range {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .range input { flex: 1; }
    .range .sep { color: #999; flex-shrink: 0; }
    .filter-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 15px;
      font-size: 14px;
      border-radius: 2px;
      border: 1px solid #d9d9d9;
      background: #fff;
      color: rgba(0,0,0,.85);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:hover { color: #40a9ff; border-color: #40a9ff; }
    .btn-primary {
      background: #1890ff;
      border-color: #1890ff;
      color: #fff;
    }
    .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }
    .btn-link {
      border: none;
      background: transparent;
      color: #1890ff;
      height: auto;
      padding: 0 4px;
      font-size: 13px;
    }
    .btn-link:hover { color: #40a9ff; }
    .btn-link:disabled,
    .btn-link.done {
      color: rgba(0,0,0,.25);
      cursor: not-allowed;
    }

    .table-wrap { width: 100%; overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1680px;
    }
    th, td {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 10px;
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      background: #fafafa;
      font-weight: 500;
      color: rgba(0,0,0,.85);
    }
    tbody tr:nth-child(even) { background: #fafafa; }
    tbody tr:hover { background: #e6f7ff; }
    .muted { color: rgba(0,0,0,.25); }
    .num { font-variant-numeric: tabular-nums; }
    .col-new { background: #fffbe6 !important; }
    th.col-new { color: #d48806; }
    .tag {
      display: inline-block;
      padding: 0 8px;
      height: 22px;
      line-height: 20px;
      font-size: 12px;
      border-radius: 2px;
      border: 1px solid transparent;
    }
    .tag-wx { background: #e6f7ff; border-color: #91d5ff; color: #096dd9; }
    .tag-sv { background: #fff7e6; border-color: #ffd591; color: #d48806; }
    .tag-mix { background: #f9f0ff; border-color: #d3adf7; color: #722ed1; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: rgba(0,0,0,.65);
    }
    .pagination .total { margin-right: auto; }
    .pagination .pages { display: flex; gap: 4px; align-items: center; }
    .pagination .pg-btn {
      min-width: 32px; height: 32px; padding: 0 8px;
      border: 1px solid #d9d9d9; border-radius: 2px;
      background: #fff; cursor: pointer; font-family: inherit; font-size: 13px;
    }
    .pagination .pg-btn.active {
      background: #1890ff; border-color: #1890ff; color: #fff;
    }
    .pagination .pg-btn:disabled {
      color: rgba(0,0,0,.25); cursor: not-allowed; background: #f5f5f5;
    }
    .pagination select, .pagination input {
      height: 32px; border: 1px solid #d9d9d9; border-radius: 2px;
      padding: 0 8px; font-family: inherit; font-size: 13px;
    }
    .pagination input { width: 48px; text-align: center; }

    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: 420px;
      max-width: 100%;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      overflow: hidden;
    }
    .modal-hd {
      padding: 16px 24px 8px;
      font-size: 16px;
      font-weight: 600;
    }
    .modal-bd {
      padding: 8px 24px 16px;
      font-size: 14px;
      color: rgba(0,0,0,.65);
      line-height: 1.7;
    }
    .modal-bd .em { color: rgba(0,0,0,.85); font-weight: 500; }
    .modal-ft {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 24px 16px;
    }
    .toast {
      position: fixed;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 1100px) {
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-hd">
      <h1>有赞订单管理</h1>
    </div>
    <div class="page-bd">
      <div class="filter-grid">
        <div class="field">
          <label>收货人</label>
          <input type="text" placeholder="请输入" />
        </div>
        <div class="field">
          <label>收货人手机号</label>
          <input type="text" placeholder="请输入" />
        </div>
        <div class="field">
          <label>销售名字</label>
          <input type="text" placeholder="请输入" />
        </div>
        <div class="field">
          <label>客户手机号</label>
          <input type="text" placeholder="请输入" />
        </div>
        <div class="field">
          <label>订单状态</label>
          <select>
            <option>全部</option>
            <option>WAIT_BUYER_CONFIRM_GOODS</option>
            <option>WAIT_SELLER_SEND_GOODS</option>
            <option>TRADE_CLOSED</option>
          </select>
        </div>
        <div class="field highlight">
          <label>支付方式<span class="new">新</span></label>
          <select id="payFilter">
            <option value="全部">全部</option>
            <option value="微信支付">微信支付</option>
            <option value="储值卡支付">储值卡支付</option>
            <option value="组合支付">组合支付</option>
          </select>
        </div>
        <div class="field">
          <label>订单创建时间</label>
          <div class="range">
            <input type="text" placeholder="开始日期" />
            <span class="sep">→</span>
            <input type="text" placeholder="结束日期" />
          </div>
        </div>
        <div class="field">
          <label>发货时间</label>
          <div class="range">
            <input type="text" placeholder="开始日期" />
            <span class="sep">→</span>
            <input type="text" placeholder="结束日期" />
          </div>
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="btnSearch">查询</button>
        <button type="button" class="btn" id="btnReset">重置</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>有赞订单号</th>
              <th>分销类型</th>
              <th>订单状态</th>
              <th>支付方式</th>
              <th>收货人</th>
              <th>收货人手机号</th>
              <th>买家名称</th>
              <th>买家手机号</th>
              <th>粮巴巴客户ID</th>
              <th>业务员名称</th>
              <th>业务员手机号</th>
              <th>业务员ID</th>
              <th>实付金额(元)</th>
              <th class="col-new">佣金金额(元)</th>
              <th class="col-new">确认收货时间</th>
              <th class="col-new">商品ID</th>
              <th class="col-new">商品名称</th>
              <th class="col-new">确认还款时间</th>
              <th class="col-new">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span class="total" id="pageTotal">共 0 条</span>
        <select id="pageSize">
          <option value="10" selected>10条/页</option>
          <option value="20">20条/页</option>
          <option value="50">50条/页</option>
        </select>
        <div class="pages" id="pageBtns"></div>
        <span>前往</span>
        <input type="text" id="gotoPage" value="1" />
        <span>页</span>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="confirmMask">
    <div class="modal">
      <div class="modal-hd">确认已还款</div>
      <div class="modal-bd" id="confirmText">
        确认该储值卡订单已还款？
      </div>
      <div class="modal-ft">
        <button type="button" class="btn" id="confirmCancel">取消</button>
        <button type="button" class="btn btn-primary" id="confirmOk">确认已还款</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var list = [

      { id: 5709, orderNo: "E202608291122334455", dist: "非分销", status: "WAIT_SELLER_SEND_GOODS", pay: "储值卡支付", receiver: "李四", rPhone: "13800138002", buyer: "李四", bPhone: "13800138002", custId: "10242", sales: "", sPhone: "", sId: "", amount: 698, commission: 13.96, confirmTime: "2026-08-29 18:20:11", goodsId: "SP10019", goodsName: "消毒粉 20kg", repaid: false },
      { id: 5708, orderNo: "E202608280998877665", dist: "分销", status: "WAIT_BUYER_CONFIRM_GOODS", pay: "组合支付", receiver: "王五", rPhone: "13800138003", buyer: "王五", bPhone: "13800138003", custId: "10243", sales: "朱震", sPhone: "13700002222", sId: "315", amount: 1349, commission: 0, confirmTime: "2026-08-28 21:05:44", goodsId: "SP10035", goodsName: "禽用多维 1kg", repaid: false },
      { id: 5707, orderNo: "E202608271122334466", dist: "非分销", status: "TRADE_CLOSED", pay: "微信支付", receiver: "赵六", rPhone: "13800138004", buyer: "赵六", bPhone: "13800138004", custId: "10244", sales: "", sPhone: "", sId: "", amount: 19.9, commission: null, confirmTime: "--", goodsId: "SP10008", goodsName: "碘伏消毒液 1L", repaid: false },
      { id: 5706, orderNo: "E202608260776655443", dist: "非分销", status: "WAIT_BUYER_CONFIRM_GOODS", pay: "储值卡支付", receiver: "钱七", rPhone: "13800138005", buyer: "钱七", bPhone: "13800138005", custId: "10245", sales: "孙畅", sPhone: "13900001111", sId: "208", amount: 2205, commission: 44.1, confirmTime: "2026-08-27 09:33:18", goodsId: "SP10021", goodsName: "动保消毒液 5L", repaid: false },
      { id: 5705, orderNo: "E202608250554433221", dist: "分销", status: "WAIT_SELLER_SEND_GOODS", pay: "微信支付", receiver: "孙八", rPhone: "13800138006", buyer: "孙八", bPhone: "13800138006", custId: "10246", sales: "", sPhone: "", sId: "", amount: 88, commission: null, confirmTime: "--", goodsId: "SP10012", goodsName: "球虫净 500ml", repaid: false },
      { id: 5704, orderNo: "E202608240332211009", dist: "非分销", status: "WAIT_BUYER_CONFIRM_GOODS", pay: "储值卡支付", receiver: "周九", rPhone: "13800138007", buyer: "周九", bPhone: "13800138007", custId: "10247", sales: "朱震", sPhone: "13700002222", sId: "315", amount: 560, commission: 11.2, confirmTime: "2026-08-25 14:08:52", goodsId: "SP10102", goodsName: "消毒粉 20kg", repaid: true, repayTime: "2026-08-26 10:05:22" },
      { id: 5703, orderNo: "E202608230110099887", dist: "非分销", status: "WAIT_BUYER_CONFIRM_GOODS", pay: "微信支付", receiver: "吴十", rPhone: "13800138008", buyer: "吴十", bPhone: "13800138008", custId: "10248", sales: "", sPhone: "", sId: "", amount: 126, commission: null, confirmTime: "2026-08-24 16:40:27", goodsId: "SP10088", goodsName: "球虫净 500ml", repaid: false },
      { id: 5702, orderNo: "E202608229988776655", dist: "非分销", status: "WAIT_SELLER_SEND_GOODS", pay: "储值卡支付", receiver: "郑十一", rPhone: "13800138009", buyer: "郑十一", bPhone: "13800138009", custId: "10249", sales: "孙畅", sPhone: "13900001111", sId: "208", amount: 399, commission: 7.98, confirmTime: "2026-08-23 11:12:09", goodsId: "SP10110", goodsName: "碘伏消毒液 1L", repaid: false },
      { id: 5701, orderNo: "E202608218877665544", dist: "分销", status: "WAIT_BUYER_CONFIRM_GOODS", pay: "微信支付", receiver: "冯十二", rPhone: "13800138010", buyer: "冯十二", bPhone: "13800138010", custId: "10250", sales: "", sPhone: "", sId: "", amount: 45.5, commission: null, confirmTime: "2026-08-22 19:55:01", goodsId: "SP10118", goodsName: "电解多维 500g", repaid: false },
      { id: 5700, orderNo: "E202608207766554433", dist: "非分销", status: "WAIT_BUYER_CONFIRM_GOODS", pay: "储值卡支付", receiver: "陈十三", rPhone: "13800138011", buyer: "陈十三", bPhone: "13800138011", custId: "10251", sales: "朱震", sPhone: "13700002222", sId: "315", amount: 980, commission: 19.6, confirmTime: "2026-08-21 08:26:33", goodsId: "SP10035", goodsName: "禽用多维 1kg", repaid: false },
      { id: 5699, orderNo: "E202608196655443322", dist: "非分销", status: "TRADE_CLOSED", pay: "微信支付", receiver: "褚十四", rPhone: "13800138012", buyer: "褚十四", bPhone: "13800138012", custId: "10252", sales: "", sPhone: "", sId: "", amount: 0, commission: null, confirmTime: "--", goodsId: "SP10021", goodsName: "动保消毒液 5L", repaid: false }
    ];

    var page = 1;
    var pageSize = 10;
    var pendingId = null;

    function toast(msg) {
      var el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.remove("show"); }, 1600);
    }

    function isStoredPay(pay) {
      return pay === "储值卡支付" || pay === "组合支付";
    }

    function payTag(pay) {
      if (pay === "微信支付") return '<span class="tag tag-wx">微信支付</span>';
      if (pay === "储值卡支付") return '<span class="tag tag-sv">储值卡支付</span>';
      if (pay === "组合支付") return '<span class="tag tag-mix">组合支付</span>';
      return pay;
    }

    function filtered() {
      var pay = document.getElementById("payFilter").value;
      return list.filter(function (r) {
        if (pay === "全部") return true;
        return r.pay === pay;
      });
    }

    function renderPagination(total) {
      var totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (page > totalPages) page = totalPages;
      document.getElementById("pageTotal").textContent = "共 " + total + " 条";
      document.getElementById("gotoPage").value = String(page);

      var html = "";
      html += '<button type="button" class="pg-btn" data-page="prev"' + (page <= 1 ? " disabled" : "") + ">&lt;</button>";
      for (var i = 1; i <= totalPages; i++) {
        if (totalPages > 7 && Math.abs(i - page) > 2 && i !== 1 && i !== totalPages) {
          if (i === 2 || i === totalPages - 1) html += "<span>…</span>";
          continue;
        }
        html += '<button type="button" class="pg-btn' + (i === page ? " active" : "") + '" data-page="' + i + '">' + i + "</button>";
      }
      html += '<button type="button" class="pg-btn" data-page="next"' + (page >= totalPages ? " disabled" : "") + ">&gt;</button>";
      document.getElementById("pageBtns").innerHTML = html;
    }

    function dash(v) {
      return v === "" || v == null ? '<span class="muted">--</span>' : v;
    }

    function render() {
      var rows = filtered();
      var total = rows.length;
      var totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (page > totalPages) page = totalPages;
      var start = (page - 1) * pageSize;
      var pageRows = rows.slice(start, start + pageSize);
      var tbody = document.getElementById("tbody");

      tbody.innerHTML = pageRows.map(function (r) {
        var showStored = isStoredPay(r.pay);
        var commissionCell = showStored && r.commission != null
          ? '<td class="num col-new">' + Number(r.commission).toFixed(2) + "</td>"
          : '<td class="col-new muted">--</td>';
        var confirmCell = showStored
          ? '<td class="col-new">' + (r.confirmTime || "--") + "</td>"
          : '<td class="col-new muted">--</td>';
        var goodsCell = showStored
          ? '<td class="col-new">' + r.goodsId + "</td>"
          : '<td class="col-new muted">--</td>';
        var goodsNameCell = showStored
          ? '<td class="col-new">' + (r.goodsName || "--") + "</td>"
          : '<td class="col-new muted">--</td>';
        var repayTimeCell = showStored && r.repaid && r.repayTime
          ? '<td class="col-new">' + r.repayTime + "</td>"
          : '<td class="col-new muted">--</td>';

        var opCell;
        if (r.pay === "储值卡支付" || (r.pay === "组合支付" && r.commission === 0)) {
          if (r.repaid) {
            opCell = '<td class="col-new"><button type="button" class="btn btn-link done" disabled>已还款</button></td>';
          } else {
            opCell = '<td class="col-new"><button type="button" class="btn btn-link" data-act="repay" data-id="' + r.id + '">确认已还款</button></td>';
          }
        } else {
          opCell = '<td class="col-new muted">--</td>';
        }

        return (
          "<tr>" +
          "<td class=\"num\">" + r.id + "</td>" +
          "<td>" + r.orderNo + "</td>" +
          "<td>" + r.dist + "</td>" +
          "<td>" + r.status + "</td>" +
          "<td>" + payTag(r.pay) + "</td>" +
          "<td>" + r.receiver + "</td>" +
          "<td>" + r.rPhone + "</td>" +
          "<td>" + r.buyer + "</td>" +
          "<td>" + r.bPhone + "</td>" +
          "<td>" + r.custId + "</td>" +
          "<td>" + dash(r.sales) + "</td>" +
          "<td>" + dash(r.sPhone) + "</td>" +
          "<td>" + dash(r.sId) + "</td>" +
          "<td class=\"num\">" + Number(r.amount).toFixed(2) + "</td>" +
          commissionCell +
          confirmCell +
          goodsCell +
          goodsNameCell +
          repayTimeCell +
          opCell +
          "</tr>"
        );
      }).join("") || '<tr><td colspan="20" style="text-align:center;padding:40px;color:#999">暂无数据</td></tr>';

      renderPagination(total);
    }

    document.getElementById("btnSearch").addEventListener("click", function () {
      page = 1;
      render();
    });
    document.getElementById("btnReset").addEventListener("click", function () {
      document.getElementById("payFilter").value = "全部";
      page = 1;
      render();
    });
    document.getElementById("pageSize").addEventListener("change", function () {
      pageSize = Number(this.value) || 10;
      page = 1;
      render();
    });
    document.getElementById("pageBtns").addEventListener("click", function (e) {
      var btn = e.target.closest(".pg-btn");
      if (!btn || btn.disabled) return;
      var totalPages = Math.max(1, Math.ceil(filtered().length / pageSize));
      var p = btn.dataset.page;
      if (p === "prev") page = Math.max(1, page - 1);
      else if (p === "next") page = Math.min(totalPages, page + 1);
      else page = Number(p);
      render();
    });
    document.getElementById("gotoPage").addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var totalPages = Math.max(1, Math.ceil(filtered().length / pageSize));
      var n = Number(this.value);
      if (!n || n < 1) n = 1;
      if (n > totalPages) n = totalPages;
      page = n;
      render();
    });

    document.getElementById("tbody").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-act=repay]");
      if (!btn || btn.disabled) return;
      var id = Number(btn.dataset.id);
      var row = list.find(function (r) { return r.id === id; });
      if (!row) return;
      pendingId = id;
      document.getElementById("confirmText").innerHTML =
        "确认该储值卡订单已还款？";
      document.getElementById("confirmMask").classList.add("show");
    });

    document.getElementById("confirmCancel").addEventListener("click", function () {
      pendingId = null;
      document.getElementById("confirmMask").classList.remove("show");
    });
    document.getElementById("confirmMask").addEventListener("click", function (e) {
      if (e.target === this) {
        pendingId = null;
        this.classList.remove("show");
      }
    });
    document.getElementById("confirmOk").addEventListener("click", function () {
      if (pendingId == null) return;
      var row = list.find(function (r) { return r.id === pendingId; });
      if (row) {
        row.repaid = true;
        var d = new Date();
        function p(n) { return n < 10 ? "0" + n : "" + n; }
        row.repayTime = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
          p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
        toast("已确认还款，提成待发放");
      }
      pendingId = null;
      document.getElementById("confirmMask").classList.remove("show");
      render();
    });

    render();
  </script>
</body>
</html>
