<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>业务端 · 白条申请详情</title>
<style>
:root{
  --blue:#1677ff;
  --text:#1d2129;
  --text-secondary:#4e5969;
  --text-muted:#86909c;
  --bg-page:#f2f3f5;
  --bg-card:#ffffff;
  --bg-blue-light:#e8f3ff;
  --border:#f0f0f0;
  --border-light:#e5e6eb;
  --orange:#fa8c16;
  --green:#00b42a;
  --red:#f53f3f;
  --radius-card:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#e8e8e8;color:var(--text);font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg-page);padding-bottom:28px}
.nav{
  background:var(--bg-card);padding:12px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)
}
.nav .back{border:none;background:none;font-size:22px;cursor:pointer;width:24px;color:var(--text);line-height:1}
.nav .hd{flex:1;text-align:center;margin-right:28px}
.nav .title{font-size:17px;font-weight:600}
.card{background:var(--bg-card);margin:10px 12px;border-radius:var(--radius-card);padding:14px 14px 10px}
.sec{
  font-size:15px;font-weight:600;margin:0 0 12px;padding-left:8px;
  border-left:3px solid var(--blue);line-height:1.3
}
.sec-tip{font-size:11px;color:var(--text-muted);font-weight:400;margin-left:6px}
.kv{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--border)
}
.kv:last-child{border-bottom:none}
.lab{color:var(--text-muted);font-size:13px;flex-shrink:0;max-width:42%;line-height:1.45}
.lab .req{color:var(--red);margin-right:2px}
.val{flex:1;text-align:right;font-size:13px;color:var(--text);word-break:break-all;line-height:1.45}
.val.ok{color:var(--green)}
.val.warn{color:var(--orange)}
.val.err{color:var(--red)}
.val.muted{color:var(--text-muted)}
.val.link,.val a.crm-link{
  color:var(--blue);cursor:pointer;text-decoration:none
}
.val a.crm-link:active{opacity:.75}
.check-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.check-box{
  border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;background:#f7f8fa
}
.check-box.ok{background:#e8ffea}
.check-box.bad{background:#ffece8}
.check-box.blue{background:var(--bg-blue-light)}
.check-box b{font-weight:600}
.check-box.status-panel{line-height:1.8}
.check-box.status-panel .tag{margin:0 2px}
.file-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.file{
  border:1px solid var(--border-light);border-radius:var(--radius-sm);min-height:76px;padding:10px 8px;
  background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-size:12px;color:var(--text-secondary);line-height:1.4;gap:4px
}
.file.ok{border-color:#91caff;background:var(--bg-blue-light);color:var(--blue)}
.file .mark{font-size:16px;line-height:1}
.sub{
  display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--text);margin:14px 0 8px;line-height:1.2
}
.sub::before{
  content:"";width:3px;height:12px;border-radius:1px;background:var(--blue);flex:0 0 auto
}
.sub:first-child{margin-top:0}
.file-grid + .sub,.empty-tip + .sub,.kv + .sub{
  margin-top:16px;padding-top:12px;border-top:1px dashed var(--border-light)
}
.tag{
  display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;
  background:var(--bg-blue-light);color:var(--blue);margin-left:4px
}
.tag.ok{background:#e8ffea;color:var(--green)}
.tag.warn{background:#fff7e6;color:var(--orange)}
.tag.err{background:#ffece8;color:var(--red)}
.tag.muted{background:#f5f5f5;color:#999}
.bank-item{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:13px
}
.bank-item:last-child{border-bottom:none}
.bank-item .name{font-weight:600;min-width:72px}
.log{padding:0 0 4px}
.log-item{position:relative;padding:0 0 14px 16px;border-left:2px solid #f0f0f0}
.log-item:last-child{padding-bottom:0;border-left-color:transparent}
.log-item::before{
  content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;
  border-radius:50%;background:#c9cdd4
}
.log-item.done::before{background:var(--blue)}
.log-item.cur::before{background:var(--green);box-shadow:0 0 0 3px rgba(0,180,42,.2)}
.log-t{font-size:13px;font-weight:600}
.log-d{font-size:12px;color:var(--text-muted);margin-top:2px}
.empty-tip{font-size:13px;color:var(--text-muted);padding:2px 0 8px;line-height:1.6}
</style>
</head>

function goBack(){
  if(history.length>1) history.back();
  else location.href="业务端_客户档案_白条档案.html";
}
function cls(v){
  if(["齐全","已提交","通过","已收到","已上传","是","白条已开通","正式进件审核通过","正式审核通过"].includes(v)) return "ok";
  if(["缺失","未提交","拒绝","未收到","初审驳回","正式进件审核驳回","正式审核驳回","银行拒绝","补充中"].includes(v)||String(v||"").startsWith("缺失")) return "err";
  if(["审核中","正式进件审核中","初审中","审批中","银行审批中","初审审核中"].includes(v)) return "warn";
  if(v==="—"||v===""||v==null) return "muted";
  return "";
}
function checkCls(v){
  if(v==="齐全"||v==="已提交"||v==="通过"||v==="已收到") return "ok";
  if(v==="缺失"||v==="未提交"||v==="拒绝"||v==="补充中"||v==="未收到"||String(v||"").startsWith("缺失")||v==="—") return "bad";
  return "blue";
}
function docStatusLabel(v){
  if(v==="齐全") return "已提交";
  if(v==null||v===""||v==="—") return "暂未提交";
  if(String(v).startsWith("缺失")) return "未提交";
  return v;
}
function kv(lab, val, req){
  const c=cls(val);
  return `<div class="kv"><div class="lab">${req?'<span class="req">*</span>':''}${lab}</div><div class="val ${c}">${val??"—"}</div></div>`;
}
function fileCard(name, ok){
  return `<div class="file ${ok?"ok":""}"><div class="mark">${ok?"✓":"+"}</div><div>${name}</div></div>`;
}
function tag(v){
  const c=cls(v)||"muted";
  return `<span class="tag ${c}">${v||"—"}</span>`;
}

function guessOperator(action, t){
  const a=action||"";
  if(/客户提交|客户正式|修改资料|上传初审|补件/.test(a)) return t.name||"客户";
  if(/业务员|尽调|申请资料/.test(a)) return t.sales||"业务员";
  if(/AI|e签宝|系统|征信已上传|跑批|白条已开通/.test(a)) return "系统";
  if(/初审|正式审核|正式进件通过|推送|银行|人审|驳回/.test(a)) return t.auditor||"金融审核员";
  return t.sales||"系统";
}
function displayPlatformStatus(t){
  const s=t.stage||"—";
  if(s==="白条已开通"||s==="银行拒绝"||s==="已推送银行"||s==="银行审批中") return "正式进件审核通过";
  return s;
}
function renderAuditStatus(t){
  const platform=displayPlatformStatus(t);
  const tone=["初审驳回","正式进件审核驳回","正式审核驳回"].includes(t.stage)?"bad"
    :(platform==="正式进件审核通过"||platform==="正式审核通过"||t.stage==="白条已开通")?"ok":"blue";
  const tip=(t.reject&&["初审驳回","正式进件审核驳回","正式审核驳回"].includes(t.stage))
    ?`<br><span style="color:#86909c">驳回原因：${t.reject}</span>`:"";
  return `
  <div class="card">
    <div class="sec">审核状态</div>
    <div class="check-box ${tone} status-panel">
      平台审核状态：${tag(platform)}
      ${tip}
    </div>
  </div>`;
}
function renderAi(t){
  const formalVal=docStatusLabel(t.formal?(t.formal.status||"已提交"):"暂未提交");
  const salesVal=docStatusLabel(t.salesApp?(t.salesApp.status||"—"):"暂未提交");
  const esignVal=docStatusLabel(t.esign);
  return `
  <div class="card">
    <div class="sec">资料与 AI 识别</div>
    <div class="check-stack">
      <div class="check-box ${checkCls(esignVal)}">客户初审资料：<b>${esignVal}</b></div>
      <div class="check-box ${checkCls(formalVal)}">客户正式进件资料：<b>${formalVal}</b></div>
      <div class="check-box ${checkCls(salesVal)}">业务员尽调资料：<b>${salesVal}</b></div>
      <div class="check-box ${checkCls(t.ai)}">AI审核结果和建议：<b>${t.ai}</b>${t.aiDetail?`<br>${t.aiDetail}`:""}${t.gateTip?`<br><span style="color:#86909c">${t.gateTip}</span>`:""}</div>
    </div>
  </div>`;
}

function buildAttachSections(t){
  const files=t.files||[];
  const hasFile=n=>files.some(f=>String(f).includes(n.replace("法人",""))||f===n);
  const hasLegalCredit=()=>{
    if(hasFile("征信")||hasFile("法人征信")||hasFile("人行征信")) return true;
    if(t.legalCreditOk===true) return true;
    if(t.formal&&t.formal.legalCreditOk===true) return true;
    if(t.esign==="齐全"||t.esign==="已提交") return true;
    return (t.timeline||[]).some(x=>/法人.*征信|人行征信已上传/.test(x.t||""));
  };
  const f=t.formal||null;
  const s=t.salesApp||null;
  const legalRow=((s&&s.dd)||[]).find(([k])=>/法人是否为实控人|申请人是否为实控人/.test(String(k||"")));
  const showCtrlId=legalRow ? String(legalRow[1])==="否" : !!(f&&f.controller&&f.controller.needed);
  const ge30=(s&&s.applyQuota!=null&&s.applyQuota!=="")?Number(s.applyQuota)>=30:((f&&f.tier)||(s&&s.tier)||"")==="≥30万";
  const showBaihang=!!t.fullPrice || !!(f&&f.baihang&&f.baihang.needed) || hasFile("百行");
  const ctrlIdOk=showCtrlId && (
    hasFile("实控人身份证") ||
    !!(s&&s.ctrlIdOk) ||
    !!(f&&f.controller&&(f.controller.idNo||f.controller.name||f.controller.needed))
  );
  const ctrlCreditOk=!!(f&&f.controller&&f.controller.creditOk) || hasFile("实控人征信");
  const baihangOk=hasFile("百行")||t.baihangOk===true||!!(f&&f.baihang&&f.baihang.ok);

  const chuShen=[
    fileCard("营业执照", hasFile("营业执照")),
    fileCard("法人身份证正面", hasFile("身份证正面")||hasFile("法人身份证正面")),
    fileCard("法人身份证反面", hasFile("身份证反面")||hasFile("法人身份证反面")),
    fileCard("信用分截图", hasFile("微信支付分")||hasFile("微信分")||hasFile("支付分")||hasFile("信用分")),
    fileCard("法人征信报告", hasLegalCredit()),
  ].join("");

  const ddCards=[];
  if(showCtrlId){
    ddCards.push(fileCard("实控人身份证正面", ctrlIdOk));
    ddCards.push(fileCard("实控人身份证反面", ctrlIdOk));
  }
  ((s&&s.photos)||[]).forEach(n=>ddCards.push(fileCard(n,true)));
  const ddHtml=ddCards.length
    ? ddCards.join("")
    : `<div class="empty-tip">${s?"暂无尽调附件":"业务员尚未提交尽调资料"}</div>`;

  let formalHtml="";
  if(!f){
    const locked=["初审驳回","初审中","初审待审核","初审资料上传中"].includes(t.stage);
    formalHtml=`<div class="empty-tip">${locked?"初审通过后方可补充正式进件资料":"客户尚未提交正式进件资料"}</div>`;
  }else{
    const cards=[];
    if(f.flow) cards.push(fileCard("经营性流水", !!(f.flow.mailOk||(f.flow.channels||[]).length)));
    if(showBaihang) cards.push(fileCard("百行征信报告", baihangOk));
    if(ge30) cards.push(fileCard("实控人征信报告", ctrlCreditOk));
    (f.files||[]).forEach(item=>{
      if(typeof item==="string") cards.push(fileCard(item,true));
      else cards.push(fileCard(item.name||item.label||"附件", !!item.ok));
    });
    formalHtml=cards.length?cards.join(""):`<div class="empty-tip">暂无正式补件附件</div>`;
  }

  return `<div class="card">
    <div class="sec">附件</div>
    <div class="sub">初审附件</div>
    <div class="file-grid">${chuShen}</div>
    <div class="sub">业务员尽调资料附件</div>
    <div class="file-grid">${ddHtml}</div>
    <div class="sub">客户正式补件附件</div>
    <div class="file-grid">${formalHtml}</div>
  </div>`;
}

function renderFormal(t){
  const f=t.formal;
  if(!f){
    return `<div class="card"><div class="sec">客户正式进件资料</div>
      <div class="empty-tip">${t.stage==="初审驳回"||t.stage==="初审中"?"初审通过后方可补充正式进件资料":"暂未提交正式进件资料"}</div></div>`;
  }
  const flow=f.flow||{};
  const channelList=flow.channels||[];
  const channels=channelList.join("、")||"—";
  const pwdFields=channelList.length
    ? channelList.map(ch=>kv(`${ch}流水解压密码`, (flow.pwds&&flow.pwds[ch])||"未填", true)).join("")
    : kv("流水解压密码", "未选择流水来源", true);
  return `<div class="card">
    <div class="sec">客户正式进件资料<span class="sec-tip">状态：${docStatusLabel(f.status)}</span></div>
    ${kv("经营性流水来源", channels, true)}
    ${pwdFields}
  </div>`;
}

function renderSales(t){
  const s=t.salesApp;
  if(!s){
    return `<div class="card"><div class="sec">业务员尽调资料</div><div class="empty-tip">暂未提交业务员尽调资料</div></div>`;
  }
  const breedKeys=["客户类型","是否是牧场","是否牧场","客户阶段","收蛋","鸡粪","供应商存量","养殖类型","经济用途","养殖数量","日龄","防疫"];
  const feedKeys=["购买次数","玉米","豆粕","预混料","全价料","绑定","大宗"];
  const tpl=s.tplFields||[];
  const breedTpl=tpl.filter(([k])=>breedKeys.some(x=>String(k).includes(x)));
  const feedTpl=tpl.filter(([k])=>feedKeys.some(x=>String(k).includes(x)));
  const otherTpl=tpl.filter(([k])=>!breedKeys.some(x=>String(k).includes(x))&&!feedKeys.some(x=>String(k).includes(x)));
  const skipDd=/申请人姓名|^手机号$|法人名字/;
  const ddRows=(s.dd||[]).filter(([k])=>!skipDd.test(String(k||"")));
  const isCtrlKey=k=>/实控人|法人是否为实控人|申请人是否为实控人/.test(String(k||""));
  const isCtrlIdentityKey=k=>/实控人姓名|实控人身份证|实控人手机/.test(String(k||""));
  const isPartnerKey=k=>/合伙人/.test(String(k||""));
  const ctrlRank=k=>{
    k=String(k||"");
    if(/法人是否为实控人|申请人是否为实控人/.test(k)) return 1;
    if(/实控人姓名|实控人身份证|实控人手机/.test(k)) return 2;
    if(/从业年限/.test(k)) return 3;
    if(/家庭住址/.test(k)) return 4;
    if(/资产/.test(k)) return 5;
    if(/车牌/.test(k)) return 6;
    return 7;
  };
  const legalIsCtrlRow=ddRows.find(([k])=>/法人是否为实控人|申请人是否为实控人/.test(String(k||"")));
  const legalIsController=!legalIsCtrlRow || String(legalIsCtrlRow[1])!=="否";
  const ctlFallback=(t.formal&&t.formal.controller)||{};
  let ctrlSource=ddRows.filter(([k])=>isCtrlKey(k));
  if(!legalIsController){
    const hasName=ctrlSource.some(([k])=>/实控人姓名/.test(k));
    const hasId=ctrlSource.some(([k])=>/实控人身份证/.test(k));
    const hasMobile=ctrlSource.some(([k])=>/实控人手机/.test(k));
    if(!hasName && ctlFallback.name) ctrlSource=ctrlSource.concat([["实控人姓名", ctlFallback.name]]);
    if(!hasId && ctlFallback.idNo) ctrlSource=ctrlSource.concat([["实控人身份证号", ctlFallback.idNo]]);
    if(!hasMobile && ctlFallback.mobile) ctrlSource=ctrlSource.concat([["实控人手机号", ctlFallback.mobile]]);
  }
  const ctrlRows=ctrlSource
    .filter(([k])=>!(isCtrlIdentityKey(k) && legalIsController))
    .sort((a,b)=>ctrlRank(a[0])-ctrlRank(b[0]));
  const partnerRows=ddRows.filter(([k])=>isPartnerKey(k));
  const otherRows=ddRows.filter(([k])=>!isCtrlKey(k)&&!isPartnerKey(k));
  const reqCtrl=k=>/法人是否为实控人|申请人是否为实控人|实控人姓名|实控人身份证|实控人手机|从业年限|家庭住址|资产情况/.test(String(k||""));
  const ctrlHtml=ctrlRows.map(([k,v])=>kv(k,v,reqCtrl(k))).join("");
  const partnerHtml=partnerRows.map(([k,v])=>kv(k,v,false)).join("");
  const otherHtml=otherRows.map(([k,v])=>kv(k,v,false)).join("");
  const ddHtml=`${ctrlHtml}${partnerHtml}${otherHtml}`||`<div class="empty-tip">暂无经营信息</div>`;
  const syZero=/^0/.test(String(s.sy||""))||String(s.sy)==="0万";
  const syNum=parseFloat(String(s.sy||"").replace(/[^\d.]/g,""))||0;
  const syExtra=!syZero&&syNum>0;
  const xsNum=parseFloat(String(s.xs||"").replace(/[^\d.]/g,""))||0;
  const xsExtra=xsNum>0;
  return `<div class="card">
    <div class="sec">业务员尽调资料<span class="sec-tip">状态：${docStatusLabel(s.status)}</span></div>
    <div class="sub">白条申请</div>
    ${kv("白条产品类型", s.product||"—", true)}
    ${(s.product==="预混料"||s.product==="全价料")?kv("是否能收取保证金", s.canDeposit??"—", true):""}
    ${kv("申请额度（万）", s.applyQuota??s.tier??"—", true)}
    ${kv("上海银行额度（万）", s.sy||"—", true)}
    ${syExtra?kv("上银免息期（天）", s.syFreeDays??"—", true):""}
    ${syExtra?kv("是否开通自动支付", s.syAutoPay??"—", true):""}
    ${syExtra?kv("最长借款期（月）", s.syMaxLoanMonths??"—", true):""}
    ${kv("锡商银行额度（万）", s.xs||"—", true)}
    ${xsExtra?kv("锡商免息期（天）", s.xsFreeDays??"—", true):""}
    ${xsExtra?kv("最长借款期限（月）", s.xsMaxLoanMonths??"—", true):""}
    ${syZero?kv("不申请上海银行原因", s.syZeroReason||s.reason||"—", true):""}
    ${kv("申请原因", s.reason||"—", true)}
    <div class="sub">客户养殖信息</div>
    ${kv("养殖种类", s.breed||"—")}
    ${kv("养殖数量", s.scale||"—")}
    ${kv("从事行业年限", s.years||"—")}
    ${breedTpl.map(([k,v])=>kv(k,v)).join("")}
    <div class="sub">饲料信息</div>
    ${feedTpl.map(([k,v])=>kv(k,v)).join("")||kv("饲料信息","—")}
    ${otherTpl.map(([k,v])=>kv(k,v)).join("")}
    <div class="sub">经营信息</div>
    ${ddHtml}
    <div class="sub">CRM 拜访记录</div>
    ${crmKv(s.crm)}
  </div>`;
}
function crmKv(text){
  const v=(text||"").trim();
  if(!v||v==="—"){
    return `<div class="kv"><div class="lab">CRM拜访记录</div><div class="val muted">—</div></div>`;
  }
  return `<div class="kv"><div class="lab">CRM拜访记录</div><div class="val link"><a class="crm-link" href="javascript:void(0)" onclick="openCrmVisitDetail()">${v}</a></div></div>`;
}
function openCrmVisitDetail(){
  alert("查看 CRM 拜访详情\n（原型：跳转 CRM 拜访记录详情）");
}

function render(t){
  document.getElementById("navTitle").textContent="白条档案";
  const b=t.bank||{};
  const c=t.credit||{};
  const tr=t.trade||{};
  const logs=(t.timeline||[]).map(x=>{
    const op=x.operator||guessOperator(x.t,t);
    const time=x.d||"—";
    const line=(!time||time==="—")?`${op} · —`:`${op} · ${time}`;
    return `<div class="log-item ${x.s||""}">
      <div class="log-t">${x.t}</div>
      <div class="log-d">${line}</div>
    </div>`;
  }).join("");

  document.getElementById("body").innerHTML=`
    ${renderAuditStatus(t)}
    ${renderAi(t)}

    <div class="card">
      <div class="sec">平台客户信息</div>
      ${kv("主体类型", t.subjectType, true)}
      ${kv("手机号", t.mobile, true)}
      ${kv("客户姓名", t.name, true)}
      ${kv("客户类型", t.custType, true)}
      ${kv("平台注册时间", "2025-09-01", true)}
      ${kv("平台累计注册月份", "12", true)}
      ${kv("借款人与平台方关联", "否", true)}
      ${kv("业务员", t.sales)}
    </div>

    <div class="card">
      <div class="sec">融资主体信息</div>
      ${kv("融资主体名称", t.subject, true)}
      ${kv("企业类型", t.subjectType==="企业"?"有限责任公司":"个体工商户", true)}
      ${kv("企业注册时间", "2018-06-01", true)}
      ${kv("证件类型", t.subjectType==="企业"?"统一社会信用代码":"身份证", true)}
      ${kv("证件编号", t.subjectType==="企业"?"91341300MA2XXXXX":"341202199001011234", true)}
      ${kv("法人名称", t.name)}
      ${kv("法人手机号", t.mobile, true)}
      ${kv("融资主体联系地址", "河南省南阳市唐河县某某路1号", true)}
    </div>

    ${buildAttachSections(t)}
    ${renderSales(t)}
    ${renderFormal(t)}

    <div class="card">
      <div class="sec">征信信息</div>
      ${kv("逾期笔数", c.overdue??0, true)}
      ${kv("不良贷款笔数", c.badLoan??0, true)}
      ${kv("已结清贷款笔数", c.settled??0, true)}
    </div>

    <div class="card">
      <div class="sec">交易信息</div>
      ${kv("近6月累计交易月数", tr.months??0, true)}
      ${kv("近6月月均交易吨数", tr.tons??0, true)}
      ${kv("近6月月均交易金额(元)", tr.amt??0, true)}
      ${kv("距近一笔交易（天）", tr.days??0, true)}
    </div>

    <div class="card">
      <div class="sec">推送银行</div>
      <div class="bank-item">
        <span class="name">上海银行</span>
        ${tag(b.syPush)}
      </div>
      <div class="bank-item">
        <span class="name">锡商银行</span>
        ${tag(b.xsPush)}
      </div>
    </div>

    <div class="card">
      <div class="sec">操作日志</div>
      <div class="log">${logs||`<div class="empty-tip">暂无操作记录</div>`}</div>
    </div>
  `;
}

(function boot(){
  const q=new URLSearchParams(location.search);
  const mode=q.get("mode")||"pass";
  const t=Object.assign({}, DATASETS[mode]||DATASETS.pass);
  const cust=q.get("cust");
  if(cust) t.name=cust;
  render(t);
})();
</script>
</body>
