<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>我的资产</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --orange:#ff6a00;
  --orange-2:#ff8a1a;
  --orange-3:#ff9a3d;
  --bg:#f3f3f3;
  --text:#2b2b2b;
  --muted:#999;
}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh
}
.page{
  max-width:430px;margin:0 auto;min-height:100vh;padding:14px 14px 28px
}

/* 顶部资产卡 */
.asset-card{
  position:relative;overflow:hidden;border-radius:16px;padding:22px 18px 16px;
  background:linear-gradient(145deg,#ff7a00 0%,#ff6200 48%,#ff8f22 100%);
  color:#fff;box-shadow:0 8px 20px rgba(255,106,0,.22)
}
.asset-card::before{
  content:"";position:absolute;right:-40px;bottom:-70px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 68%);
  pointer-events:none
}
.asset-card::after{
  content:"";position:absolute;right:20px;bottom:-30px;width:140px;height:140px;
  border-radius:50%;border:18px solid rgba(255,255,255,.08);pointer-events:none
}
.pay-lab{text-align:center;font-size:13px;opacity:.95;letter-spacing:.5px}
.pay-row{
  display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:8px;position:relative
}
.pay-amt{font-size:34px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.pay-detail{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-size:12px;color:rgba(255,255,255,.95);text-decoration:none;white-space:nowrap
}
.divider{
  height:1px;margin:18px 0 14px;background:rgba(255,255,255,.28)
}
.bal-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;text-align:center
}
.bal-item{position:relative;padding:0 6px}
.bal-item + .bal-item::before{
  content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:rgba(255,255,255,.28)
}
.bal-lab{font-size:12px;opacity:.9;margin-bottom:6px}
.bal-val{font-size:15px;font-weight:600;letter-spacing:.2px}
.deposit{
  margin-top:16px;padding-top:2px;display:flex;align-items:flex-start;gap:8px
}
.deposit-icon{
  width:18px;height:18px;flex-shrink:0;margin-top:1px
}
.deposit-title{font-size:13px;font-weight:600;line-height:1.3}
.deposit-sub{font-size:12px;opacity:.9;margin-top:4px;line-height:1.4}

/* 功能入口 */
.menu-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px
}
.menu-item{
  background:#fff;border-radius:14px;min-height:92px;padding:18px 16px;
  display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  box-shadow:0 1px 0 rgba(0,0,0,.02);border:1px solid rgba(0,0,0,.02);
  transition:transform .15s ease,box-shadow .15s ease
}
.menu-item:active{transform:scale(.98)}
.menu-icon{
  width:36px;height:36px;flex-shrink:0;color:#c86a2e
}
.menu-icon svg{width:100%;height:100%;display:block}
.menu-text{min-width:0}
.menu-title{font-size:15px;font-weight:600;color:#333;line-height:1.3}
.menu-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
</style>
</head>
<body>
<div class="page">
  <section class="asset-card" aria-label="资产概览">
    <div class="pay-lab">待付款金额</div>
    <div class="pay-row">
      <div class="pay-amt">¥ 199,295.56</div>
      <a class="pay-detail" href="javascript:;" onclick="alert('待付款详情（原型占位）')">详情 &gt;</a>
    </div>

    <div class="divider"></div>

    <div class="bal-grid">
      <div class="bal-item">
        <div class="bal-lab">可用余额</div>
        <div class="bal-val">¥ 392.29</div>
      </div>
      <div class="bal-item">
        <div class="bal-lab">冻结金额</div>
        <div class="bal-val">¥ 1,338.26</div>
      </div>
      <div class="bal-item">
        <div class="bal-lab">提现中金额</div>
        <div class="bal-val">¥ 0.00</div>
      </div>
    </div>

    <div class="deposit">
      <svg class="deposit-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5l7.5 3v5.2c0 5.1-3.4 9.7-7.5 11-4.1-1.3-7.5-5.9-7.5-11V5.5L12 2.5z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8.8 11.4l2.2 2.2 4.4-4.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="deposit-title">保证金</div>
        <div class="deposit-sub">合同保证金 ¥ 66,813.89 · 追加保证金 ¥ 636.00</div>
      </div>
    </div>
  </section>

  <nav class="menu-grid" aria-label="功能入口">
    <a class="menu-item" href="javascript:;" onclick="alert('个人中心（原型占位）')">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="6" y="8" width="28" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
          <circle cx="16" cy="18" r="3.2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10.5 27c1.2-3 3.2-4.5 5.5-4.5S20.3 24 21.5 27" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M24 16h8M24 21h8M24 26h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="menu-text"><div class="menu-title">个人中心</div></div>
    </a>

    <a class="menu-item" href="javascript:;" onclick="alert('通知（原型占位）')">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M8 12c0-2.2 1.8-4 4-4h12c2.2 0 4 1.8 4 4v10c0 2.2-1.8 4-4 4H16l-6 5v-5h-2c-2.2 0-4-1.8-4-4V12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="15" cy="17" r="1.4" fill="currentColor"/>
          <circle cx="20" cy="17" r="1.4" fill="currentColor"/>
          <circle cx="25" cy="17" r="1.4" fill="currentColor"/>
        </svg>
      </div>
      <div class="menu-text"><div class="menu-title">通知</div></div>
    </a>

    <a class="menu-item" href="javascript:;" onclick="alert('我的账单（原型占位）')">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M13 8h14a2 2 0 012 2v22a2 2 0 01-2 2H13a2 2 0 01-2-2V10a2 2 0 012-2z" stroke="currentColor" stroke-width="2"/>
          <path d="M16 5.5h8v4h-8v-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <rect x="15" y="16" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M18.2 21h3.6M20 19.2v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="menu-text"><div class="menu-title">我的账单</div></div>
    </a>

    <a class="menu-item" href="javascript:;" onclick="alert('我的卡券（原型占位）')">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M7 14c0-1.7 1.3-3 3-3h20c1.7 0 3 1.3 3 3v4.2c-1.5.3-2.6 1.6-2.6 3.2S31.5 24.3 33 24.6V29c0 1.7-1.3 3-3 3H10c-1.7 0-3-1.3-3-3v-4.4c1.5-.3 2.6-1.6 2.6-3.2S8.5 18.5 7 18.2V14z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14 17h8M14 23h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="menu-text">
        <div class="menu-title">我的卡券</div>
        <div class="menu-sub">56张</div>
      </div>
    </a>

    <a class="menu-item" href="javascript:;" onclick="alert('发票中心（原型占位）')">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M11 7h18v26l-3-2-3 2-3-2-3 2-3-2-3 2V7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M15 14h10M15 19h10M15 24h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="menu-text"><div class="menu-title">发票中心</div></div>
    </a>

    <a class="menu-item" href="./步骤1_客户初审三步流程_V3.html?demo=bank-home">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="8" y="10" width="24" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
          <path d="M12 16h16M12 21h10M12 26h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="28" cy="26" r="5.5" fill="#fff" stroke="currentColor" stroke-width="1.8"/>
          <path d="M28 23.5v5M25.5 26h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="menu-text"><div class="menu-title">白条申请</div></div>
    </a>

    <a class="menu-item" href="./步骤1_客户初审三步流程.html">
      <div class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M12 8h16c1.1 0 2 .9 2 2v3.2c-1.4.4-2.4 1.7-2.4 3.3S28.6 19.4 30 19.8V30c0 1.1-.9 2-2 2H12c-1.1 0-2-.9-2-2V10c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <rect x="14.5" y="14" width="11" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          <text x="20" y="22.2" text-anchor="middle" fill="currentColor" font-size="7.5" font-weight="700" font-family="PingFang SC,Microsoft YaHei,sans-serif">白条</text>
        </svg>
      </div>
      <div class="menu-text">
        <div class="menu-title">白条额度</div>
        <div class="menu-sub">最高1,000,000.00</div>
      </div>
    </a>
  </nav>
</div>
</body>
</html>
