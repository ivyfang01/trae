<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>白条资料 · 字段配置</title>
<style>
:root{
  --theme-primary:#8096d2;
  --theme-primary-hover:#6f85c4;
  --theme-primary-bg:#edf0ff;
  --theme-link:#8096d2;
  --theme-success:#52c41a;
  --theme-warning:#fa8c16;
  --theme-danger:#ff4d4f;
  --theme-radius:4px;
  --theme-radius-sm:2px;
  --theme-border:#dcdfe6;
  --theme-border-input:#d9d9d9;
  --theme-text:#333333;
  --theme-text-secondary:#8c8c8c;
  --theme-text-btn:#606266;
  --theme-bg:#f0f2f5;
  --theme-logo-bg:#8096d2;
  --theme-table-header:#fafafa;
  --theme-table-hover:#f7f8fd;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--theme-bg);color:var(--theme-text);font-size:13px;line-height:1.5;
}
.app-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--theme-bg)}
.topbar-wrap{flex-shrink:0;background:#fff}
.topbar{height:48px;display:flex;align-items:stretch;background:#fff}
.logo-block{
  display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--theme-logo-bg);color:#fff;
  font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0
}
.logo-block .burger{font-size:16px;font-weight:400;opacity:.95}
.top-nav{display:flex;align-items:center;flex:1;min-width:0;overflow:hidden;padding:0 4px}
.top-nav .nav-item{
  display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 12px;white-space:nowrap;
  color:#333;font-size:14px;cursor:default
}
.top-nav .nav-item .caret{font-size:10px;color:#bfbfbf;transform:scale(.85)}
.top-nav .nav-item.active{color:var(--theme-primary);font-weight:500}
.top-right{
  margin-left:auto;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;
  font-size:13px;color:#595959
}
.user-avatar{
  width:28px;height:28px;border-radius:50%;background:#d9d9d9;color:#666;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px
}
.app-body{display:flex;flex:1;min-height:0}
.sidebar{
  width:180px;background:#fff;border-right:1px solid var(--theme-border);padding:8px 0;
  overflow-y:auto;flex-shrink:0;font-size:13px
}
.side-item{
  display:block;padding:10px 14px 10px 11px;color:#595959;text-decoration:none;
  border-left:3px solid transparent;line-height:1.3;cursor:pointer
}
.side-item:hover{color:var(--theme-primary)}
.side-item.active{
  background:var(--theme-primary-bg);color:var(--theme-primary);
  border-left-color:var(--theme-primary);font-weight:500
}
.main-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--theme-bg)}
.page-tabs{
  height:36px;background:#f5f5f5;display:flex;align-items:stretch;padding:0 16px;
  border-bottom:1px solid var(--theme-border);flex-shrink:0
}
.page-tab{
  display:inline-flex;align-items:center;gap:8px;padding:0 4px;margin-right:20px;
  font-size:13px;color:var(--theme-primary);border-bottom:2px solid var(--theme-primary)
}
.content{flex:1;padding:16px;overflow:auto;background:var(--theme-bg);min-height:0}
.page-card{background:#fff;border-radius:var(--theme-radius-sm);padding:16px 20px;min-height:calc(100vh - 120px)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-title{font-size:16px;font-weight:600;color:#262626}
.page-desc{font-size:12px;color:var(--theme-text-secondary);margin-top:4px}
.scope-tabs{
  display:flex;gap:0;margin-bottom:16px;background:#fff;border-radius:var(--theme-radius);
  border:1px solid #f0f0f0;overflow:hidden
}
.scope-tabs button{
  border:none;background:transparent;padding:10px 18px;cursor:pointer;font-size:13px;color:#595959;
  border-bottom:2px solid transparent;white-space:nowrap
}
.scope-tabs button:hover{color:var(--theme-primary)}
.scope-tabs button.active{
  color:var(--theme-primary);font-weight:600;border-bottom-color:var(--theme-primary);background:var(--theme-primary-bg)
}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;min-height:520px}
.layout.flat{grid-template-columns:minmax(0,1fr)}
.layout.flat .mod-panel{display:none}
.mod-panel,.field-panel{
  border:1px solid #eef0f4;border-radius:8px;background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.03);display:flex;flex-direction:column;min-height:0
}
.panel-hd{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px;border-bottom:1px solid #f0f2f5;font-size:14px;font-weight:600;color:#1f2329
}
.panel-hd::before{
  content:"";width:3px;height:14px;border-radius:2px;background:var(--theme-primary);margin-right:2px;flex:0 0 auto
}
.panel-hd .tit{display:flex;align-items:center;gap:8px;flex:1}
.panel-bd{flex:1;overflow:auto;padding:8px}
.mod-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:6px;cursor:pointer;
  border:1px solid transparent;margin-bottom:4px
}
.mod-item:hover{background:#f7f8fd}
.mod-item.active{background:var(--theme-primary-bg);border-color:#adbbe2;color:var(--theme-primary)}
.mod-item .name{flex:1;min-width:0;font-weight:500}
.mod-item .cnt{font-size:12px;color:var(--theme-text-secondary)}
.mod-item.active .cnt{color:var(--theme-primary)}
.mod-item .ops{display:none;gap:6px}
.mod-item:hover .ops,.mod-item.active .ops{display:inline-flex}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 4px 10px}
.btn{
  border:1px solid transparent;border-radius:var(--theme-radius);padding:0 14px;font-size:13px;cursor:pointer;
  height:32px;line-height:30px;display:inline-flex;align-items:center;justify-content:center;gap:4px
}
.btn-default{background:#fff;border-color:#dcdfe6;color:var(--theme-text-btn)}
.btn-default:hover{border-color:var(--theme-primary);color:var(--theme-primary)}
.btn-danger{background:#fff;border-color:var(--theme-danger);color:var(--theme-danger)}
.btn-primary{background:var(--theme-primary);color:#fff;border-color:var(--theme-primary)}
.btn-primary:hover{background:var(--theme-primary-hover)}
.btn-sm{height:28px;line-height:26px;padding:0 10px;font-size:12px}
.link{color:var(--theme-link);cursor:pointer;border:none;background:none;font-size:13px;padding:0}
.link + .link{margin-left:10px}
.link.danger{color:var(--theme-danger)}
.tag{
  display:inline-block;font-size:12px;padding:0 7px;height:22px;line-height:20px;
  border-radius:var(--theme-radius-sm);background:var(--theme-primary-bg);color:var(--theme-primary);
  border:1px solid #adbbe2;box-sizing:border-box;white-space:nowrap
}
.tag.muted{background:#f2f3f5;color:#86909c;border-color:#e5e6eb}
.tag.ok{background:#f6ffed;color:var(--theme-success);border-color:#b7eb8f}
.tag.warn{background:#fff7e6;color:var(--theme-warning);border-color:#ffd591}
table.field-table{width:100%;border-collapse:collapse}
.field-table th{
  background:var(--theme-table-header);text-align:left;padding:10px 12px;font-size:13px;color:#595959;
  border-bottom:1px solid #f0f0f0;font-weight:600;white-space:nowrap
}
.field-table td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle}
.field-table tr:hover td{background:var(--theme-table-hover)}
.field-table tr.child td{background:#fafbfd}
.field-table tr.child:hover td{background:#f3f5fb}
.field-table .indent{display:inline-flex;align-items:center;gap:6px}
.field-table .indent .tree{
  color:#c0c4cc;font-size:12px;width:28px;text-align:right;flex-shrink:0
}
.empty{
  padding:48px 16px;text-align:center;color:var(--theme-text-secondary);font-size:13px
}
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;
  align-items:center;justify-content:center;padding:16px
}
.mask.on{display:flex}
.modal{
  width:min(560px,100%);background:#fff;border-radius:var(--theme-radius);
  box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid #f0f0f0;font-size:15px;font-weight:600
}
.modal-hd .x{border:none;background:none;font-size:18px;cursor:pointer;color:#8c8c8c;line-height:1}
.modal-bd{padding:16px 20px;max-height:min(70vh,520px);overflow:auto}
.modal-ft{
  display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #f0f0f0
}
.fg{display:grid;grid-template-columns:108px minmax(0,1fr);align-items:flex-start;gap:10px;margin-bottom:14px}
.fg label{text-align:right;font-size:13px;color:#595959;line-height:32px;padding-top:0}
.fg label .req{color:var(--theme-danger);margin-right:2px}
.fg .ctrl{min-width:0}
.fg input,.fg select,.fg textarea{
  width:100%;height:32px;border:1px solid var(--theme-border-input);border-radius:var(--theme-radius);
  padding:0 10px;font-size:13px;outline:none;background:#fff;color:#333
}
.fg textarea{height:88px;padding:8px 10px;resize:vertical;line-height:1.5}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#409eff}
.radio-line{display:flex;align-items:center;gap:18px;min-height:32px}
.fg .radio-line label{
  text-align:left;line-height:22px;color:var(--theme-text);
  display:inline-flex;align-items:center;gap:6px;cursor:pointer
}
.radio-line input{width:auto;height:auto;padding:0;border:0;accent-color:var(--theme-primary);background:transparent}
.hint{font-size:12px;color:var(--theme-text-secondary);margin-top:6px;line-height:1.5}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-row{display:flex;gap:8px;align-items:center}
.opt-row input{flex:1}
.mod-pick{position:relative}
.mod-pick-drop{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;
  max-height:200px;overflow:auto;background:#fff;border:1px solid var(--theme-border-input);
  border-radius:var(--theme-radius);box-shadow:0 4px 12px rgba(0,0,0,.08)
}
.mod-pick-drop.on{display:block}
.mod-pick-opt{
  padding:8px 10px;font-size:13px;cursor:pointer;color:#333
}
.mod-pick-opt:hover,.mod-pick-opt.active{background:var(--theme-primary-bg);color:var(--theme-primary)}
.mod-pick-empty{padding:10px;font-size:12px;color:var(--theme-text-secondary);text-align:center}
.toast{
  position:fixed;left:50%;bottom:48px;transform:translateX(-50%);
  background:rgba(0,0,0,.72);color:#fff;padding:8px 16px;border-radius:16px;
  font-size:13px;z-index:60;display:none
}
.toast.on{display:block}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar-wrap">
    <div class="topbar">
      <div class="logo-block">粮巴巴管理系统 <span class="burger">☰</span></div>
      <div class="top-nav">
        <span class="nav-item">首页</span>
        <span class="nav-item">客户管理 <i class="caret">▼</i></span>
        <span class="nav-item active">白条 <i class="caret">▼</i></span>
        <span class="nav-item">系统管理 <i class="caret">▼</i></span>
      </div>
      <div class="top-right">
        <span class="user-avatar">张</span>
        <span>金融-张敏</span>
      </div>
    </div>
  </div>
  <div class="app-body">
    <div class="sidebar">
      <a class="side-item" href="步骤1_金融初审审核.html">白条用户准入管理</a>
      <a class="side-item active" href="字段配置.html">资料字段配置</a>
      <a class="side-item" href="Admin_白条入口白名单.html">白条入口白名单</a>
    </div>
    <div class="main-col">
      <div class="page-tabs">
        <div class="page-tab">资料字段配置 <span class="close">×</span></div>
      </div>
      <div class="content">
        <div class="page-card">
          <div class="page-head">
            <div>
              <div class="page-title">资料字段配置</div>
              <div class="page-desc">配置业务员尽调、客户正式进件的字段模块与字段；添加字段时可选择关联一级字段，并指定选项值控制展示。</div>
            </div>
          </div>

          <div class="scope-tabs" id="scopeTabs">
            <button type="button" class="active" data-scope="sales">业务员尽调资料字段配置</button>
            <button type="button" data-scope="formal">正式进件资料字段配置</button>
          </div>

          <div class="layout">
            <div class="mod-panel">
              <div class="panel-hd">
                <div class="tit">字段模块</div>
              </div>
              <div class="panel-bd" id="modList"></div>
            </div>
            <div class="field-panel">
              <div class="panel-hd">
                <div class="tit" id="fieldPanelTitle">字段列表</div>
                <button class="btn btn-primary btn-sm" type="button" id="btnAddField" onclick="openFieldModal()">＋ 字段</button>
              </div>
              <div class="panel-bd" id="fieldBody"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="modMask">
  <div class="modal">
    <div class="modal-hd"><span id="modTitle">新增模块</span><button class="x" type="button" onclick="closeModModal()">×</button></div>
    <div class="modal-bd">
      <div class="fg">
        <label><span class="req">*</span>模块名称</label>
        <div class="ctrl"><input id="modName" placeholder="如：白条申请" maxlength="40" /></div>
      </div>
      <div class="fg">
        <label>排序</label>
        <div class="ctrl"><input id="modSort" type="number" min="1" step="1" placeholder="数字越小越靠前" /></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-default" type="button" onclick="closeModModal()">取消</button>
      <button class="btn btn-primary" type="button" onclick="saveModule()">确定</button>
    </div>
  </div>
</div>

<div class="mask" id="fieldMask">
  <div class="modal">
    <div class="modal-hd"><span id="fieldTitle">新增字段</span><button class="x" type="button" onclick="closeFieldModal()">×</button></div>
    <div class="modal-bd">
      <div class="fg" id="linkParentRow">
        <label>关联一级字段</label>
        <div class="ctrl">
          <select id="fieldLinkParent" onchange="onLinkParentChange()"></select>
          <div class="hint">不关联则作为一级字段；可选白条产品类型、客户类型、是否牧场、养殖类型、白条金额是否大于30万等；所属模块可单独指定。</div>
        </div>
      </div>
      <div class="fg" id="relatedWhenRow" style="display:none">
        <label><span class="req">*</span>一级选项值</label>
        <div class="ctrl">
          <select id="fieldWhenValue"></select>
          <div class="hint">取自所选一级字段的选项列表。</div>
        </div>
      </div>
      <div class="fg">
        <label><span class="req">*</span>字段名称</label>
        <div class="ctrl"><input id="fieldName" placeholder="展示名称" maxlength="40" /></div>
      </div>
      <div class="fg">
        <label><span class="req">*</span>字段格式</label>
        <div class="ctrl">
          <select id="fieldFormat" onchange="onFormatChange()">
            <option value="text">单行文本</option>
            <option value="textarea">多行文本</option>
            <option value="number">数字</option>
            <option value="radio">单选</option>
            <option value="checkbox">多选</option>
            <option value="image">图片</option>
            <option value="video">视频</option>
            <option value="file">文件</option>
          </select>
        </div>
      </div>
      <div class="fg" id="unitRow" style="display:none">
        <label><span class="req">*</span>单位</label>
        <div class="ctrl">
          <input id="fieldUnit" placeholder="如：万、吨、元/吨" maxlength="20" />
        </div>
      </div>
      <div class="fg" id="imageCountRow" style="display:none">
        <label><span class="req">*</span>图片张数</label>
        <div class="ctrl">
          <div class="radio-line" id="fieldImageCount">
            <label><input type="radio" name="fieldImageCount" value="single" checked />单张</label>
            <label><input type="radio" name="fieldImageCount" value="multi" />多张</label>
          </div>
        </div>
      </div>
      <div class="fg" id="optionsRow" style="display:none">
        <label><span class="req">*</span>选项</label>
        <div class="ctrl">
          <div class="opt-list" id="optList"></div>
          <button class="btn btn-default btn-sm" type="button" style="margin-top:8px" onclick="addOption()">＋ 添加选项</button>
          <div class="hint">单选 / 多选需至少配置 1 个选项；每行一个选项文案。</div>
        </div>
      </div>
      <div class="fg">
        <label>是否必填</label>
        <div class="ctrl">
          <div class="radio-line" id="fieldRequired">
            <label><input type="radio" name="fieldRequired" value="1" checked />是</label>
            <label><input type="radio" name="fieldRequired" value="0" />否</label>
          </div>
        </div>
      </div>
      <div class="fg" id="fieldModuleRow">
        <label><span class="req">*</span>所属模块</label>
        <div class="ctrl">
          <div class="mod-pick" id="fieldModulePick">
            <input id="fieldModuleFilter" type="text" placeholder="输入关键词筛选模块" autocomplete="off"
              onfocus="openFieldModDrop()" oninput="filterFieldModules()" />
            <div class="mod-pick-drop" id="fieldModuleDrop"></div>
          </div>
          <input type="hidden" id="fieldModuleId" />
          <div class="hint" id="fieldModuleHint">可输入关键字筛选并选择模块；编辑时可改到其他模块。</div>
        </div>
      </div>
      <div class="fg">
        <label>占位提示</label>
        <div class="ctrl"><input id="fieldPlaceholder" placeholder="输入框占位文案（可选）" /></div>
      </div>
      <div class="fg">
        <label>备注</label>
        <div class="ctrl"><textarea id="fieldRemark" placeholder="字段说明（可选）"></textarea></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-default" type="button" onclick="closeFieldModal()">取消</button>
      <button class="btn btn-primary" type="button" onclick="saveField()">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FORMAT_MAP={
  text:"单行文本",
  textarea:"多行文本",
  number:"数字",
  radio:"单选",
  checkbox:"多选",
  image:"图片",
  video:"视频",
  file:"文件"
};
const uid=()=>"f_"+Math.random().toString(36).slice(2,9);

function demoData(){
  return {
    sales:{
      modules:[
        {
          id:"m_sales_1", name:"白条申请", sort:1,
          fields:[
            {id:"s1", name:"客户名称", format:"text", required:true, placeholder:"系统带入", remark:"只读"},
            {id:"s2", name:"白条产品类型", format:"radio", required:true, options:["预混料","全价料","大宗免息白条"], linkable:true},
            {id:"s2a", name:"是否能收取保证金", format:"radio", required:true, options:["是","否"], remark:"预混料/全价料；提醒：30万≤额度＜50万至少5%，≥50万至少10%"},
            {id:"s3", name:"申请额度", format:"number", required:true, unit:"万", placeholder:"仅数字"},
            {id:"s3a", name:"白条金额是否大于30万", format:"radio", required:true, options:["是","否"], linkable:true},
            {id:"s4", name:"上海银行额度", format:"number", required:true, unit:"万", placeholder:"不申请填0"},
            {id:"s5", name:"锡商银行额度", format:"number", required:true, unit:"万", placeholder:"不申请填0"},
            {id:"s6", name:"申请原因", format:"text", required:true}
          ]
        },
        {
          id:"m_feed", name:"饲料信息", sort:3,
          fields:[
            {id:"fp1", name:"每月玉米需求量", format:"number", required:true, unit:"吨", parentFieldId:"s2", whenValue:"预混料"},
            {id:"fp2", name:"预混料商品名称", format:"checkbox", required:false, options:["正大蛋鸡预混料 5%","正大肉鸡预混料 3%"], remark:"模糊检索多选", parentFieldId:"s2", whenValue:"预混料"},
            {id:"fp3", name:"预混料报价", format:"number", required:false, unit:"元/吨", remark:"只读", parentFieldId:"s2", whenValue:"预混料"},
            {id:"ff1", name:"全价料每月吨数", format:"number", required:true, unit:"吨", parentFieldId:"s2", whenValue:"全价料"},
            {id:"ff2", name:"全价料商品名字", format:"text", required:true, parentFieldId:"s2", whenValue:"全价料"},
            {id:"ff3", name:"单价", format:"number", required:true, unit:"元/吨", parentFieldId:"s2", whenValue:"全价料"},

let store=loadStore();
let scope="sales";
let activeModId=null;
let editingModId=null;
let editingField=null; // {id, parentId?, fromModId, editingTopLevel}

function loadStore(){
  try{
    const raw=localStorage.getItem("baitiao_field_config_v14");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return demoData();
}
function persist(){
  localStorage.setItem("baitiao_field_config_v14", JSON.stringify(store));
}
function moduleNameById(id){
  const m=(store[scope].modules||[]).find(x=>x.id===id);
  return m?m.name:id;
}
/** 在全配置域查找字段：{ mod, field, index } */
function locateField(id){
  for(const mod of store[scope].modules||[]){
    const index=(mod.fields||[]).findIndex(f=>f.id===id);
    if(index>=0) return {mod, field:mod.fields[index], index};
  }
  return null;
}
function findParentFieldById(parentId){
  if(!parentId) return null;
  const loc=locateField(parentId);
  return loc?loc.field:null;
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove("on"),1800);
}

function currentModules(){
  return store[scope].modules.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
}
function currentModule(){
  return currentModules().find(m=>m.id===activeModId)||null;
}
function countFields(fields){
  return (fields||[]).length;
}

function switchScope(next){
  scope=next;
  document.querySelectorAll("#scopeTabs button").forEach(b=>{
    b.classList.toggle("active", b.dataset.scope===scope);
  });
  const mods=currentModules();
  activeModId=mods[0]?mods[0].id:null;
  render();
}

document.getElementById("scopeTabs").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-scope]");
  if(!btn) return;
  switchScope(btn.dataset.scope);
});

function render(){
  renderModules();
  renderFields();
}
function renderModules(){
  const list=document.getElementById("modList");
  const mods=currentModules();
  if(!mods.length){
    list.innerHTML=`<div class="empty">暂无模块，请先新增</div>`;
    return;
  }
  if(!activeModId || !mods.some(m=>m.id===activeModId)) activeModId=mods[0].id;
  list.innerHTML=mods.map(m=>`
    <div class="mod-item ${m.id===activeModId?"active":""}" data-id="${m.id}">
      <div class="name">${esc(m.name)}</div>
      <span class="cnt">${countFields(m.fields)} 字段</span>
    </div>
  `).join("");
  list.querySelectorAll(".mod-item").forEach(el=>{
    el.addEventListener("click",()=>{
      activeModId=el.dataset.id;
      render();
    });
  });
}

function renderFields(){
  const mod=currentModule();
  const title=document.getElementById("fieldPanelTitle");
  const body=document.getElementById("fieldBody");
  const addBtn=document.getElementById("btnAddField");
  if(!mod){
    title.textContent="字段列表";
    addBtn.disabled=true;
    body.innerHTML=`<div class="empty">请先选择或新建字段模块</div>`;
    return;
  }
  addBtn.disabled=false;
  const flat=false;
  title.textContent=flat?"字段列表":`${mod.name} · 字段列表`;
  const rows=[];
  flattenRows(mod.fields||[], rows);
  if(!rows.length){
    body.innerHTML=`<div class="empty">${flat?"暂无字段，点击右上角「＋ 字段」添加":"该模块暂无字段，点击右上角「＋ 字段」添加"}</div>`;
    return;
  }
  const modName=mod.name||"—";
  body.innerHTML=`
    <table class="field-table">
      <thead>
        <tr>
          <th style="width:18%">字段名字</th>
          ${flat?"":`<th style="width:14%">展示模块</th>`}
          <th style="width:10%">类型</th>
          <th style="width:16%">关联一级字段</th>
          <th style="width:18%">关联字段条件</th>
          <th style="width:24%">操作</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r=>fieldRowHtml(r, modName, flat)).join("")}
      </tbody>
    </table>
  `;
  body.querySelectorAll("[data-act]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const act=btn.dataset.act;
      const id=btn.dataset.id;
      if(act==="edit") openFieldModal(id);
      if(act==="del") deleteField(id);
      if(act==="up") moveField(id, -1);
      if(act==="down") moveField(id, 1);
    });
  });
}

function flattenRows(fields, out){
  (fields||[]).forEach(f=>out.push({field:f}));
}
function fieldRowHtml(r, modName, flat){
  const f=r.field;
  const fmt=FORMAT_MAP[f.format]||f.format;
  const parent=f.parentFieldId?findParentFieldById(f.parentFieldId):null;
  const linked=!!(f.parentFieldId && parent);
  return `
    <tr>
      <td><span>${esc(f.name)}</span></td>
      ${flat?"":`<td style="color:#595959">${esc(modName||"—")}</td>`}
      <td><span class="tag">${fmt}${f.format==="number"&&f.unit?` · ${esc(f.unit)}`:""}${f.format==="image"?` · ${f.imageCount==="multi"?"多张":"单张"}`:""}</span></td>
      <td style="color:${linked?"#595959":"#8c8c8c"}">${linked?esc(parent.name):"—"}</td>
      <td style="color:${linked?"#595959":"#8c8c8c"}">${linked?`= ${esc(f.whenValue||"—")}`:"—"}</td>
      <td class="ops" style="white-space:nowrap">
        <button class="link" type="button" data-act="edit" data-id="${f.id}">编辑</button>
        <button class="link" type="button" data-act="up" data-id="${f.id}">上移</button>
        <button class="link" type="button" data-act="down" data-id="${f.id}">下移</button>
        <button class="link danger" type="button" data-act="del" data-id="${f.id}">删除</button>
      </td>
    </tr>
  `;
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

/* —— 模块 —— */
function openModuleModal(id){
  editingModId=id||null;

function saveModule(){
  const name=document.getElementById("modName").value.trim();
  if(!name){ toast("请填写模块名称"); return; }
  const sort=Number(document.getElementById("modSort").value)|| (currentModules().length+1);
  if(editingModId){
    const m=store[scope].modules.find(x=>x.id===editingModId);
    if(m){ m.name=name; m.sort=sort; }
  }else{
    const id=uid();
    store[scope].modules.push({id, name, sort, fields:[]});
    activeModId=id;

  closeModModal();
  persist();

function deleteModule(id){
  if(!confirm("确认删除该模块及其全部字段？")) return;
  store[scope].modules=store[scope].modules.filter(m=>m.id!==id);
  if(activeModId===id) activeModId=null;
  persist();
  render();
  toast("模块已删除");
}

/* —— 字段 —— */
/** 可作为关联父级的一级单选/多选；若配置了 linkable 则仅列出标记项（当前已关联的父级始终保留） */
function eligibleParents(excludeId, keepParentId){
  const all=[];
  for(const mod of store[scope].modules||[]){
    for(const f of mod.fields||[]){
      if(excludeId && f.id===excludeId) continue;
      if(f.parentFieldId) continue;
      if((f.format==="radio"||f.format==="checkbox") && (f.options||[]).length){
        all.push({field:f, mod});
      }
    }
  }
  const marked=all.filter(x=>x.field.linkable);
  let list=marked.length?marked:all;
  if(keepParentId && !list.some(x=>x.field.id===keepParentId)){
    const keep=all.find(x=>x.field.id===keepParentId);
    if(keep) list=list.concat([keep]);
  }
  return list;
}
function fillLinkParentSelect(selectedParentId, excludeId){
  const sel=document.getElementById("fieldLinkParent");
  const parents=eligibleParents(excludeId, selectedParentId||null);
  sel.innerHTML=`<option value="">不关联</option>`+
    parents.map(({field:p})=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  if(selectedParentId && parents.some(x=>x.field.id===selectedParentId)) sel.value=selectedParentId;
  else sel.value="";
}
function fillWhenValueOptions(parent, selectedWhen){
  const sel=document.getElementById("fieldWhenValue");
  const opts=(parent&&parent.options)||[];
  sel.innerHTML=opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")||`<option value="">—</option>`;
  if(selectedWhen && opts.includes(selectedWhen)) sel.value=selectedWhen;
}
function syncLinkUi(){
  const parentId=document.getElementById("fieldLinkParent").value;
  const linked=!!parentId;
  document.getElementById("relatedWhenRow").style.display=linked?"":"none";
  document.getElementById("fieldModuleFilter").readOnly=false;
  document.getElementById("fieldModuleHint").textContent=linked
    ?"可筛选选择展示模块（可与一级字段所在模块不同，如一级在「白条申请」、本字段在「饲料信息」）"
    :"可输入关键字筛选并选择模块；编辑时可改到其他模块";
  if(linked){
    const parent=findParentFieldById(parentId);
    fillWhenValueOptions(parent, document.getElementById("fieldWhenValue").value);
  }
}
function onLinkParentChange(){
  const parentId=document.getElementById("fieldLinkParent").value;
  const parent=parentId?findParentFieldById(parentId):null;
  fillWhenValueOptions(parent, null);
  syncLinkUi();
}

/** @param {string|null} id 字段 id；新增传 null */
function openFieldModal(id){
  const mod=currentModule();
  if(!mod){ toast("请先选择模块"); return; }
  let field=null;
  let fromModId=mod.id;
  if(id){
    const loc=locateField(id);
    if(!loc){ toast("字段不存在"); return; }
    field=loc.field;
    fromModId=loc.mod.id;
  }
  const isLinked=!!(field&&field.parentFieldId);
  const isTopLevel=!!(id && field && !field.parentFieldId);
  editingField={
    id:id||null,
    parentId:isLinked?field.parentFieldId:null,
    fromModId,
    editingTopLevel:isTopLevel
  };
  document.getElementById("fieldTitle").textContent=field?"编辑字段":"新增字段";
  // 新增、或编辑关联字段：可选/可改关联一级；编辑一级字段：不展示关联
  const showLink=!editingField.editingTopLevel;
  document.getElementById("linkParentRow").style.display=showLink?"":"none";
  if(showLink){
    fillLinkParentSelect(isLinked?field.parentFieldId:null, id||null);
    if(isLinked) fillWhenValueOptions(findParentFieldById(field.parentFieldId), field.whenValue);
    else fillWhenValueOptions(null, null);
    syncLinkUi();
  }else{
    document.getElementById("relatedWhenRow").style.display="none";
    document.getElementById("fieldModuleFilter").readOnly=false;
    document.getElementById("fieldModuleHint").textContent="可输入关键字筛选并选择模块；编辑时可改到其他模块";
  }
  document.getElementById("fieldModuleRow").style.display="";
  const showMod=id?locateField(id)?.mod||mod:mod;
  setFieldModule(showMod.id, showMod.name);
  document.getElementById("fieldName").value=field?field.name:"";
  document.getElementById("fieldFormat").value=field?field.format:"text";
  document.getElementById("fieldRequired").querySelector(`input[value="${field?(field.required?"1":"0"):"1"}"]`).checked=true;
  document.getElementById("fieldPlaceholder").value=field?(field.placeholder||""):"";
  document.getElementById("fieldUnit").value=field?(field.unit||""):"";
  document.getElementById("fieldImageCount").querySelector(`input[value="${(field&&field.imageCount==="multi")?"multi":"single"}"]`).checked=true;
  document.getElementById("fieldRemark").value=field?(field.remark||""):"";
  renderOptions(field&&(field.format==="radio"||field.format==="checkbox")?(field.options||[]):[]);
  onFormatChange();
  closeFieldModDrop();
  document.getElementById("fieldMask").classList.add("on");
  setTimeout(()=>document.getElementById("fieldName").focus(),50);
}
function setFieldModule(id, name){
  document.getElementById("fieldModuleId").value=id||"";
  document.getElementById("fieldModuleFilter").value=name||"";
}
function openFieldModDrop(){
  if(document.getElementById("fieldModuleFilter").readOnly) return;
  filterFieldModules();
  document.getElementById("fieldModuleDrop").classList.add("on");
}
function closeFieldModDrop(){
  document.getElementById("fieldModuleDrop")?.classList.remove("on");
}
function filterFieldModules(){
  const drop=document.getElementById("fieldModuleDrop");
  const q=(document.getElementById("fieldModuleFilter").value||"").trim().toLowerCase();
  const cur=document.getElementById("fieldModuleId").value;
  const mods=currentModules().filter(m=>!q || String(m.name).toLowerCase().includes(q));
  if(!mods.length){
    drop.innerHTML=`<div class="mod-pick-empty">无匹配模块</div>`;
    drop.classList.add("on");
    return;
  }
  drop.innerHTML=mods.map(m=>`
    <div class="mod-pick-opt ${m.id===cur?"active":""}" data-id="${m.id}">${esc(m.name)}</div>
  `).join("");
  drop.classList.add("on");
  drop.querySelectorAll(".mod-pick-opt").forEach(el=>{
    el.onclick=()=>{
      setFieldModule(el.dataset.id, el.textContent.trim());
      closeFieldModDrop();
    };
  });
}
document.addEventListener("click",e=>{
  const pick=document.getElementById("fieldModulePick");
  if(pick && !pick.contains(e.target)) closeFieldModDrop();
});
function closeFieldModal(){
  document.getElementById("fieldMask").classList.remove("on");
  editingField=null;
  closeFieldModDrop();
}

function onFormatChange(){
  const fmt=document.getElementById("fieldFormat").value;
  const need=fmt==="radio"||fmt==="checkbox";
  document.getElementById("optionsRow").style.display=need?"grid":"none";
  document.getElementById("unitRow").style.display=fmt==="number"?"grid":"none";
  document.getElementById("imageCountRow").style.display=fmt==="image"?"grid":"none";
  if(need && !document.querySelectorAll("#optList input").length) renderOptions([""]);
}
function renderOptions(list){
  const box=document.getElementById("optList");
  const arr=list&&list.length?list:[""];
  box.innerHTML=arr.map((v,i)=>`
    <div class="opt-row">
      <input value="${esc(v)}" placeholder="选项 ${i+1}" />
      <button class="link danger" type="button" onclick="this.parentElement.remove()">删除</button>
    </div>
  `).join("");
}
function addOption(){
  const box=document.getElementById("optList");
  const row=document.createElement("div");
  row.className="opt-row";
  row.innerHTML=`<input placeholder="新选项" /><button class="link danger" type="button" onclick="this.parentElement.remove()">删除</button>`;
  box.appendChild(row);
  row.querySelector("input").focus();
}
function readOptions(){
  return [...document.querySelectorAll("#optList input")].map(i=>i.value.trim()).filter(Boolean);
}

function clearLinkedTo(parentId){
  for(const mod of store[scope].modules||[]){
    mod.fields=(mod.fields||[]).filter(f=>f.parentFieldId!==parentId);
  }
}
function upsertFieldInModule(targetMod, fieldObj, fromModId, fieldId){
  if(fieldId){
    const loc=locateField(fieldId);
    if(!loc) return false;
    const payload={...fieldObj, id:fieldId};
    if(loc.mod.id===targetMod.id){
      loc.mod.fields[loc.index]=payload;
    }else{
      loc.mod.fields.splice(loc.index,1);
      targetMod.fields.push(payload);
    }
  }else{
    targetMod.fields.push({id:uid(), ...fieldObj});
  }
  activeModId=targetMod.id;
  return true;
}
function saveField(){
  if(!editingField) return;
  const name=document.getElementById("fieldName").value.trim();
  if(!name){ toast("请填写字段名称"); return; }
  const format=document.getElementById("fieldFormat").value;
  const required=document.querySelector('input[name="fieldRequired"]:checked')?.value==="1";
  const placeholder=document.getElementById("fieldPlaceholder").value.trim();
  const unit=document.getElementById("fieldUnit").value.trim();
  const remark=document.getElementById("fieldRemark").value.trim();
  let options=[];
  if(format==="radio"||format==="checkbox"){
    options=readOptions();
    if(!options.length){ toast("请至少配置一个选项"); return; }
  }
  if(format==="number" && !unit){ toast("请填写单位"); return; }
  const targetModId=document.getElementById("fieldModuleId").value;
  const targetMod=(store[scope].modules||[]).find(m=>m.id===targetModId);
  if(!targetMod){ toast("请选择所属模块"); return; }

  let parentId=null;
  let whenValue=undefined;
  if(!editingField.editingTopLevel){
    parentId=document.getElementById("fieldLinkParent").value||null;
  }
  if(parentId){
    const parent=findParentFieldById(parentId);
    if(!parent){ toast("请选择有效的关联一级字段"); return; }
    if(parent.format!=="radio" && parent.format!=="checkbox"){
      toast("仅可关联单选 / 多选一级字段"); return;
    }
    whenValue=document.getElementById("fieldWhenValue").value;
    if(!whenValue){ toast("请选择一级选项值"); return; }
  }

  const payload={
    name, format, required, placeholder, remark,
    unit:format==="number"?unit:undefined,
    imageCount:format==="image"?(document.querySelector('input[name="fieldImageCount"]:checked')?.value||"single"):"",
    options:(format==="radio"||format==="checkbox")?options:undefined
  };
  if(parentId){
    payload.parentFieldId=parentId;
    payload.whenValue=whenValue;
  }

  if(editingField.id && editingField.editingTopLevel){
    // 编辑一级：格式从单选/多选改为其他时，清空挂靠关联字段
    const oldLoc=locateField(editingField.id);
    if(!oldLoc){ toast("字段不存在"); return; }
    const wasChoice=oldLoc.field.format==="radio"||oldLoc.field.format==="checkbox";
    const nowChoice=format==="radio"||format==="checkbox";
    if(wasChoice && !nowChoice) clearLinkedTo(editingField.id);
    if(!nowChoice) delete payload.options;
    else payload.options=options;
    upsertFieldInModule(targetMod, payload, editingField.fromModId, editingField.id);
  }else if(editingField.id){
    upsertFieldInModule(targetMod, payload, editingField.fromModId, editingField.id);
  }else{
    upsertFieldInModule(targetMod, payload, null, null);
  }
  closeFieldModal();
  persist();
  render();
  toast("字段已保存");
}

function deleteField(id){
  const loc=locateField(id);
  if(!loc) return;
  const linked=!!loc.field.parentFieldId;
  const tip=linked?"确认删除该关联字段？":"确认删除该字段及其全部关联字段？";
  if(!confirm(tip)) return;
  loc.mod.fields.splice(loc.index,1);
  if(!linked) clearLinkedTo(id);
  persist();
  render();
  toast("字段已删除");
}
function moveField(id, dir){
  const mod=currentModule();
  if(!mod) return;
  const list=mod.fields;
  const idx=list.findIndex(f=>f.id===id);
  const to=idx+dir;
  if(idx<0||to<0||to>=list.length) return;
  const [item]=list.splice(idx,1);
  list.splice(to,0,item);
  persist();
  render();
}

  persist();
  toast("配置已保存到本地");
}
function resetDemo(){
  if(!confirm("确认恢复为示例配置？当前修改将丢失。")) return;
  store=demoData();
  persist();
  activeModId=null;
  switchScope(scope);
