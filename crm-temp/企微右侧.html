<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>wechat-rightside</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: oklch(0.99 0.002 95);
      --foreground: oklch(0.22 0.02 50);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.22 0.02 50);
      --primary: oklch(0.62 0.19 45);
      --primary-foreground: oklch(0.99 0.01 95);
      --secondary: oklch(0.96 0.03 75);
      --secondary-foreground: oklch(0.45 0.12 55);
      --muted: oklch(0.96 0.01 95);
      --muted-foreground: oklch(0.55 0.02 50);
      --accent: oklch(0.58 0.18 250);
      --accent-foreground: oklch(0.99 0.01 250);
      --border: oklch(0.91 0.01 95);
      --ring: oklch(0.62 0.19 45);
      --radius: 0.75rem;
      --brand-gradient: linear-gradient(135deg, oklch(0.72 0.19 45) 0%, oklch(0.62 0.2 42) 100%);
      --profile-gradient: linear-gradient(180deg, oklch(0.97 0.04 75) 0%, oklch(0.99 0.02 85) 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--muted);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--background);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 5.5rem;
    }

    /* Tabs (shadcn TabsList + TabsTrigger pattern) */
    .tabs {
      display: flex;
      align-items: center;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      padding: 0 0.5rem;
    }

    .tabs-trigger {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.875rem 0.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--muted-foreground);
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tabs-trigger[data-state="active"] {
      color: var(--accent);
      font-weight: 600;
    }

    .tabs-trigger[data-state="active"]::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 2rem;
      height: 2px;
      border-radius: 999px;
      background: var(--accent);
    }

    /* Profile Card */
    .profile-card {
      margin: 0 0 0.75rem;
      padding: 1rem 0.75rem;
      border-radius: 0 0 calc(var(--radius) + 0.25rem) calc(var(--radius) + 0.25rem);
      background: var(--profile-gradient);
      border: none;
      border-bottom: 1px solid oklch(0.94 0.03 75);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      right: -1.5rem;
      top: -1rem;
      width: 7rem;
      height: 7rem;
      border-radius: 999px;
      background: oklch(0.92 0.06 70 / 0.45);
      pointer-events: none;
    }

    .profile-top {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .avatar {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 999px;
      border: 2px solid var(--card);
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 2px 8px oklch(0.5 0.1 45 / 0.12);
    }

    .profile-main { flex: 1; min-width: 0; }

    .profile-name {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .profile-entity {
      margin-top: 0.25rem;
      font-size: 0.8125rem;
      color: var(--foreground);
      line-height: 1.45;
    }

    .profile-meta {
      margin-top: 0.25rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 0.6875rem;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
      padding: 0.375rem 0.625rem;
    }

    .btn-outline {
      background: var(--card);
      color: var(--primary);
      border-color: oklch(0.85 0.08 55);
      padding: 0.375rem 0.625rem;
    }

    .btn-accent {
      background: var(--accent);
      color: var(--accent-foreground);
      padding: 0.625rem 1.125rem;
      font-size: 0.875rem;
      font-weight: 600;
      gap: 0.375rem;
      box-shadow: 0 4px 14px oklch(0.5 0.15 250 / 0.35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted-foreground);
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
      gap: 0.25rem;
    }

    .tags-block {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      line-height: 1.6;
      color: oklch(0.52 0.12 55);
    }

    .tags-block strong { font-weight: 600; }

    .promo-note {
      margin-top: 0.375rem;
      font-size: 0.6875rem;
      color: oklch(0.58 0.14 50);
      line-height: 1.5;
    }

    /* Sales cards row */
    .sales-row {
      display: flex;
      gap: 0.5rem;
      padding: 0 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.04);
    }

    .sales-card {
      flex: 1;
      padding: 0.625rem 0.5rem;
      min-width: 0;
    }

    .sales-card-title {
      font-size: 0.6875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      line-height: 1.35;
    }

    .sales-card-line {
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      line-height: 1.45;
    }

    .sales-card-line span { color: var(--foreground); }

    .profile-link-card {
      flex: 0 0 4.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      border: 1.5px dashed oklch(0.78 0.12 55);
      background: oklch(0.99 0.02 80);
      border-radius: var(--radius);
      cursor: pointer;
      padding: 0.5rem;
      transition: background 0.15s ease;
    }

    .profile-link-card:hover { background: oklch(0.97 0.04 75); }

    .profile-link-icon {
      width: 1.75rem;
      height: 1.75rem;
      color: var(--primary);
    }

    .profile-link-label {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--primary);
      text-align: center;
      line-height: 1.2;
    }

    /* Finance Card */
    .finance-card {
      margin: 0 0.75rem;
      border-radius: calc(var(--radius) + 0.125rem);
      background: var(--brand-gradient);
      color: var(--primary-foreground);
      overflow: hidden;
      box-shadow: 0 8px 24px oklch(0.55 0.18 45 / 0.28);
    }

    .finance-top {
      padding: 1rem 1rem 0.875rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .finance-label {
      font-size: 0.8125rem;
      opacity: 0.92;
      margin-bottom: 0.25rem;
    }

    .finance-amount {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .finance-detail {
      font-size: 0.75rem;
      opacity: 0.9;
      display: inline-flex;
      align-items: center;
      gap: 0.125rem;
      cursor: pointer;
      padding-bottom: 0.25rem;
      flex-shrink: 0;
    }

    .separator {
      height: 1px;
      background: oklch(1 0 0 / 0.22);
      margin: 0 1rem;
    }

    .finance-metrics {
      display: flex;
      align-items: stretch;
      padding: 0.875rem 0;
    }

    .metric {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      padding: 0 0.5rem;
    }

    .metric + .metric {
      border-left: 1px solid oklch(1 0 0 / 0.22);
    }

    .metric-label {
      font-size: 0.6875rem;
      opacity: 0.88;
      text-align: center;
    }

    .metric-value {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Bottom bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 0.75rem calc(0.625rem + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border);
      z-index: 10;
    }

    .bottom-left {
      display: flex;
      gap: 0.25rem;
    }

    .icon {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .fab-wrap {
      position: fixed;
      bottom: calc(3.75rem + env(safe-area-inset-bottom));
      right: max(1rem, calc(50% - 210px + 1rem));
      z-index: 11;
    }

    @media (max-width: 420px) {
      .fab-wrap { right: 1rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="tabs" role="tablist" aria-label="客户信息">
      <button class="tabs-trigger" role="tab" data-state="active" aria-selected="true">基本信息</button>
      <button class="tabs-trigger" role="tab" data-state="inactive" aria-selected="false">报价</button>
      <button class="tabs-trigger" role="tab" data-state="inactive" aria-selected="false">合同</button>
      <button class="tabs-trigger" role="tab" data-state="inactive" aria-selected="false">提货</button>
    </nav>

    <section class="profile-card" aria-label="客户基本信息">
      <div class="profile-top">
        <img class="avatar" src="https://images.unsplash.com/photo-1511895426328-dc8714191300?w=120&h=120&fit=crop" alt="杨杰头像">
        <div class="profile-main">
          <h1 class="profile-name">杨杰</h1>
          <p class="profile-entity">主体名称：山西兴宙生物科技有限公司</p>
          <p class="profile-meta">762积分 养殖户</p>
        </div>
        <div class="profile-actions">
          <button type="button" class="btn btn-primary">新增主体</button>
          <button type="button" class="btn btn-primary">切换主体</button>
          <button type="button" class="btn btn-primary">转发报价</button>
          <button type="button" class="btn btn-primary">开通卖蛋商家</button>
        </div>
      </div>
      <div class="tags-block">
        <strong>标签：</strong>VIP，上海银行签约，上银在途迁移，白条借款协议，允许白条还款
      </div>
      <p class="promo-note">（武汉中海减价21-汇福-指定报价-减20元，汇福减价9-汇福-指定报价-减10元）</p>
    </section>

    <div class="sales-row">
      <article class="card sales-card">
        <h2 class="sales-card-title">豆粕/玉米 业务员：</h2>
        <p class="sales-card-line"><span>王羽豪</span></p>
        <p class="sales-card-line"><span>徐磊</span></p>
        <p class="sales-card-line">产区-<span>黄淮</span></p>
      </article>
      <article class="card sales-card">
        <h2 class="sales-card-title">鸡蛋 业务员：</h2>
        <p class="sales-card-line"><span>--</span></p>
        <p class="sales-card-line"><span>--</span></p>
        <p class="sales-card-line"><span>--</span></p>
      </article>
      <button type="button" class="profile-link-card" aria-label="客户档案">
        <svg class="profile-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        <span class="profile-link-label">客户档案</span>
      </button>
    </div>

    <section class="finance-card" aria-label="资金信息">
      <div class="finance-top">
        <div>
          <p class="finance-label">待付款金额</p>
          <p class="finance-amount">¥ 0.00</p>
        </div>
        <span class="finance-detail">详情 ›</span>
      </div>
      <div class="separator" role="separator"></div>
      <div class="finance-metrics">
        <div class="metric">
          <span class="metric-label">可用余额</span>
          <span class="metric-value">¥ 48.52</span>
        </div>
        <div class="metric">
          <span class="metric-label">冻结金额</span>
          <span class="metric-value">¥ 661.64</span>
        </div>
        <div class="metric">
          <span class="metric-label">提现中金额</span>
          <span class="metric-value">¥ 640.00</span>
        </div>
      </div>
    </section>
  </div>

  <footer class="bottom-bar">
    <div class="bottom-left">
      <button type="button" class="btn btn-ghost">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        个人中心
      </button>
      <button type="button" class="btn btn-ghost">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
        </svg>
        通知
      </button>
    </div>
  </footer>

  <div class="fab-wrap">
    <button type="button" class="btn btn-accent">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
      写跟进
    </button>
  </div>

  <script>
    document.querySelectorAll('.tabs-trigger').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tabs-trigger').forEach(function (t) {
          t.dataset.state = 'inactive';
          t.setAttribute('aria-selected', 'false');
        });
        tab.dataset.state = 'active';
        tab.setAttribute('aria-selected', 'true');
      });
    });
  </script>
</body>
</html>
