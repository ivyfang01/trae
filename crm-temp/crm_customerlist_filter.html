<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粮巴巴 - 搜索客户筛选</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 状态栏 */
        .status-bar {
            background: #ffffff;
            padding: 12px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
            position: relative;
            z-index: 10;
        }

        .status-bar .time {
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-icons svg {
            width: 18px;
            height: 18px;
        }

        /* 导航栏 */
        .nav-bar {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
            z-index: 10;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-back {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .nav-close {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d2129;
        }

        .nav-more {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            gap: 3px;
            align-items: center;
        }

        .nav-more span {
            width: 4px;
            height: 4px;
            background: #1d2129;
            border-radius: 50%;
        }

        /* 背景页面（模糊） */
        .background-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f5f5f5;
            z-index: 1;
            filter: blur(2px);
            pointer-events: none;
        }

        .bg-search {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 60px;
        }

        .bg-search-input {
            flex: 1;
            background: #f5f5f5;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            color: #c0c4cc;
        }

        .bg-filter {
            background: #ffffff;
            padding: 12px 16px 8px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bg-filter-item {
            font-size: 14px;
            color: #4e5969;
        }

        .bg-filter-item.active {
            color: #1677ff;
        }

        .bg-distance {
            background: #ffffff;
            padding: 8px 16px 12px;
            display: flex;
            gap: 8px;
        }

        .bg-distance-tag {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #4e5969;
            background: #f2f3f5;
        }

        .bg-card {
            background: #ffffff;
            margin: 8px 12px;
            border-radius: 12px;
            padding: 16px;
        }

        .bg-card-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .bg-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 8px;
        }

        .bg-tag-visited {
            background: #e8f3ff;
            color: #1677ff;
        }

        .bg-card-info {
            font-size: 13px;
            color: #86909c;
            line-height: 1.8;
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 筛选面板 */
        .filter-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            max-width: 80vw;
            height: 100vh;
            background: #ffffff;
            z-index: 200;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .filter-panel.active {
            right: 0;
        }

        /* 筛选面板头部 */
        .filter-header {
            padding: 60px 16px 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .filter-header-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d2129;
        }

        .filter-close {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .filter-close svg {
            width: 20px;
            height: 20px;
            color: #c0c4cc;
        }

        /* 筛选内容 */
        .filter-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
        }

        .filter-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .filter-label {
            font-size: 14px;
            color: #1d2129;
            white-space: nowrap;
            min-width: 90px;
        }

        .filter-input {
            flex: 1;
            font-size: 14px;
            color: #c0c4cc;
            text-align: right;
            border: none;
            outline: none;
            background: transparent;
        }

        .filter-select {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #1d2129;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-select svg {
            width: 14px;
            height: 14px;
            color: #86909c;
        }

        /* 按钮组 */
        .filter-btn-group {
            display: flex;
            gap: 8px;
        }

        .filter-btn-option {
            padding: 4px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .filter-btn-option.active {
            background: #e8f3ff;
            color: #1677ff;
            border-color: #1677ff;
        }

        .filter-btn-option:not(.active) {
            background: #f2f3f5;
            color: #86909c;
        }

        /* 底部按钮 */
        .filter-footer {
            padding: 16px;
            display: flex;
            gap: 12px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            background: #ffffff;
        }

        .btn-clear {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d0d3d6;
            background: #ffffff;
            color: #1d2129;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            border-color: #86909c;
        }

        .btn-search {
            flex: 1.5;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #1677ff;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-search:hover {
            background: #4096ff;
        }

        /* 原型标注 */
        .annotation {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1d2129;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 300;
            white-space: nowrap;
        }

        .prototype-note {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 1px solid #e11d48;
            color: #e11d48;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 300;
            white-space: nowrap;
        }

        /* 触发按钮 */
        .trigger-btn {
            position: fixed;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 32px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            z-index: 50;
            transition: all 0.2s;
        }

        .trigger-btn:hover {
            background: #4096ff;
        }

        /* 下拉箭头样式 */
        .dropdown-arrow {
            width: 16px;
            height: 16px;
            color: #86909c;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="prototype-note">📝 新增筛选项：白条逾期（是/否）</div>

    <!-- 背景页面（模糊效果） -->
    <div class="background-page">
        <div class="status-bar">
            <span class="time">15:09</span>
            <div class="status-icons">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2z"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
            </div>
        </div>
        <div class="nav-bar">
            <div class="nav-left">
                <svg class="nav-back" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2" stroke-linecap="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                <svg class="nav-close" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
            <span class="nav-title">粮巴巴</span>
            <div class="nav-more">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="bg-search">
            <div class="bg-search-input">🔍 搜索客户名称/手机号...</div>
        </div>
        <div class="bg-filter">
            <span class="bg-filter-item">距离从近到远 ▾</span>
            <span class="bg-filter-item active">全部客户</span>
            <span class="bg-filter-item">30天未服务客户</span>
        </div>
        <div class="bg-distance">
            <span class="bg-distance-tag">不限</span>
            <span class="bg-distance-tag">500米内</span>
            <span class="bg-distance-tag">1千米内</span>
        </div>
        <div class="bg-card">
            <div class="bg-card-name">张爱</div>
            <div><span class="bg-tag bg-tag-visited">本月未拜访</span></div>
            <div class="bg-card-info">客户类型：养殖户<br>鸡只品种：...</div>
        </div>
        <div class="bg-card">
            <div class="bg-card-name">河南华</div>
            <div><span class="bg-tag bg-tag-visited">本月未拜访</span></div>
            <div class="bg-card-info">客户类型：...</div>
        </div>
    </div>

    <!-- 触发按钮 -->
    <button class="trigger-btn" onclick="openFilter()">打开筛选面板</button>

    <!-- 遮罩 -->
    <div class="overlay" id="overlay" onclick="closeFilter()"></div>

    <!-- 筛选面板 -->
    <div class="filter-panel" id="filterPanel">
        <div class="filter-header">
            <span class="filter-header-title">搜索客户</span>
            <div class="filter-close" onclick="closeFilter()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </div>
        </div>

        <div class="filter-content">
            <!-- 客户名称 -->
            <div class="filter-section">
                <span class="filter-label">客户名称</span>
                <input type="text" class="filter-input" placeholder="请填写客户名称">
            </div>

            <!-- 客户手机号 -->
            <div class="filter-section">
                <span class="filter-label">客户手机号</span>
                <input type="text" class="filter-input" placeholder="请填写客户手机号">
            </div>

            <!-- 微信昵称 -->
            <div class="filter-section">
                <span class="filter-label">微信昵称</span>
                <input type="text" class="filter-input" placeholder="请填写微信昵称">
            </div>

            <!-- 未服务天数 -->
            <div class="filter-section">
                <span class="filter-label">未服务天数</span>
                <div class="filter-select">
                    <span>全部</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- 业务归属 -->
            <div class="filter-section">
                <span class="filter-label">业务归属</span>
                <div class="filter-select">
                    <span>全部</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- 货到付款 -->
            <div class="filter-section">
                <span class="filter-label">货到付款</span>
                <div class="filter-btn-group">
                    <div class="filter-btn-option" onclick="toggleBtn(this)">是</div>
                    <div class="filter-btn-option" onclick="toggleBtn(this)">否</div>
                </div>
            </div>

            <!-- 本月拜访 -->
            <div class="filter-section">
                <span class="filter-label">本月拜访</span>
                <div class="filter-btn-group">
                    <div class="filter-btn-option" onclick="toggleBtn(this)">是</div>
                    <div class="filter-btn-option" onclick="toggleBtn(this)">否</div>
                </div>
            </div>

            <!-- 标签 -->
            <div class="filter-section">
                <span class="filter-label">标签</span>
                <div class="filter-select">
                    <span style="color: #c0c4cc;">请选择...</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- 客户等级 -->
            <div class="filter-section">
                <span class="filter-label">客户等级</span>
                <div class="filter-select">
                    <span style="color: #c0c4cc;">请选择...</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- 预混料阶段 -->
            <div class="filter-section">
                <span class="filter-label">预混料阶段</span>
                <div class="filter-select">
                    <span style="color: #c0c4cc;">请选择...</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <!-- 机会客户 -->
            <div class="filter-section">
                <span class="filter-label">机会客户</span>
                <div class="filter-btn-group">
                    <div class="filter-btn-option" onclick="toggleBtn(this)">是</div>
                    <div class="filter-btn-option" onclick="toggleBtn(this)">否</div>
                </div>
            </div>

            <!-- 【新增】白条逾期 -->
            <div class="filter-section" style="background: #fffbeb; margin: 0 -16px; padding: 14px 16px; border-radius: 8px;">
                <span class="filter-label" style="color: #e11d48; font-weight: 500;">白条逾期</span>
                <div class="filter-btn-group">
                    <div class="filter-btn-option" onclick="toggleBtn(this)" style="border-color: #e11d48;">是</div>
                    <div class="filter-btn-option" onclick="toggleBtn(this)" style="border-color: #e11d48;">否</div>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="filter-footer">
            <button class="btn-clear" onclick="clearAll()">清空</button>
            <button class="btn-search" onclick="doSearch()">查询</button>
        </div>
    </div>

    <div class="annotation">已添加「白条逾期」筛选项</div>

    <script>
        function openFilter() {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('filterPanel').classList.add('active');
        }

        function closeFilter() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('filterPanel').classList.remove('active');
        }

        function toggleBtn(el) {
            const group = el.parentElement;
            const options = group.querySelectorAll('.filter-btn-option');
            options.forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
        }

        function clearAll() {
            const inputs = document.querySelectorAll('.filter-input');
            inputs.forEach(input => input.value = '');

            const selects = document.querySelectorAll('.filter-select span');
            selects.forEach(span => {
                if (span.textContent !== '全部') {
                    span.textContent = '请选择...';
                    span.style.color = '#c0c4cc';
                }
            });

            const btnOptions = document.querySelectorAll('.filter-btn-option');
            btnOptions.forEach(btn => btn.classList.remove('active'));

            alert('已清空所有筛选条件');
        }

        function doSearch() {
            alert('执行查询...');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeFilter();
        });
    </script>
</body>
</html>
