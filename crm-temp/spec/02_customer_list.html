<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客户列表 - 规范原型</title>
    <link rel="stylesheet" href="crm-common.css">
</head>
<body>
    <div class="nav-bar">
        <div class="nav-left">
            <svg class="nav-back" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            <svg class="nav-close" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <span class="nav-title">粮巴巴</span>
        <div class="nav-more"><span></span><span></span><span></span></div>
    </div>

    <div class="search-bar">
        <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="搜索客户名称/客户手机号/微信昵称">
        </div>
        <button class="search-text-btn" type="button">搜索</button>
        <button class="search-text-btn" type="button">导出</button>
    </div>

    <div class="filter-bar">
        <div class="filter-item">距离从近到远 ▾</div>
        <div class="filter-item">注册类型 ▾</div>
        <div class="filter-item">机会点客户 ▾</div>
        <div class="filter-item" onclick="location.href='04_customer_filter.html'">更多筛选 ▾</div>
    </div>

    <div class="distance-bar" style="padding-right:110px;">
        <div class="distance-tag active">不限</div>
        <div class="distance-tag">500米内</div>
        <div class="distance-tag">1千米内</div>
        <div class="distance-tag">3千米内</div>
        <div class="map-mode-btn" onclick="location.href='03_customer_map.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            地图模式
        </div>
    </div>

    <div class="customer-list">
        <div class="customer-card" onclick="location.href='05_customer_profile.html'">
            <div class="customer-header">
                <div class="customer-name-row">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="customer-name">张爱国</span>
                </div>
                <span class="customer-assign">业务归属：付智勇</span>
            </div>
            <div class="tags-row">
                <span class="tag tag-orange">本月未拜访</span>
                <span class="tag tag-blue">注册客户</span>
            </div>
            <div class="field-grid-2">
                <div class="field-item"><span class="field-label">客户类型：</span><span class="field-value">养殖户</span></div>
                <div class="field-item"><span class="field-label">养殖规模：</span><span class="field-value">3000</span></div>
                <div class="field-item"><span class="field-label">鸡只品种：</span><span class="field-value"></span></div>
                <div class="field-item"><span class="field-label">阶段：</span><span class="field-value"></span></div>
                <div class="field-item"><span class="field-label">未提吨数：</span><span class="field-value">0吨</span></div>
                <div class="field-item"><span class="field-label">偏好：</span><span class="field-value"></span></div>
                <div class="field-item"><span class="field-label">最后下单：</span><span class="field-value"></span></div>
                <div class="field-item"><span class="field-label">最后提货：</span><span class="field-value"></span></div>
            </div>
            <div class="opportunity-row"><span class="field-label">机会点：</span><span class="link-text">添加机会点</span></div>
            <div class="links-row">
                <span class="link-text">查看门头照片</span>
                <span class="link-text">查看拜访记录</span>
            </div>
            <div class="actions-row-a">
                <div class="action-btn-a action-blue"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/></svg><span>企微</span></div>
                <div class="action-divider"></div>
                <div class="action-btn-a action-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>电话</span></div>
                <div class="action-divider"></div>
                <div class="action-btn-a action-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>导航</span></div>
                <div class="action-divider"></div>
                <div class="action-btn-a action-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 16.5-12.5z"/></svg><span>写跟进</span></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="location.href='01_crm_homepage.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>首页</span></div>
        <div class="nav-item active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>客户</span></div>
        <div class="nav-item"><span class="clock-icon-box">+</span><span>打卡</span></div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>任务</span></div>
        <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>消息</span></div>
    </div>

    <script>
        document.querySelectorAll('.distance-tag').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.distance-tag').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            });
        });
    </script>
</body>
</html>
