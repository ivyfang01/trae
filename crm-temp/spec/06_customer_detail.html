<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客户详情 - 规范原型</title>
    <link rel="stylesheet" href="crm-common.css">
</head>
<body class="has-action-bar">
    <div class="nav-bar">
        <div class="nav-left">
            <svg class="nav-back" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2" onclick="history.back()"><polyline points="15 18 9 12 15 6"/></svg>
            <svg class="nav-close" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <span class="nav-title">粮巴巴</span>
        <div class="nav-more"><span></span><span></span><span></span></div>
    </div>

    <div class="card">
        <div class="field-list">
            <div class="field-line">未提吨数：<b>0吨</b></div>
            <div class="field-line">最后下单/吨数：<b>2026-01-04 / 70吨</b></div>
            <div class="field-line">最后提货/吨数：<b>2026-01-14 / 70.96吨</b></div>
            <div class="field-line">近30日合同总吨数/提货总吨数：<b>0吨/0吨</b></div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">订货偏好</div>
        <div class="field-list">
            <div class="field-line">180天/90天平均提货间隔：<b>0天/0天</b></div>
            <div class="field-line">180天/90天平均提货吨数：<b>0吨/0吨</b></div>
            <div class="field-line">距离上次提货：<b>152天</b></div>
            <div class="field-line">偏好：<b>富之源</b></div>
        </div>
    </div>

    <div class="card">
        <div class="section-header">
            <span class="section-title">开户信息</span>
            <span class="link-more">查看更多 &gt;</span>
        </div>
        <div class="field-list">
            <div class="field-line">上银：<b>已签约</b></div>
            <div class="field-line">上银账户余额：<b>65.5</b></div>
            <div class="field-line">银行卡号：<b>6216607500005942612</b></div>
            <div class="field-line">白条：<b>未开通</b></div>
            <div class="field-line">白条最近到期时间：<b>2026-07-02</b></div>
        </div>
    </div>

    <div class="card">
        <div class="section-header">
            <span class="section-title">跟进信息</span>
            <span class="link-more">查看更多 &gt;</span>
        </div>
        <div class="field-list">
            <div class="field-line">近180天跟进次数：<b>2</b></div>
            <div class="field-line">最近跟进时间：<b>2026/03/21</b></div>
            <div class="field-line">最近跟进业务员：<b>徐帅</b></div>
        </div>
    </div>

    <div class="actions-bar-fixed">
        <button class="action-btn-outline blue" type="button">企业微信</button>
        <button class="action-btn-outline green" type="button">电话沟通</button>
        <button class="action-btn-outline orange" type="button">地址导航</button>
        <button class="action-btn-outline blue" type="button">写跟进</button>
    </div>
</body>
</html>
