<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>订单列表 - 规范原型</title>
    <link rel="stylesheet" href="crm-common.css">
</head>
<body>
    <div class="nav-bar">
        <div class="nav-left">
            <svg class="nav-back" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            <svg class="nav-close" viewBox="0 0 24 24" fill="none" stroke="#1d2129" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <span class="nav-title">粮巴巴</span>
        <div class="nav-more"><span></span><span></span><span></span></div>
    </div>

    <div class="order-filters">
        <div class="filter-item">合同 ▾</div>
        <div class="filter-item">预混料 ▾</div>
    </div>
    <div class="order-status-tabs">
        <div class="order-status-tab">待商家确认</div>
        <div class="order-status-tab">待付款</div>
        <div class="order-status-tab">进行中</div>
        <div class="order-status-tab active">已完成</div>
        <div class="order-status-tab">已取消</div>
    </div>

    <div class="order-card">
        <div class="order-card-header">
            <div class="order-title">嘉吉3%蛋鸡产蛋期预混合饲料 📄</div>
            <div class="order-status">已完成</div>
        </div>
        <div class="order-copy-row">
            <span><span class="order-label">订单编号：</span>ORD202603260001</span>
            <button class="copy-btn" type="button">复制</button>
        </div>
        <div class="order-row">
            <span><span class="order-label">产品分类：</span>预混料</span>
            <span><span class="order-label">订单单价：</span>208.5元/包 (送达价)</span>
        </div>
        <div class="order-row">
            <span><span class="order-label">提货日期：</span>2026.03.26-03.31</span>
            <span><span class="order-label">剩余订金：</span>¥ 0.00</span>
        </div>
        <div class="order-row-full"><span class="order-label">实际提货数量：</span>334包</div>
        <div class="order-row-full"><span class="order-label">预混料工厂：</span>嘉吉动物蛋白（南京）有限公司</div>
        <div class="order-row">
            <span><span class="order-label">结算方式：</span>先款后货</span>
            <span><span class="order-label">客户：</span>董二杰</span>
        </div>
        <div class="order-row">
            <span><span class="order-label">业务归属：</span>白洋</span>
            <span><span class="order-label">是否需要配方：</span>无需确认配方</span>
        </div>
        <div class="order-actions">
            <button class="btn-small-primary" type="button">创建工单</button>
            <button class="btn-small-primary" type="button">转发</button>
        </div>
    </div>

    <script>
        document.querySelectorAll('.order-status-tab').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.order-status-tab').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            });
        });
    </script>
</body>
</html>
