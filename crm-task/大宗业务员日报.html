<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大宗业务员日报 · 区域对比</title>
  <style>
    /* Admin 区域日报：默认总览对比，模块可折叠下钻 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: rgba(0,0,0,.85);
      font-size: 14px;
      line-height: 1.5715;
      padding: 24px;
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      min-height: calc(100vh - 48px);
    }
    .page-hd {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 14px 24px;
      border-bottom: 1px solid #f0f0f0;
    }
    .page-hd h1 { font-size: 16px; font-weight: 600; margin-right: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-left: auto; }
    .filters label { color: rgba(0,0,0,.45); font-size: 13px; }
    .filters select, .filters input {
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      padding: 0 11px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .filters select:focus, .filters input:focus { border-color: #40a9ff; }
    .page-bd { padding: 16px 24px 28px; }
    .tip {
      font-size: 13px;
      color: rgba(0,0,0,.45);
      margin-bottom: 12px;
    }
    .tip strong { color: rgba(0,0,0,.65); font-weight: 500; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #f0f0f0;
      margin-bottom: 8px;
    }
    .summary-table th,
    .summary-table td {
      border: 1px solid #f0f0f0;
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
    }
    .summary-table th {
      background: #fafafa;
      font-weight: 500;
      white-space: nowrap;
    }
    .summary-table td.name { text-align: left; font-weight: 500; }
    .summary-table tr.emp-row { cursor: pointer; }
    .summary-table tr.emp-row:hover { background: #f5faff; }
    .summary-table tr.emp-row.active { background: #e6f7ff; }
    .warn { color: #cf1322; }
    .ok { color: #389e0d; }
    .muted { color: rgba(0,0,0,.45); }
    .link {
      color: #1890ff;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    .link:hover { text-decoration: underline; }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .progress-bar {
      width: 72px;
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar > i {
      display: block;
      height: 100%;
      background: #1890ff;
      border-radius: 3px;
    }
    .progress-bar.warn > i { background: #ff4d4f; }

    .detail-panel {
      display: none;
      border: 1px solid #91d5ff;
      border-top: none;
      background: #fafcff;
      margin-bottom: 16px;
      padding: 0 0 8px;
    }
    .detail-panel.show { display: block; }
    .detail-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #e6f7ff;
      border-bottom: 1px solid #91d5ff;
    }
    .detail-hd .title { font-weight: 600; font-size: 14px; }
    .modules { padding: 8px 12px 4px; }

    .mod {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .mod-hd {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .mod-hd:hover { background: #fafafa; }
    .mod-hd .chev {
      width: 16px;
      color: rgba(0,0,0,.45);
      font-size: 12px;
      transition: transform .15s;
    }
    .mod.open .chev { transform: rotate(90deg); }
    .mod-hd .name { font-weight: 600; flex: 1; }
    .mod-hd .brief { color: rgba(0,0,0,.45); font-size: 13px; }
    .mod-bd {
      display: none;
      padding: 4px 16px 14px;
      border-top: 1px solid #f0f0f0;
    }
    .mod.open .mod-bd { display: block; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 24px;
      margin-top: 8px;
    }
    .field {
      display: flex;
      align-items: flex-start;
      min-height: 26px;
      font-size: 13px;
    }
    .field .label {
      color: rgba(0,0,0,.45);
      white-space: nowrap;
      margin-right: 4px;
      min-width: 120px;
    }
    .field .value { color: rgba(0,0,0,.85); word-break: break-all; }
    .field.full { grid-column: 1 / -1; }

    .client-card {
      border: 1px solid #f0f0f0;
      background: #fafafa;
      border-radius: 2px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .client-card + .client-card { margin-top: 8px; }
    .client-card .cname {
      font-weight: 600;
      color: #1890ff;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .sub-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }
    .sub-table th, .sub-table td {
      border: 1px solid #f0f0f0;
      padding: 8px;
      text-align: center;
    }
    .sub-table th { background: #fafafa; font-weight: 500; }

    .tag {
      display: inline-block;
      height: 20px;
      line-height: 18px;
      padding: 0 6px;
      font-size: 12px;
      border-radius: 2px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
      color: rgba(0,0,0,.65);
      margin-right: 4px;
    }
    .tag.blue { border-color: #91d5ff; background: #e6f7ff; color: #096dd9; }
    .tag.red { border-color: #ffa39e; background: #fff1f0; color: #cf1322; }
    .tag.green { border-color: #b7eb8f; background: #f6ffed; color: #389e0d; }

    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .filters { margin-left: 0; width: 100%; }
      .summary-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-hd">
      <h1>大宗业务员日报</h1>
      <span class="tag blue">区域对比</span>
      <div class="filters">
        <label>区域</label>
        <select id="regionSelect">
          <option value="华东" selected>华东</option>
          <option value="华北">华北</option>
          <option value="华南">华南</option>
        </select>
        <label>日期</label>
        <input type="date" id="dateInput" value="2026-07-24" />
      </div>
    </div>

    <div class="page-bd">
      <div class="tip">
        默认展示区域员工<strong>总览对比</strong>；点击员工行下钻模块详情；各模块可再展开查看拜访客户 / 未提合同等明细。
      </div>

      <table class="summary-table" id="summaryTable">
        <thead>
          <tr>
            <th style="width:48px">#</th>
            <th>业务员</th>
            <th>任务进度</th>
            <th>今日拜访</th>
            <th>拜访城市</th>
            <th>本周有效里程</th>
            <th>今日成交客户</th>
            <th>本月服务客户</th>
            <th>未提合同</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>

      <div class="detail-panel" id="detailPanel">
        <div class="detail-hd">
          <div class="title" id="detailTitle">—</div>
          <a class="link" href="javascript:;" id="btnCloseDetail">收起详情</a>
        </div>
        <div class="modules" id="modules"></div>
      </div>
    </div>
  </div>

      function milesOver(emp) {
        if (!emp.weekMilesPlan) return 0;
        return Math.round((emp.weekMiles - emp.weekMilesPlan) / emp.weekMilesPlan * 100);
      }

      function renderSummary() {
        var list = DATA[regionSelect.value] || [];
        summaryBody.innerHTML = "";
        if (!list.length) {
          summaryBody.innerHTML = '<tr><td colspan="10" class="muted">该区域暂无日报数据</td></tr>';
          detailPanel.classList.remove("show");
          activeId = null;
          return;
        }
        list.forEach(function (emp, idx) {
          var over = milesOver(emp);
          var overHtml = over > 0
            ? '<span class="warn">超过预估 ' + over + '%</span>'
            : (over < 0 ? '<span class="muted">低于预估 ' + Math.abs(over) + '%</span>' : '<span class="muted">持平</span>');
          var warnBar = emp.progress < 50 ? " warn" : "";
          var tr = document.createElement("tr");
          tr.className = "emp-row" + (activeId === emp.id ? " active" : "");
          tr.setAttribute("data-id", emp.id);
          tr.innerHTML =
            "<td>" + (idx + 1) + "</td>" +
            '<td class="name">' + emp.name + "</td>" +
            '<td><div class="progress-wrap"><div class="progress-bar' + warnBar + '"><i style="width:' + emp.progress + '%"></i></div>' + emp.progress + "%</div></td>" +
            "<td>" + emp.visitedNames.length + "/" + emp.visitTarget + "</td>" +
            "<td>" + (emp.cities.length ? emp.cities.join("、") : "—") + "</td>" +
            "<td>" + emp.weekMiles + " km<br/>" + overHtml + "</td>" +
            "<td>" + emp.dealClientsToday + "</td>" +
            "<td>" + emp.monthServe + "</td>" +
            "<td>" + (emp.unclaimed ? '<span class="tag red">' + emp.unclaimed + "</span>" : "0") + "</td>" +
            '<td><a class="link" data-action="toggle">下钻</a></td>';
          summaryBody.appendChild(tr);
        });
        if (activeId && !list.some(function (e) { return e.id === activeId; })) {
          activeId = null;
          detailPanel.classList.remove("show");
        } else if (activeId) {
          var emp = list.filter(function (e) { return e.id === activeId; })[0];
          renderDetail(emp);
        }
      }

      function field(label, value, full) {
        return '<div class="field' + (full ? " full" : "") + '"><span class="label">' + label + '：</span><span class="value">' + (value == null || value === "" ? "—" : value) + "</span></div>";
      }

      function renderDetail(emp) {
        detailTitle.textContent = emp.name + " · 日报详情";
        var over = milesOver(emp);
        var overText = over > 0 ? ("超过预估里程 " + over + "%") : (over < 0 ? ("低于预估 " + Math.abs(over) + "%") : "与预估持平");

        var visitClientsHtml = emp.visits.length
          ? emp.visits.map(function (c, i) {
              return '<div class="client-card">' +
                '<div class="cname">客户' + (i + 1) + "：" + c.name + "</div>" +
                '<div class="grid-2">' +
                field("品类", c.category) +
                field("客户当前库存（吨）", c.stock) +
                field("预计下次采购时间", c.nextBuyDate) +
                field("预计下次采购吨数（吨）", c.nextBuyTon) +
                field("拜访总结", c.summary, true) +
                field("动保机会点", c.animalOpp, true) +
                field("最近成交时间", c.lastDealDate) +
                field("最近成交吨数", c.lastDealTon) +
                field("动保本月成交金额", c.animalMonthAmt) +
                "</div></div>";
            }).join("")
          : '<div class="muted" style="padding:8px 0">今日暂无拜访客户明细</div>';

        var contractRows = emp.contracts.length
          ? emp.contracts.map(function (r) {
              return "<tr><td>" + r.no + "</td><td>" + r.customer + "</td><td>" + r.early + "</td><td>" + r.late +
                "</td><td>" + r.ton + "</td><td>" + r.left + "</td><td>" + r.price + "</td><td>" + r.mill + "</td><td>" + r.protein + "</td></tr>";

          : '<tr><td colspan="9" class="muted">暂无未提合同</td></tr>';

        modules.innerHTML =
          mod("task", "任务完成度", "目标 " + emp.visitTarget + " · 已访 " + emp.visitedNames.length + " · 进度 " + emp.progress + "%",

            field("拜访客户数目标", emp.visitTarget + "个") +
            field("已拜访客户", emp.visitedNames.length ? emp.visitedNames.join("、") : "—") +
            field("今日拜访城市", emp.cities.length ? emp.cities.join("、") : "—", true) +
            "</div>", true) +

          mod("visit", "今日拜访数据", "拜访 " + emp.visitedNames.length + " 个 · 有效里程 " + emp.weekMiles + " km",

            field("拜访客户数", emp.visitedNames.length + "个") +
            field("本周预估里程", emp.weekMilesPlan + "公里") +
            field("本周有效里程", emp.weekMiles + "公里，" + overText, true) +
            '</div><div style="margin-top:10px;font-weight:600;font-size:13px">拜访客户明细</div>' + visitClientsHtml, false) +

          mod("trade", "今日交易数据", "成交客户 " + emp.trade.dealClientCount + " 个",

            field("豆粕成交吨数", emp.trade.soybeanTon + "吨") +
            field("豆粕成交客户", emp.trade.soybeanClients) +
            field("玉米成交吨数", emp.trade.cornTon + "吨") +
            field("玉米成交客户", emp.trade.cornClients) +
            field("预混料成交吨数", emp.trade.premixTon + "吨") +
            field("预混料成交客户", emp.trade.premixClients) +
            field("动保成交金额", emp.trade.animalAmt + "元") +
            field("动保成交客户", emp.trade.animalClients) +
            field("成交客户数", emp.trade.dealClientCount + "个") +
            field("新注册客户", emp.trade.newRegister) +
            field("新客户", emp.trade.newCustomer) +
            "</div>", false) +

          mod("month", "本月数据", emp.month.serve + " · 豆粕 " + emp.month.soybean,
            '<div class="grid-2">' +
            field("服务客户数", emp.month.serve) +
            field("豆粕成交吨数", emp.month.soybean) +
            field("玉米成交吨数", emp.month.corn) +
            field("预混料成交吨数", emp.month.premix) +
            field("动保成交金额", emp.month.animalAmt) +
            field("动保成交客户", emp.month.animalClients) +
            field("新客户数", emp.month.newCount) +
            field("新客户", emp.month.newList, true) +
            "</div>", false) +

          mod("contract", "本月未提合同", "合同数量 " + emp.unclaimed + " 个",
            '<div class="grid-2">' + field("合同数量", emp.unclaimed + '个 <a class="link" href="javascript:;">查看更多</a>', true) + "</div>" +
            '<div style="margin-top:10px;font-weight:600;font-size:13px">本月未提合同详情</div>' +
            '<table class="sub-table"><thead><tr>' +
            "<th>合同编号</th><th>客户名称</th><th>最早提货期</th><th>最晚提货期</th><th>合同吨位</th><th>未提吨位</th><th>单价</th><th>油厂</th><th>蛋白</th>" +
            "</tr></thead><tbody>" + contractRows + "</tbody></table>", false);

        detailPanel.classList.add("show");
        bindModToggle();
      }

      function mod(key, name, brief, bodyHtml, open) {
        return '<div class="mod' + (open ? " open" : "") + '" data-mod="' + key + '">' +
          '<div class="mod-hd"><span class="chev">▶</span><span class="name">' + name + '</span><span class="brief">' + brief + "</span></div>" +
          '<div class="mod-bd">' + bodyHtml + "</div></div>";
      }

      function bindModToggle() {
        modules.querySelectorAll(".mod-hd").forEach(function (hd) {
          hd.addEventListener("click", function () {
            hd.parentElement.classList.toggle("open");
          });
        });
      }

      function openEmp(id) {
        var list = DATA[regionSelect.value] || [];
        var emp = list.filter(function (e) { return e.id === id; })[0];
        if (!emp) return;
        if (activeId === id) {
          activeId = null;
          detailPanel.classList.remove("show");
          renderSummary();
          return;
        }
        activeId = id;
        renderSummary();
        renderDetail(emp);
        detailPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      summaryBody.addEventListener("click", function (e) {
        var tr = e.target.closest("tr.emp-row");
        if (!tr) return;
        openEmp(tr.getAttribute("data-id"));
      });

      document.getElementById("btnCloseDetail").addEventListener("click", function () {
        activeId = null;
        detailPanel.classList.remove("show");
        renderSummary();
      });

      regionSelect.addEventListener("change", function () {
        activeId = null;
        detailPanel.classList.remove("show");
        renderSummary();
      });

      renderSummary();
    })();
  </script>
</body>
</html>
