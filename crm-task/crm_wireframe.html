<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM首页 - 线框图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #fff; }
        .wireframe { border: 1px solid #333; margin: 8px; padding: 12px; }
        .row { display: flex; gap: 8px; }
        .col { flex: 1; }
        .text { height: 20px; background: #eee; margin: 4px 0; }
        .text-sm { height: 16px; }
        .text-lg { height: 24px; }
        .btn { border: 1px solid #333; padding: 4px 12px; text-align: center; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .card { border: 1px solid #333; padding: 8px; margin-top: 8px; }
        .badge { width: 24px; height: 24px; border: 1px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .active { background: #333; color: #fff; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="wireframe row" style="justify-content: space-between; align-items: center;">
        <div class="row">
            <div class="btn">←</div>
            <div class="btn">×</div>
            <div class="text" style="width: 100px;"></div>
        </div>
        <div class="text" style="width: 20px;">⋯</div>
    </div>

    <!-- 用户信息 -->
    <div class="wireframe">
        <div class="text-sm"></div>
        <div class="row" style="align-items: center; gap: 8px;">
            <div class="text-lg"></div>
            <div class="btn">切换</div>
        </div>
        <div class="text-sm"></div>
    </div>

    <!-- 常用功能 -->
    <div class="wireframe">
        <div class="text-sm"></div>
        <div class="grid-5">
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text" style="width: 36px; height: 36px; margin: 0 auto 4px;"></div>
                <div class="text-sm"></div>
            </div>
        </div>
    </div>

    <!-- 任务日程 -->
    <div class="wireframe">
        <div class="row" style="justify-content: space-between;">
            <div class="text-sm"></div>
            <div class="text-sm" style="color: blue;">查看更多</div>
        </div>
        <div class="grid-7" style="margin-top: 8px;">
            <div class="card" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
            <div class="card active" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
            <div class="card" style="text-align: center;">
                <div class="text-sm"></div>
                <div class="text" style="width: 24px; margin: 4px auto;"></div>
            </div>
        </div>
        <div class="card">
            <div class="row" style="justify-content: space-between;">
                <div class="text-sm"></div>
                <div class="btn">+</div>
            </div>
            <div class="text-sm" style="margin-top: 4px;"></div>
        </div>
        <div class="card">
            <div class="row" style="justify-content: space-between;">
                <div class="text-sm"></div>
                <div class="text-sm" style="color: red;">30%</div>
            </div>
            <div class="text-sm" style="margin-top: 4px;"></div>
        </div>
    </div>

    <!-- 数据统计 -->
    <div class="wireframe">
        <div class="row">
            <div class="btn active">绩效</div>
            <div class="btn">销售</div>
            <div class="btn">客户</div>
            <div class="btn">团队</div>
        </div>
        <div class="row" style="margin-top: 8px;">
            <div class="btn active">今日</div>
            <div class="btn">本周</div>
            <div class="btn">本月</div>
            <div class="btn">上月</div>
        </div>
        <div class="card" style="height: 60px; display: flex; align-items: center; justify-content: center;">
            <div class="text-sm"></div>
        </div>
    </div>

    <!-- 排行榜 -->
    <div class="wireframe">
        <div class="row" style="justify-content: space-between;">
            <div class="text-sm"></div>
            <div class="text-sm" style="color: blue;">全部排行&gt;</div>
        </div>
        <div class="row" style="margin-top: 8px;">
            <div class="btn active">销售吨数</div>
            <div class="btn">服务客户数</div>
        </div>
        <div class="card row" style="margin-top: 8px; align-items: center; gap: 8px;">
            <div class="badge">1</div>
            <div class="col">
                <div class="text-sm"></div>
                <div class="text-sm" style="color: #666;"></div>
            </div>
            <div class="text"></div>
        </div>
        <div class="card row" style="align-items: center; gap: 8px;">
            <div class="badge">2</div>
            <div class="col">
                <div class="text-sm"></div>
                <div class="text-sm" style="color: #666;"></div>
            </div>
            <div class="text"></div>
        </div>
        <div class="card row" style="align-items: center; gap: 8px;">
            <div class="badge">3</div>
            <div class="col">
                <div class="text-sm"></div>
                <div class="text-sm" style="color: #666;"></div>
            </div>
            <div class="text"></div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="wireframe row" style="justify-content: space-around;">
        <div class="card" style="text-align: center;">
            <div class="text" style="width: 24px; height: 24px; margin: 0 auto 4px;"></div>
            <div class="text-sm"></div>
        </div>
        <div class="card" style="text-align: center;">
            <div class="text" style="width: 24px; height: 24px; margin: 0 auto 4px;"></div>
            <div class="text-sm"></div>
        </div>
        <div class="card" style="text-align: center;">
            <div class="text" style="width: 24px; height: 24px; margin: 0 auto 4px;"></div>
            <div class="text-sm"></div>
        </div>
        <div class="card" style="text-align: center;">
            <div class="text" style="width: 24px; height: 24px; margin: 0 auto 4px;"></div>
            <div class="text-sm"></div>
        </div>
        <div class="card" style="text-align: center;">
            <div class="text" style="width: 24px; height: 24px; margin: 0 auto 4px;"></div>
            <div class="text-sm"></div>
        </div>
    </div>
</body>
</html>
