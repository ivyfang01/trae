  <style>
    /* Admin 区域周报：默认总览对比，模块可折叠下钻 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: rgba(0,0,0,.85);
      font-size: 14px;
      line-height: 1.5715;
      padding: 24px;
    }
    .page {
      max-width: 1440px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      min-height: calc(100vh - 48px);
    }
    .page-hd {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 14px 24px;
      border-bottom: 1px solid #f0f0f0;
    }
    .page-hd h1 { font-size: 16px; font-weight: 600; margin-right: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-left: auto; }
    .filters label { color: rgba(0,0,0,.45); font-size: 13px; }
    .filters select, .filters input {
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      padding: 0 11px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .filters select:focus, .filters input:focus { border-color: #40a9ff; }
    .page-bd { padding: 16px 24px 28px; }
    .tip {
      font-size: 13px;
      color: rgba(0,0,0,.45);
      margin-bottom: 12px;
    }
    .tip strong { color: rgba(0,0,0,.65); font-weight: 500; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #f0f0f0;
      margin-bottom: 8px;
    }
    .summary-table {
      width: 100%;
    .summary-table { min-width: 1260px; }
      border-collapse: collapse;
      table-layout: fixed;
    }
    .summary-table th,
    .summary-table td {
      border: 1px solid #f0f0f0;
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      vertical-align: middle;
      background: #fff;
    }
    .summary-table th {
      background: #fafafa;
      font-weight: 500;
      color: rgba(0,0,0,.85);
      line-height: 1.35;
      white-space: normal;
      word-break: break-all;
      padding: 10px 6px;
    }
    .summary-table td.num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .summary-table td.name {
      text-align: left;
      font-weight: 500;
      padding-left: 12px;
      white-space: nowrap;
    }
    .summary-table td.name .link {
      font-weight: 500;
    }
    .summary-table td .rank-val {
      font-weight: 600;
      color: rgba(0,0,0,.85);
    }
    .summary-table col.c-idx { width: 48px; }
    .summary-table col.c-name { width: 72px; }
    .summary-table col.c-progress { width: 64px; }
    .summary-table col.c-visit { width: 72px; }
    .summary-table col.c-city { width: 100px; }
    .summary-table col.c-miles { width: 88px; }
    .summary-table col.c-fee { width: 88px; }
    .summary-table col.c-serve { width: 72px; }
    .summary-table col.c-ton { width: 80px; }
    .summary-table col.c-amt { width: 88px; }
    .summary-table col.c-contract { width: 64px; }

    .summary-table tr.emp-row { cursor: pointer; }
    .summary-table tr.emp-row:hover td { background: #f5faff; }
    .summary-table tr.emp-row.active td { background: #e6f7ff; }
    .warn { color: #cf1322; }
    .ok { color: #389e0d; }
    .muted { color: rgba(0,0,0,.45); }
    .link {
      color: #1890ff;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .link:hover { text-decoration: underline; }

    .detail-panel {
      display: none;
      border: 1px solid #91d5ff;
      border-top: none;
      background: #fafcff;
      margin-bottom: 16px;
      padding: 0 0 8px;
    }
    .detail-panel.show { display: block; }
    .detail-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #e6f7ff;
      border-bottom: 1px solid #91d5ff;
    }
    .detail-hd .title { font-weight: 600; font-size: 14px; }
    .modules { padding: 8px 12px 4px; }

    .mod {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .mod-hd {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .mod-hd:hover { background: #fafafa; }
    .mod-hd .chev {
      width: 16px;
      color: rgba(0,0,0,.45);
      font-size: 12px;
      transition: transform .15s;
    }
    .mod.open .chev { transform: rotate(90deg); }
    .mod-hd .name { font-weight: 600; flex: 1; }
    .mod-hd .brief { color: rgba(0,0,0,.45); font-size: 13px; }
    .mod-bd {
      display: none;
      padding: 4px 16px 14px;
      border-top: 1px solid #f0f0f0;
    }
    .mod.open .mod-bd { display: block; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 24px;
      margin-top: 8px;
    }
    .field {
      display: flex;
      align-items: flex-start;
      min-height: 26px;
      font-size: 13px;
    }
    .field .label {
      color: rgba(0,0,0,.45);
      white-space: nowrap;
      margin-right: 4px;
      min-width: 120px;
    }
    .field .value { color: rgba(0,0,0,.85); word-break: break-all; }
    .field.full { grid-column: 1 / -1; }

    .client-card {
      border: 1px solid #f0f0f0;
      background: #fafafa;
      border-radius: 2px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .client-card + .client-card { margin-top: 8px; }
    .client-card .cname {
      font-weight: 600;
      color: #1890ff;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .sub-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }
    .sub-table th, .sub-table td {
      border: 1px solid #f0f0f0;
      padding: 8px;
      text-align: center;
    }
    .sub-table th { background: #fafafa; font-weight: 500; }

    .tag {
      display: inline-block;
      height: 20px;
      line-height: 18px;
      padding: 0 6px;
      font-size: 12px;
      border-radius: 2px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
      color: rgba(0,0,0,.65);
      margin-right: 4px;
    }
    .tag.blue { border-color: #91d5ff; background: #e6f7ff; color: #096dd9; }
    .tag.red { border-color: #ffa39e; background: #fff1f0; color: #cf1322; }
    .tag.green { border-color: #b7eb8f; background: #f6ffed; color: #389e0d; }

    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .filters { margin-left: 0; width: 100%; }
    }
  </style>
</head>

            cities: ["青岛", "潍坊", "临沂"],
            weekMiles: 240,
            weekMilesPlan: 180,
            weekTravelFee: 1980,
            monthServe: 15,
            monthSoybeanTon: 920,
            monthCornTon: 510,
            monthPremixTon: 42,
            monthAnimalAmt: 9200,
            unclaimed: 5,
            visits: [
              { name: "青岛港贸", category: "豆粕", stock: 25, nextBuyDate: "2026-07-27", nextBuyTon: "100", summary: "大单已锁价", animalOpp: "动保套餐", lastDealDate: "2026-07-21", lastDealTon: "100", animalMonthAmt: "2500" }
            ],
            trade: {
              soybeanTon: 180, soybeanClients: "青岛港贸 100吨；济宁经销 80吨",
              cornTon: 70, cornClients: "潍坊养殖 70吨",
              premixTon: 12, premixClients: "临沂饲料 12吨",
              animalAmt: 1200, animalClients: "青岛港贸 800元；烟台贸易 400元",
              dealClientCount: 5, newRegister: "济宁经销", newCustomer: "济宁经销"
            },
            month: {
              serve: "15个/20个", soybean: "920吨/1000吨", corn: "510吨/1000吨", premix: "42吨/50吨",
              animalAmt: "9200元/10000元", animalClients: "青岛、烟台、临沂", newCount: "2个/10个", newList: "济宁经销、日照新客"
            },
            contracts: [
              { no: "HT202607050", customer: "青岛港贸", early: "2026-07-01", late: "2026-07-31", ton: 200, left: 60, price: 3080, mill: "日照", protein: "43%" }
            ]
          },
          {
            id: "zl",
            name: "赵磊",
            progress: 0,
            visitTarget: 5,
            todayVisitCount: 0,
            weekVisitCount: 0,
            taskModifyCount: 0,
            visitedNames: [],
            cities: [],
            weekMiles: 0,
            weekMilesPlan: 100,
            weekTravelFee: 0,
            monthServe: 1,
            monthSoybeanTon: 35,
            monthCornTon: 10,
            monthPremixTon: 0,
            monthAnimalAmt: 0,
            unclaimed: 0,
            visits: [],
            trade: {
              soybeanTon: 0, soybeanClients: "—",
              cornTon: 0, cornClients: "—",
              premixTon: 0, premixClients: "—",
              animalAmt: 0, animalClients: "—",
              dealClientCount: 0, newRegister: "—", newCustomer: "—"
            },
            month: {
              serve: "1个/20个", soybean: "35吨/1000吨", corn: "10吨/1000吨", premix: "0吨/50吨",
              animalAmt: "0元/10000元", animalClients: "—", newCount: "0个/10个", newList: "—"
            },
            contracts: []
          }
        ]
      };

      var activeId = null;
      var regionSelect = document.getElementById("regionSelect");
      var summaryBody = document.getElementById("summaryBody");
      var detailPanel = document.getElementById("detailPanel");
      var detailTitle = document.getElementById("detailTitle");
      var modules = document.getElementById("modules");

      function milesOver(emp) {
        if (!emp.weekMilesPlan) return 0;
        return Math.round((emp.weekMiles - emp.weekMilesPlan) / emp.weekMilesPlan * 100);
      }

      function sortedList() {
        var list = (DATA[regionSelect.value] || []).slice();
        list.sort(function (a, b) { return b.monthSoybeanTon - a.monthSoybeanTon; });
        return list;
      }

      function renderSummary() {
        var list = sortedList();
        summaryBody.innerHTML = "";
        if (!list.length) {
          summaryBody.innerHTML = '<tr><td colspan="15" class="muted">该区域暂无周报数据</td></tr>';
          detailPanel.classList.remove("show");
          activeId = null;
          return;
        }
        list.forEach(function (emp, idx) {
          var tr = document.createElement("tr");
          tr.className = "emp-row" + (activeId === emp.id ? " active" : "");
          tr.setAttribute("data-id", emp.id);
          tr.innerHTML =
            "<td class=\"num\">" + (idx + 1) + "</td>" +
            '<td class="name"><a class="link" href="javascript:;" data-action="detail">' + emp.name + "</a></td>" +
            "<td class=\"num\">" + emp.progress + "%</td>" +
            "<td class=\"num\">" + emp.todayVisitCount + "</td>" +
            "<td class=\"num\">" + emp.weekVisitCount + "</td>" +
            "<td class=\"num\">" + emp.taskModifyCount + "</td>" +
            "<td>" + (emp.cities.length ? emp.cities.join("、") : "—") + "</td>" +
            "<td class=\"num\">" + emp.weekMiles + "</td>" +
            "<td class=\"num\">" + emp.weekTravelFee.toLocaleString() + "</td>" +
            "<td class=\"num\">" + emp.monthServe + "</td>" +
            "<td class=\"num\"><span class=\"rank-val\">" + emp.monthSoybeanTon + "</span></td>" +
            "<td class=\"num\">" + emp.monthCornTon + "</td>" +
            "<td class=\"num\">" + emp.monthPremixTon + "</td>" +
            "<td class=\"num\">" + emp.monthAnimalAmt.toLocaleString() + "</td>" +
            "<td class=\"num\">" + (emp.unclaimed
              ? '<a class="link" href="javascript:;" data-action="contract">' + emp.unclaimed + "</a>"
              : "0") + "</td>";
          summaryBody.appendChild(tr);
        });
        if (activeId && !list.some(function (e) { return e.id === activeId; })) {
          activeId = null;
          detailPanel.classList.remove("show");
        } else if (activeId) {
          var emp = list.filter(function (e) { return e.id === activeId; })[0];
          renderDetail(emp);
        }
      }

      function field(label, value, full) {
        return '<div class="field' + (full ? " full" : "") + '"><span class="label">' + label + '：</span><span class="value">' + (value == null || value === "" ? "—" : value) + "</span></div>";
      }

      function renderDetail(emp, openMod) {
        detailTitle.textContent = emp.name + " · 周报详情";
        var over = milesOver(emp);
        var overText = over > 0 ? ("超过预估里程 " + over + "%") : (over < 0 ? ("低于预估 " + Math.abs(over) + "%") : "与预估持平");

        var visitClientsHtml = emp.visits.length
          ? emp.visits.map(function (c, i) {
              return '<div class="client-card">' +
                '<div class="cname">客户' + (i + 1) + "：" + c.name + "</div>" +
                '<div class="grid-2">' +
                field("品类", c.category) +
                field("客户当前库存（吨）", c.stock) +
                field("预计下次采购时间", c.nextBuyDate) +
                field("预计下次采购吨数（吨）", c.nextBuyTon) +
                field("拜访总结", c.summary, true) +
                field("动保机会点", c.animalOpp, true) +
                field("最近成交时间", c.lastDealDate) +
                field("最近成交吨数", c.lastDealTon) +
                field("动保本月成交金额", c.animalMonthAmt) +
                "</div></div>";
            }).join("")
          : '<div class="muted" style="padding:8px 0">本周暂无拜访客户明细</div>';

        var contractRows = emp.contracts.length
          ? emp.contracts.map(function (r) {
              return "<tr><td>" + r.no + "</td><td>" + r.customer + "</td><td>" + r.early + "</td><td>" + r.late +
                "</td><td>" + r.ton + "</td><td>" + r.left + "</td><td>" + r.price + "</td><td>" + r.mill + "</td><td>" + r.protein + "</td></tr>";
            }).join("")
          : '<tr><td colspan="9" class="muted">暂无未提合同</td></tr>';

        var openTask = !openMod || openMod === "task";
        modules.innerHTML =
          mod("task", "任务完成度", "今日拜访 " + emp.todayVisitCount + " · 本周拜访 " + emp.weekVisitCount + " · 修改 " + emp.taskModifyCount + " 次 · 进度 " + emp.progress + "%",
            '<div class="grid-2">' +
            field("拜访客户数目标", emp.visitTarget + "个") +
            field("今日拜访客户数", emp.todayVisitCount + "个") +
            field("本周拜访客户数", emp.weekVisitCount + "个") +
            field("任务修改次数", emp.taskModifyCount + "次") +
            field("已拜访客户", emp.visitedNames.length ? emp.visitedNames.join("、") : "—") +
            field("城市", emp.cities.length ? emp.cities.join("、") : "—", true) +
            "</div>", openTask && openMod !== "contract") +

          mod("visit", "本周拜访数据", "拜访 " + emp.weekVisitCount + " 个 · 有效里程 " + emp.weekMiles + " km · 差旅费 " + emp.weekTravelFee + " 元",
            '<div class="grid-2">' +
            field("今日拜访客户数", emp.todayVisitCount + "个") +
            field("本周拜访客户数", emp.weekVisitCount + "个") +
            field("本周使用差旅费", emp.weekTravelFee + "元") +
            field("本周预估里程", emp.weekMilesPlan + "公里") +
            field("本周有效里程", emp.weekMiles + "公里，" + overText, true) +
            '</div><div style="margin-top:10px;font-weight:600;font-size:13px">拜访客户明细</div>' + visitClientsHtml, openMod === "visit") +

          mod("trade", "本周交易数据", "成交客户 " + emp.trade.dealClientCount + " 个",
            '<div class="grid-2">' +
            field("豆粕成交吨数", emp.trade.soybeanTon + "吨") +
            field("豆粕成交客户", emp.trade.soybeanClients) +
            field("玉米成交吨数", emp.trade.cornTon + "吨") +
            field("玉米成交客户", emp.trade.cornClients) +
            field("预混料成交吨数", emp.trade.premixTon + "吨") +
            field("预混料成交客户", emp.trade.premixClients) +
            field("动保成交金额", emp.trade.animalAmt + "元") +
            field("动保成交客户", emp.trade.animalClients) +
            field("成交客户数", emp.trade.dealClientCount + "个") +
            field("新注册客户", emp.trade.newRegister) +
            field("新客户", emp.trade.newCustomer) +
            "</div>", openMod === "trade") +

          mod("month", "本月数据", "服务客户 " + emp.monthServe + " · 豆粕 " + emp.monthSoybeanTon + "吨",
            '<div class="grid-2">' +
            field("本月服务客户数", emp.monthServe + "个") +
            field("本月豆粕成交吨数", emp.monthSoybeanTon + "吨") +
            field("本月玉米成交吨数", emp.monthCornTon + "吨") +
            field("本月预混料成交吨数", emp.monthPremixTon + "吨") +
            field("本月动保成交金额", emp.monthAnimalAmt + "元") +
            field("动保成交客户", emp.month.animalClients) +
            field("新客户数", emp.month.newCount) +
            field("新客户", emp.month.newList, true) +
            "</div>", openMod === "month") +

          mod("contract", "本月未提合同", "合同数量 " + emp.unclaimed + " 个",
            '<div style="font-weight:600;font-size:13px">本月未提合同详情</div>' +
            '<table class="sub-table"><thead><tr>' +
            "<th>合同编号</th><th>客户名称</th><th>最早提货期</th><th>最晚提货期</th><th>合同吨位</th><th>未提吨位</th><th>单价</th><th>油厂</th><th>蛋白</th>" +
            "</tr></thead><tbody>" + contractRows + "</tbody></table>", openMod === "contract");

        detailPanel.classList.add("show");
        bindModToggle();
      }

      function mod(key, name, brief, bodyHtml, open) {
        return '<div class="mod' + (open ? " open" : "") + '" data-mod="' + key + '">' +
          '<div class="mod-hd"><span class="chev">▶</span><span class="name">' + name + '</span><span class="brief">' + brief + "</span></div>" +
          '<div class="mod-bd">' + bodyHtml + "</div></div>";
      }

      function bindModToggle() {
        modules.querySelectorAll(".mod-hd").forEach(function (hd) {
          hd.addEventListener("click", function () {
            hd.parentElement.classList.toggle("open");
          });
        });
      }

      function openEmp(id, openMod) {
        var list = sortedList();
        var emp = list.filter(function (e) { return e.id === id; })[0];
        if (!emp) return;
        if (activeId === id && !openMod) {
          activeId = null;
          detailPanel.classList.remove("show");
          renderSummary();
          return;
        }
        activeId = id;
        renderSummary();
        renderDetail(emp, openMod || "task");
        detailPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      summaryBody.addEventListener("click", function (e) {
        var tr = e.target.closest("tr.emp-row");
        if (!tr) return;
        var id = tr.getAttribute("data-id");
        if (e.target.closest("[data-action='contract']")) {
          e.preventDefault();
          e.stopPropagation();
          openEmp(id, "contract");
          return;
        }
        if (e.target.closest("[data-action='detail']")) {
          e.preventDefault();
          e.stopPropagation();
          openEmp(id, "task");
          return;
        }
        openEmp(id);
      });

      document.getElementById("btnCloseDetail").addEventListener("click", function () {
        activeId = null;
        detailPanel.classList.remove("show");
        renderSummary();
      });

      regionSelect.addEventListener("change", function () {
        activeId = null;
        detailPanel.classList.remove("show");
        renderSummary();
      });

      renderSummary();
    })();
  </script>
</body>
</html>
