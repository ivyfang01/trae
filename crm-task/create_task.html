<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>创建任务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .navbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; z-index: 1; }
        .nav-btn { font-size: 22px; color: #333; cursor: pointer; line-height: 1; user-select: none; }
        .nav-btn.back { font-size: 20px; }
        .nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 17px; font-weight: 600; color: #333;
        }
        .nav-right { font-size: 22px; color: #333; cursor: pointer; z-index: 1; letter-spacing: 2px; }
        .form-container { background: #fff; }
        .group-header {
            padding: 10px 16px; background: #f5f5f5;
            font-size: 14px; font-weight: 500; color: #333;
        }
        .form-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
        }
        .form-label { font-size: 15px; color: #333; }
        .required { color: #ff4d4f; margin-right: 2px; }
        .form-value { font-size: 15px; color: #999; }
        .form-arrow { font-size: 18px; color: #ccc; font-weight: 300; }
        .link-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
        }
        .link-btn {
            color: #1890ff; font-size: 14px; display: flex; align-items: center;
            gap: 4px; cursor: pointer; border: none; background: none; padding: 0;
        }
        .link-btn .icon-plus {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border: 1.5px solid #1890ff;
            border-radius: 50%; font-size: 12px; line-height: 1;
        }
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; gap: 12px; padding: 12px 16px; background: #fff;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }
        .btn {
            flex: 1; padding: 12px; border-radius: 6px;
            font-size: 16px; font-weight: 500; cursor: pointer;
        }
        .btn-cancel { background: #fff; color: #333; border: 1px solid #d9d9d9; }
        .btn-confirm { background: #1890ff; color: #fff; border: 1px solid #1890ff; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <span class="nav-btn back">&lt;</span>
            <span class="nav-btn">&times;</span>
        </div>
        <h1 class="nav-title">创建任务</h1>
        <span class="nav-right">&hellip;</span>
    </header>
    <main class="form-container">
        <div class="group-header">客户名单</div>
        <div class="form-row">
            <label class="form-label"><span class="required">*</span>客户</label>
            <span class="form-arrow">&rsaquo;</span>
        </div>
        <div class="link-row">
            <button type="button" class="link-btn"><span class="icon-plus">+</span>上传客户名单</button>
            <button type="button" class="link-btn">样表下载</button>
        </div>
        <div class="form-row">
            <label class="form-label"><span class="required">*</span>完成时间</label>
            <span class="form-value">2026/6/14 本周日</span>
        </div>
        <div class="form-row">
            <label class="form-label">开始时间</label>
            <span class="form-value">2026/6/10 本周三</span>
        </div>
    </main>
    <footer class="bottom-bar">
        <button type="button" class="btn btn-cancel">取消</button>
        <button type="button" class="btn btn-confirm">确定</button>
    </footer>
</body>
</html>
