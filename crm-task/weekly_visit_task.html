<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周度拜访任务 - 线框图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; padding: 16px; }
        
        .container {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        
        .progress {
            font-size: 15px;
            font-weight: 600;
            color: #ff6b35;
        }
        
        .add-btn {
            font-size: 14px;
            color: #1890ff;
            cursor: pointer;
        }
        
        .customer-list {
            padding: 0 16px;
        }
        
        .customer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .customer-item:last-child {
            border-bottom: none;
        }
        
        .customer-name {
            font-size: 14px;
            color: #333;
        }
        
        .status {
            font-size: 14px;
            color: #999;
        }
        
        .status.completed {
            color: #52c41a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">4.27-5.3号周度拜访任务</div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="progress">30%</div>
                <div class="add-btn">添加客户</div>
            </div>
        </div>
        
        <div class="customer-list">
            <div class="customer-item">
                <div class="customer-name">客户A</div>
                <div class="status">本周日</div>
            </div>
            <div class="customer-item">
                <div class="customer-name">客户B</div>
                <div class="status">本周日</div>
            </div>
            <div class="customer-item">
                <div class="customer-name">客户B</div>
                <div class="status">本周日</div>
            </div>
            <div class="customer-item">
                <div class="customer-name">客户C</div>
                <div class="status completed">已完成</div>
            </div>
        </div>
    </div>
</body>
</html>
