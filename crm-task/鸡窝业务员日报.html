<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鸡窝业务员日报 · 区域对比</title>
  <style>
    /* Admin 区域日报：默认总览对比，模块可折叠下钻；字段对齐 JWdailywork_ddcard */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: rgba(0,0,0,.85);
      font-size: 14px;
      line-height: 1.5715;
      padding: 24px;
    }
    .page {
      max-width: 1440px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      min-height: calc(100vh - 48px);
    }
    .page-hd {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 20px;
      padding: 14px 24px;
      border-bottom: 1px solid #f0f0f0;
    }
    .page-hd h1 { font-size: 16px; font-weight: 600; margin-right: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-left: auto; }
    .filters label { color: rgba(0,0,0,.45); font-size: 13px; }
    .filters select, .filters input {
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: 2px;
      padding: 0 11px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .filters select:focus, .filters input:focus { border-color: #40a9ff; }
    .page-bd { padding: 16px 24px 28px; }
    .tip {
      font-size: 13px;
      color: rgba(0,0,0,.45);
      margin-bottom: 12px;
    }
    .tip strong { color: rgba(0,0,0,.65); font-weight: 500; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #f0f0f0;
      margin-bottom: 8px;
    }
    .summary-table {
      width: 100%;
      min-width: 1280px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .summary-table th,
    .summary-table td {
      border: 1px solid #f0f0f0;
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      vertical-align: middle;
      background: #fff;
    }
    .summary-table th {
      background: #fafafa;
      font-weight: 500;
      color: rgba(0,0,0,.85);
      line-height: 1.35;
      white-space: normal;
      word-break: break-all;
      padding: 10px 6px;
    }
    .summary-table td.num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .summary-table td.name {
      text-align: left;
      font-weight: 500;
      padding-left: 12px;
      white-space: nowrap;
    }
    .summary-table td.name .link { font-weight: 500; }
    .summary-table td .rank-val {
      font-weight: 600;
      color: rgba(0,0,0,.85);
    }
    .summary-table col.c-idx { width: 48px; }
    .summary-table col.c-name { width: 72px; }
    .summary-table col.c-progress { width: 64px; }
    .summary-table col.c-visit { width: 72px; }
    .summary-table col.c-city { width: 100px; }
    .summary-table col.c-miles { width: 88px; }
    .summary-table col.c-ton { width: 80px; }
    .summary-table col.c-amt { width: 88px; }
    .summary-table col.c-deal { width: 72px; }
    .summary-table col.c-new { width: 80px; }
    .summary-table col.c-debt { width: 64px; }
    .summary-table col.c-serve { width: 72px; }
    .summary-table col.c-fee { width: 88px; }

    .summary-table tr.emp-row { cursor: pointer; }
    .summary-table tr.emp-row:hover td { background: #f5faff; }
    .summary-table tr.emp-row.active td { background: #e6f7ff; }
    .warn { color: #cf1322; }
    .ok { color: #389e0d; }
    .muted { color: rgba(0,0,0,.45); }
    .link {
      color: #1890ff;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .link:hover { text-decoration: underline; }

    .detail-panel {
      display: none;
      border: 1px solid #91d5ff;
      border-top: none;
      background: #fafcff;
      margin-bottom: 16px;
      padding: 0 0 8px;
    }
    .detail-panel.show { display: block; }
    .detail-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #e6f7ff;
      border-bottom: 1px solid #91d5ff;
    }
    .detail-hd .title { font-weight: 600; font-size: 14px; }
    .modules { padding: 8px 12px 4px; }

    .mod {
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .mod-hd {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }
    .mod-hd:hover { background: #fafafa; }
    .mod-hd .chev {
      width: 16px;
      color: rgba(0,0,0,.45);
      font-size: 12px;
      transition: transform .15s;
    }
    .mod.open .chev { transform: rotate(90deg); }
    .mod-hd .name { font-weight: 600; flex: 1; }
    .mod-hd .brief { color: rgba(0,0,0,.45); font-size: 13px; }
    .mod-bd {
      display: none;
      padding: 4px 16px 14px;
      border-top: 1px solid #f0f0f0;
    }
    .mod.open .mod-bd { display: block; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 24px;
      margin-top: 8px;
    }
    .field {
      display: flex;
      align-items: flex-start;
      min-height: 26px;
      font-size: 13px;
    }
    .field .label {
      color: rgba(0,0,0,.45);
      white-space: nowrap;
      margin-right: 4px;
      min-width: 120px;
    }
    .field .value { color: rgba(0,0,0,.85); word-break: break-all; }
    .field.full { grid-column: 1 / -1; }

    .client-card {
      border: 1px solid #f0f0f0;
      background: #fafafa;
      border-radius: 2px;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .client-card + .client-card { margin-top: 8px; }
    .client-card .cname {
      font-weight: 600;
      color: #1890ff;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .sub-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }
    .sub-table th, .sub-table td {
      border: 1px solid #f0f0f0;
      padding: 8px;
      text-align: center;
    }
    .sub-table th { background: #fafafa; font-weight: 500; }

    .tag {
      display: inline-block;
      height: 20px;
      line-height: 18px;
      padding: 0 6px;
      font-size: 12px;
      border-radius: 2px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
      color: rgba(0,0,0,.65);
      margin-right: 4px;
    }
    .tag.blue { border-color: #91d5ff; background: #e6f7ff; color: #096dd9; }

    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
      .filters { margin-left: 0; width: 100%; }
    }
  </style>
</head>

                name: "青岛港贸", category: "豆粕", stock: 25, summary: "大单已锁价",
                animalOpp: "动保套餐", breedingArchive: "已填写", premixOpp: "—",
                lastDealDate: "2026-07-21", lastDealTon: "100", animalAmt: "2500"
              },
              {
                name: "潍坊养殖", category: "预混料", stock: 6, summary: "库存下降可跟进",
                animalOpp: "疫苗", breedingArchive: "已填写", premixOpp: "想换配方",
                lastDealDate: "2026-07-12", lastDealTon: "4", animalAmt: "800"
              }
            ],
            trade: {
              soybeanTon: 120, soybeanClients: "青岛港贸 80吨；临沂饲料 40吨",
              cornTon: 50, cornClients: "潍坊养殖 50吨",
              premixTon: 12, premixClients: "潍坊养殖 8吨；烟台贸易 4吨",
              animalAmt: 1500, animalClients: "青岛港贸 1000元；潍坊养殖 500元",
              dealClientCount: 4, newRegister: "烟台贸易", newCustomer: "烟台贸易"
            },
            month: {
              serve: "12个/20个", soybean: "560吨/1000吨", corn: "380吨/1000吨", premix: "36吨/50吨",
              animalAmt: "7800元/10000元", animalClients: "青岛、潍坊、烟台", newCount: "2个/10个", newList: "烟台贸易、济宁新客"
            },
            debtCount: 5,
            debts: [
              { customerId: "C5001", customer: "青岛港贸", scale: "2000头", pickupNo: "TH20260723020", applyDate: "2026-07-23", unloadTime: "2026-07-24 08:40", status: "待补款", receivable: 32000, diffAmt: 5600 },
              { customerId: "C5002", customer: "临沂饲料", scale: "900头", pickupNo: "TH20260720014", applyDate: "2026-07-20", unloadTime: "2026-07-21 13:15", status: "部分补款", receivable: 14000, diffAmt: 2200 }
            ]
          },
          {
            id: "zl",
            name: "赵磊",
            progress: 25,
            visitTarget: 4,
            taskModifyCount: 0,
            todayVisitCount: 1,
            visitedNames: ["济宁经销"],
            cities: ["济宁"],
            miles: 45,
            milesPlan: 80,
            travelFee: 280,
            monthServe: 3,
            monthSoybeanTon: 80,
            premixOppClients: ["济宁经销"],
            visits: [
              {
                name: "济宁经销", category: "预混料", stock: 1, summary: "新客建档",
                animalOpp: "—", breedingArchive: "已填写", premixOpp: "缺钱",
                lastDealDate: "—", lastDealTon: "—", animalAmt: "—"
              }
            ],
            trade: {
              soybeanTon: 10, soybeanClients: "济宁经销 10吨",
              cornTon: 0, cornClients: "—",
              premixTon: 1, premixClients: "济宁经销 1吨",
              animalAmt: 0, animalClients: "—",
              dealClientCount: 1, newRegister: "济宁经销", newCustomer: "济宁经销"
            },
            month: {
              serve: "3个/20个", soybean: "80吨/1000吨", corn: "30吨/1000吨", premix: "4吨/50吨",
              animalAmt: "200元/10000元", animalClients: "—", newCount: "1个/10个", newList: "济宁经销"
            },
            debtCount: 0,
            debts: []
          }
        ]
      };

      var activeId = null;
      var regionSelect = document.getElementById("regionSelect");
      var dateSelect = document.getElementById("dateSelect");
      var tipText = document.getElementById("tipText");
      var summaryBody = document.getElementById("summaryBody");
      var detailPanel = document.getElementById("detailPanel");
      var detailTitle = document.getElementById("detailTitle");
      var modules = document.getElementById("modules");

      function milesOver(emp) {
        if (!emp.milesPlan) return 0;
        return Math.round((emp.miles - emp.milesPlan) / emp.milesPlan * 100);
      }

      function sortedList() {
        var list = (DATA[regionSelect.value] || []).slice();
        list.sort(function (a, b) { return b.progress - a.progress; });
        return list;
      }

      function updateTip() {
        tipText.textContent = "日期：" + dateSelect.value + "，按照今日任务完成度排名";
      }

      function renderSummary() {
        var list = sortedList();
        summaryBody.innerHTML = "";
        if (!list.length) {
          summaryBody.innerHTML = '<tr><td colspan="16" class="muted">该区域暂无日报数据</td></tr>';
          detailPanel.classList.remove("show");
          activeId = null;
          return;
        }
        list.forEach(function (emp, idx) {
          var tr = document.createElement("tr");
          tr.className = "emp-row" + (activeId === emp.id ? " active" : "");
          tr.setAttribute("data-id", emp.id);
          tr.innerHTML =
            "<td class=\"num\">" + (idx + 1) + "</td>" +
            '<td class="name"><a class="link" href="javascript:;" data-action="detail">' + emp.name + "</a></td>" +
            "<td class=\"num\"><span class=\"rank-val\">" + emp.progress + "%</span></td>" +
            "<td class=\"num\">" + emp.todayVisitCount + "</td>" +
            "<td>" + (emp.cities.length ? emp.cities.join("、") : "—") + "</td>" +
            "<td class=\"num\">" + emp.taskModifyCount + "</td>" +
            "<td class=\"num\">" + emp.miles + "</td>" +
            "<td class=\"num\">" + (emp.debtCount
              ? '<a class="link" href="javascript:;" data-action="debt">' + emp.debtCount + "</a>"
              : "0") + "</td>" +
            "<td class=\"num\">" + emp.trade.premixTon + "</td>" +
            "<td class=\"num\">" + emp.trade.animalAmt.toLocaleString() + "</td>" +
            "<td class=\"num\">" + emp.trade.cornTon + "</td>" +
            "<td class=\"num\">" + emp.trade.soybeanTon + "</td>" +
            "<td class=\"num\">" + emp.trade.dealClientCount + "</td>" +
            "<td>" + (emp.trade.newCustomer || "—") + "</td>" +
            "<td class=\"num\">" + emp.monthServe + "</td>" +
            "<td class=\"num\">" + emp.travelFee.toLocaleString() + "</td>";
          summaryBody.appendChild(tr);
        });
        if (activeId && !list.some(function (e) { return e.id === activeId; })) {
          activeId = null;
          detailPanel.classList.remove("show");
        } else if (activeId) {
          var emp = list.filter(function (e) { return e.id === activeId; })[0];
          renderDetail(emp);
        }
      }

      function field(label, value, full) {
        return '<div class="field' + (full ? " full" : "") + '"><span class="label">' + label + '：</span><span class="value">' + (value == null || value === "" ? "—" : value) + "</span></div>";
      }

      function renderDetail(emp, openMod) {
        detailTitle.textContent = emp.name + " · 日报详情";
        var over = milesOver(emp);
        var overText = over > 0
          ? ("超预估里程 " + over + "%")
          : (over < 0 ? ("低于预估 " + Math.abs(over) + "%") : "与预估持平");

        var visitClientsHtml = emp.visits.length
          ? emp.visits.map(function (c, i) {
              return '<div class="client-card">' +
                '<div class="cname">客户' + (i + 1) + "：" + c.name + "</div>" +
                '<div class="grid-2">' +
                field("品类", c.category) +
                field("当前库存（吨）", c.stock) +
                field("拜访总结", c.summary, true) +
                field("动保机会点", c.animalOpp, true) +
                field("养殖档案", c.breedingArchive) +
                field("预混料机会点", c.premixOpp) +
                field("最近成交时间", c.lastDealDate) +
                field("最近成交吨数", c.lastDealTon) +
                field("动保交易金额", c.animalAmt) +
                "</div></div>";
            }).join("")
          : '<div class="muted" style="padding:8px 0">今日暂无拜访客户明细</div>';

        var debtRows = emp.debts.length
          ? emp.debts.map(function (r) {
              return "<tr><td>" + r.customerId + "</td><td>" + r.customer + "</td><td>" + r.scale +
                "</td><td>" + r.pickupNo + "</td><td>" + r.applyDate + "</td><td>" + r.unloadTime +
                "</td><td>" + r.status + "</td><td>" + r.receivable.toLocaleString() +
                "</td><td>" + r.diffAmt.toLocaleString() + "</td></tr>";
            }).join("")
          : '<tr><td colspan="9" class="muted">暂无差款订单</td></tr>';

        var openTask = !openMod || openMod === "progress";
        modules.innerHTML =
          mod("progress", "今日任务进展", "进度 " + emp.progress + "% · 拜访 " + emp.todayVisitCount + "/" + emp.visitTarget + " · 修改 " + emp.taskModifyCount + " 次",
            '<div class="grid-2">' +
            field("进度", emp.progress + "%") +
            field("拜访客户数目标", emp.visitTarget + "个") +
            field("任务修改次数", emp.taskModifyCount + "次") +
            field("已拜访客户数", emp.todayVisitCount + "个") +
            field("今日拜访城市", emp.cities.length ? emp.cities.join("、") : "—", true) +
            "</div>", openTask && openMod !== "debt") +



            mod("debt", "差款订单", "差款订单数量 " + emp.debtCount + " 个",
            // '<div style="font-weight:600;font-size:13px">差款订单详情</div>' +
            '<table class="sub-table"><thead><tr>' +
            "<th>客户ID</th><th>客户名称</th><th>养殖规模</th><th>提货单编号</th><th>申请提货日期</th><th>上传卸货磅单时间</th><th>提货单状态</th><th>应收货款</th><th>总差款</th>" +
            "</tr></thead><tbody>" + debtRows + "</tbody></table>", openMod === "debt") +

          mod("visit", "今日拜访数据", "拜访 " + emp.todayVisitCount + " 个 · 有效里程 " + emp.miles + " km",
            '<div class="grid-2">' +
            field("拜访客户数", emp.todayVisitCount + "个") +
            field("已拜访客户数", emp.visitedNames.length ? emp.visitedNames.join("、") : "—") +
            field("预估里程", emp.milesPlan + "公里") +
            field("有效里程", emp.miles + "公里，" + overText) +
            field("差旅费", emp.travelFee + "元") +
            '</div><div style="margin-top:10px;font-weight:600;font-size:13px">拜访客户明细</div>' + visitClientsHtml, openMod === "visit") +

          mod("premix", "今日预混料机会点客户", emp.premixOppClients.length ? ("客户 " + emp.premixOppClients.length + " 个") : "暂无",
            '<div class="grid-2">' +
            field("客户名单", emp.premixOppClients.length ? emp.premixOppClients.join("、") : "—", true) +
            "</div>", openMod === "premix") +

          mod("trade", "今日交易数据", "",
            '<div class="grid-2">' +
            field("预混料成交吨数", emp.trade.premixTon + "吨") +
            field("预混料成交客户", emp.trade.premixClients) +
            field("动保成交金额", emp.trade.animalAmt + "元") +
            field("动保成交客户", emp.trade.animalClients) +
            field("玉米成交吨数", emp.trade.cornTon + "吨") +
            field("玉米成交客户", emp.trade.cornClients) +
            field("豆粕成交吨数", emp.trade.soybeanTon + "吨") +
            field("豆粕成交客户", emp.trade.soybeanClients) +
            field("成交客户数", emp.trade.dealClientCount + "个") +
            field("新注册客户", emp.trade.newRegister) +
            field("新客户", emp.trade.newCustomer) +
            "</div>", openMod === "trade") +


          mod("month", "本月数据", "",
            '<div class="grid-2">' +
            field("服务客户数", emp.month.serve) +
            field("豆粕成交吨数", emp.month.soybean) +
            field("玉米成交吨数", emp.month.corn) +
            field("预混料成交吨数", emp.month.premix) +
            field("动保成交金额", emp.month.animalAmt) +
            field("动保成交客户", emp.month.animalClients) +
            field("新客户数", emp.month.newCount) +
            field("新客户", emp.month.newList, true) +
            "</div>", openMod === "month");

        detailPanel.classList.add("show");
        bindModToggle();
      }

      function mod(key, name, brief, bodyHtml, open) {
        return '<div class="mod' + (open ? " open" : "") + '" data-mod="' + key + '">' +
          '<div class="mod-hd"><span class="chev">▶</span><span class="name">' + name + '</span><span class="brief">' + brief + "</span></div>" +
          '<div class="mod-bd">' + bodyHtml + "</div></div>";
      }

      function bindModToggle() {
        modules.querySelectorAll(".mod-hd").forEach(function (hd) {
          hd.addEventListener("click", function () {
            hd.parentElement.classList.toggle("open");
          });
        });
      }

      function openEmp(id, openMod) {
        var list = sortedList();
        var emp = list.filter(function (e) { return e.id === id; })[0];
        if (!emp) return;
        if (activeId === id && !openMod) {
          activeId = null;
          detailPanel.classList.remove("show");
          renderSummary();
          return;
        }
        activeId = id;
        renderSummary();
        renderDetail(emp, openMod || "progress");
        detailPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      summaryBody.addEventListener("click", function (e) {
        var tr = e.target.closest("tr.emp-row");
        if (!tr) return;
        var id = tr.getAttribute("data-id");
        if (e.target.closest("[data-action='debt']")) {
          e.preventDefault();
          e.stopPropagation();
          openEmp(id, "debt");
          return;
        }
        if (e.target.closest("[data-action='detail']")) {
          e.preventDefault();
          e.stopPropagation();
          openEmp(id, "progress");
          return;
        }
        openEmp(id);
      });

      document.getElementById("btnCloseDetail").addEventListener("click", function () {
        activeId = null;
        detailPanel.classList.remove("show");
        renderSummary();
      });

      regionSelect.addEventListener("change", function () {
        activeId = null;
        detailPanel.classList.remove("show");
        renderSummary();
      });

      dateSelect.addEventListener("change", function () {
        updateTip();
      });

      updateTip();
      renderSummary();
    })();
  </script>
</body>
</html>
