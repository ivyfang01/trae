<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拜访记录查看 · 7月3识别数据</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --card: #fff;
      --primary: #1677ff;
      --text: #1d2129;
      --muted: #86909c;
      --border: #e5e6eb;
      --success: #00b42a;
      --warning: #ff7d00;
      --danger: #f53f3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .stat { background: #f7f8fa; border-radius: 8px; padding: 8px 14px; font-size: 13px; }
    .stat b { font-size: 18px; margin-right: 4px; color: var(--primary); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .toolbar input, .toolbar select {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      background: #fff;
    }
    .toolbar input { min-width: 200px; flex: 1; max-width: 320px; }
    .container { padding: 16px 20px 40px; max-width: 1600px; margin: 0 auto; }
    .table-wrap {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1200px; }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      background: #fafafa;
      font-weight: 600;
      color: #4e5969;
      position: sticky;
      top: 0;
      white-space: nowrap;
      z-index: 1;
    }
    tr:hover td { background: #fafcff; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
    }
    .tag-ok { background: #e8ffea; color: var(--success); }
    .tag-bad { background: #fff7e8; color: var(--warning); }
    .tag-fail { background: #ffece8; color: var(--danger); }
    .tag-empty { background: #f2f3f5; color: var(--muted); }
    .photo-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 220px; }
    .thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: #f7f8fa;
    }
    .thumb:hover { opacity: .85; outline: 2px solid rgba(22,119,255,.25); }
    .link-btn {
      color: var(--primary);
      cursor: pointer;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
      border: none;
      background: none;
      padding: 0;
    }
    .link-btn:hover { text-decoration: underline; }
    .empty { text-align: center; padding: 48px; color: var(--muted); }
    .count-tip { font-size: 12px; color: var(--muted); margin-left: auto; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-box {
      position: relative;
      max-width: min(92vw, 960px);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .modal img {
      max-width: 100%;
      max-height: 78vh;
      border-radius: 8px;
      background: #111;
    }
    .modal-title { color: #fff; font-size: 14px; }
    .modal-nav { display: flex; gap: 12px; align-items: center; }
    .modal-nav button {
      height: 32px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.12);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .modal-nav button:disabled { opacity: .4; cursor: not-allowed; }
    .modal-close {
      position: fixed;
      top: 16px;
      right: 20px;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      user-select: none;
    }
  </style>
</head>

    let gallery = [];
    let galleryIdx = 0;
    let galleryLabel = "";

    function uniq(arr) {
      return [...new Set(arr.filter(Boolean))].sort();
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function splitUrls(s) {
      if (!s) return [];
      return String(s).split(",").map(function(u) { return u.trim(); }).filter(Boolean);
    }

    function resultTag(text) {
      const t = text || "—";
      let cls = "tag-empty";
      if (t === "识别通过" || t === "已穿工服") cls = "tag-ok";
      else if (t === "未穿工服") cls = "tag-bad";
      else if (t.indexOf("不") >= 0 || t.indexOf("未") >= 0) cls = "tag-fail";
      return '<span class="tag ' + cls + '">' + esc(t) + "</span>";
    }

    function encodeGallery(urls) {
      return urls.map(function(u) { return encodeURIComponent(u); }).join("|");
    }

    function decodeGallery(raw) {
      if (!raw) return [];
      return raw.split("|").map(function(u) { return decodeURIComponent(u); }).filter(Boolean);
    }

    function photoCell(urls, label) {
      if (!urls.length) return '<span class="tag tag-empty">无照片</span>';
      const dataUrls = esc(encodeGallery(urls));
      const first = esc(urls[0]);
      let html = '<div class="photo-cell">';
      html += '<img class="thumb" src="' + first + '" alt="' + esc(label) + '" loading="lazy" data-gallery="' + dataUrls + '" data-label="' + esc(label) + '">';
      if (urls.length > 1) {
        html += '<span class="tag tag-empty">+' + (urls.length - 1) + '</span>';
      }
      html += '<button type="button" class="link-btn" data-gallery="' + dataUrls + '" data-label="' + esc(label) + '">查看(' + urls.length + ')</button>';
      html += "</div>";
      return html;
    }

    function fillSelect(sel, values) {
      values.forEach(function(v) {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      });
    }

    function renderStats(list) {
      const visitOk = list.filter(function(r) { return r["拜访识别结果"] === "识别通过"; }).length;
      const selfieOk = list.filter(function(r) { return r["自拍照片识别结果"] === "已穿工服"; }).length;
      const selfieBad = list.filter(function(r) { return r["自拍照片识别结果"] === "未穿工服"; }).length;
      els.stats.innerHTML =
        '<div class="stat"><b>' + list.length + '</b>总记录</div>' +
        '<div class="stat"><b>' + visitOk + '</b>拜访识别通过</div>' +
        '<div class="stat"><b>' + selfieOk + '</b>已穿工服</div>' +
        '<div class="stat"><b>' + selfieBad + '</b>未穿工服</div>';
    }

    function filterRecords() {
      const q = els.search.value.trim().toLowerCase();
      const tpl = els.filterTemplate.value;
      const dept = els.filterDept.value;
      const visit = els.filterVisit.value;
      const selfie = els.filterSelfie.value;
      return RECORDS.filter(function(r) {
        if (tpl && r["模版名称"] !== tpl) return false;
        if (dept && r["业务员部门"] !== dept) return false;
        if (visit && r["拜访识别结果"] !== visit) return false;
        if (selfie && r["自拍照片识别结果"] !== selfie) return false;
        if (!q) return true;
        const hay = [
          r["拜访id"], r["业务员名称"], r["业务员部门"],
          r["拜访客户姓名"], r["模版名称"], r["拜访日期"]
        ].join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    function openGallery(urls, label, startIdx) {
      gallery = urls;
      galleryIdx = startIdx || 0;
      galleryLabel = label || "照片";
      updateModal();
      els.modal.classList.add("open");
    }

    function updateModal() {
      if (!gallery.length) return;
      els.modalImg.src = gallery[galleryIdx];
      els.modalTitle.textContent = galleryLabel + " (" + (galleryIdx + 1) + "/" + gallery.length + ")";
      if (gallery.length > 1) {
        els.modalNav.style.display = "flex";
        els.prevBtn.disabled = galleryIdx <= 0;
        els.nextBtn.disabled = galleryIdx >= gallery.length - 1;
        els.modalIndex.textContent = (galleryIdx + 1) + " / " + gallery.length;
      } else {
        els.modalNav.style.display = "none";
      }
    }

    function closeModal() {
      els.modal.classList.remove("open");
      els.modalImg.src = "";
      gallery = [];
      galleryLabel = "";
    }

    function render() {
      const list = filterRecords();
      renderStats(list);
      els.countTip.textContent = "显示 " + list.length + " / " + RECORDS.length + " 条";
      if (!list.length) {
        els.tbody.innerHTML = "";
        els.empty.style.display = "block";
        return;
      }
      els.empty.style.display = "none";
      els.tbody.innerHTML = list.map(function(r, i) {
        const visitUrls = splitUrls(r[VISIT_PHOTO_KEY]);
        const selfieUrls = splitUrls(r[SELFIE_URL_KEY]);
        return (
          "<tr>" +
            "<td>" + (i + 1) + "</td>" +
            "<td>" + esc(r["拜访日期"]) + "</td>" +
            "<td>" + esc(r["模版名称"]) + "</td>" +
            "<td>" + esc(r["拜访id"]) + "</td>" +
            "<td>" + esc(r["业务员名称"]) + "</td>" +
            "<td>" + esc(r["业务员部门"]) + "</td>" +
            "<td>" + esc(r["拜访客户姓名"]) + "</td>" +
            "<td>" + resultTag(r["拜访识别结果"]) + "</td>" +
            "<td>" + photoCell(visitUrls, "拜访照片") + "</td>" +
            "<td>" + resultTag(r["自拍照片识别结果"]) + "</td>" +
            "<td>" + photoCell(selfieUrls, "自拍照片") + "</td>" +
          "</tr>"
        );
      }).join("");
    }

    document.body.addEventListener("click", function(e) {
      const btn = e.target.closest("[data-gallery]");
      if (!btn) return;
      e.preventDefault();
      const urls = decodeGallery(btn.getAttribute("data-gallery"));
      if (!urls.length) return;
      const label = btn.getAttribute("data-label") || "照片";
      openGallery(urls, label, 0);
    });

    els.prevBtn.addEventListener("click", function() {
      if (galleryIdx > 0) { galleryIdx--; updateModal(); }
    });
    els.nextBtn.addEventListener("click", function() {
      if (galleryIdx < gallery.length - 1) { galleryIdx++; updateModal(); }
    });

    els.modal.addEventListener("click", function(e) {
      if (e.target === els.modal || e.target === els.modalClose) closeModal();
    });
    document.addEventListener("keydown", function(e) {
      if (!els.modal.classList.contains("open")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft" && galleryIdx > 0) { galleryIdx--; updateModal(); }
      if (e.key === "ArrowRight" && galleryIdx < gallery.length - 1) { galleryIdx++; updateModal(); }
    });

    fillSelect(els.filterTemplate, uniq(RECORDS.map(function(r) { return r["模版名称"]; })));
    fillSelect(els.filterDept, uniq(RECORDS.map(function(r) { return r["业务员部门"]; })));
    fillSelect(els.filterVisit, uniq(RECORDS.map(function(r) { return r["拜访识别结果"]; })));
    fillSelect(els.filterSelfie, uniq(RECORDS.map(function(r) { return r["自拍照片识别结果"]; })));
    ["search", "filterTemplate", "filterDept", "filterVisit", "filterSelfie"].forEach(function(id) {
      els[id].addEventListener("input", render);
    });
    render();
  </script>
</body>
</html>
