<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>提货单详情 · 审核信息</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #e8e8e8;
      color: #333;
      font-size: 14px;
    }
    .phone {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f5f5f5;
      padding-bottom: 88px;
      position: relative;
    }
    .nav {
      height: 44px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 17px;
      font-weight: 600;
    }
    .nav .close {
      position: absolute;
      left: 12px;
      border: 0;
      background: none;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      color: #333;
    }

    .block {
      background: #fff;
      margin-bottom: 8px;
      padding: 4px 16px 8px;
    }
    .kv {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      font-size: 14px;
      line-height: 1.45;
    }
    .kv .lab { color: #999; flex-shrink: 0; }
    .kv .val { color: #333; text-align: right; word-break: break-all; }
    .kv .val.warn { color: #ff6a00; }
    .kv .val.ok { color: #52c41a; }

    .addr-block { padding-top: 8px; padding-bottom: 12px; }
    .addr-item {
      display: flex;
      gap: 10px;
      position: relative;
      padding-bottom: 16px;
    }
    .addr-item:last-child { padding-bottom: 0; }
    .addr-item:not(:last-child)::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 22px;
      bottom: 0;
      border-left: 1px dashed #ddd;
    }
    .badge {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      z-index: 1;
    }
    .badge.send { background: #8c8c8c; }
    .badge.recv { background: #ff6a00; }
    .badge.pick { background: #bfbfbf; }
    .addr-body { flex: 1; min-width: 0; }
    .addr-title {
      font-size: 14px;
      color: #333;
      margin-bottom: 4px;
    }
    .addr-text {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .sec-title {
      font-size: 15px;
      font-weight: 600;
      color: #222;
      padding: 14px 0 4px;
    }
    .copy {
      color: #1890ff;
      margin-left: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .empty {
      text-align: center;
      color: #bbb;
      font-size: 13px;
      padding: 28px 0 24px;
    }

    .audit-list {
      padding: 8px 0 14px;
    }
    .audit-row {
      font-size: 14px;
      color: #333;
      line-height: 1.7;
      padding: 2px 0;
    }
    .audit-row .lab { color: #666; }
    .audit-row .st-wait { color: #ff6a00; }
    .audit-row .st-ok { color: #52c41a; }

    .footer {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 390px;
      background: #fff;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 8px rgba(0,0,0,.04);
    }
    .btn-share {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 22px;
      background: #ff6a00;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .demo-bar {
      background: #1f1f1f;
      color: #fff;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .demo-bar span { opacity: .75; margin-right: 4px; }
    .demo-bar button {
      border: 0;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      background: #444;
      color: #fff;
      cursor: pointer;
    }
    .demo-bar button.active { background: #ff6a00; }
  </style>
</head>
<body>
  <div class="demo-bar">
    <span>审核状态演示</span>
    <button type="button" class="active" data-scene="pending-zl">待审核·赵璐</button>
    <button type="button" data-scene="pending-dg">待审核·东哥</button>
    <button type="button" data-scene="passed">已通过</button>
  </div>

  <div class="phone">
    <div class="nav">
      <button type="button" class="close" aria-label="关闭">×</button>
      客户详情
    </div>

    <div class="block">
      <div class="kv"><span class="lab">付款方式</span><span class="val">货到付款</span></div>
      <div class="kv"><span class="lab">提货日期</span><span class="val" id="pickDate">2026-09-03</span></div>
      <div class="kv"><span class="lab">申请提货数量</span><span class="val" id="pickQty">200包(8吨)</span></div>
    </div>

    <div class="block addr-block">
      <div class="addr-item">
        <div class="badge send">寄</div>
        <div class="addr-body">
          <div class="addr-title">提货地址</div>
          <div class="addr-text">安徽省阜阳市颍上县耿棚镇十字沟村委会</div>
        </div>
      </div>
      <div class="addr-item">
        <div class="badge recv">收</div>
        <div class="addr-body">
          <div class="addr-title">收货地址</div>
          <div class="addr-text">安徽省阜阳市颍州区清河街道颍河西路</div>
        </div>
      </div>
      <div class="addr-item">
        <div class="badge pick">接</div>
        <div class="addr-body">
          <div class="addr-title">常用接货人</div>
          <div class="addr-text">--</div>
        </div>
      </div>
    </div>

    <div class="block">
      <div class="sec-title">提货信息</div>
      <div class="kv">
        <span class="lab">提货编号</span>
        <span class="val">202609038YHLT009<span class="copy">复制</span></span>
      </div>
      <div class="kv">
        <span class="lab">申请提货时间</span>
        <span class="val">2026-09-03 18:47:59</span>
      </div>
    </div>

    <!-- 新增：审核信息 -->
    <div class="block">
      <div class="sec-title">审核信息</div>
      <div class="audit-list" id="auditInfo">
        <div class="audit-row"><span class="lab">审批类型：</span><span>提货吨数超过5吨</span></div>
        <div class="audit-row"><span class="lab">提交时间：</span><span>2026-09-03 18:47:59</span></div>
        <div class="audit-row"><span class="lab">提交人：</span><span>王园康</span></div>
        <div class="audit-row"><span class="lab">审核状态：</span><span class="st-wait">待审核</span></div>
        <div class="audit-row"><span class="lab">审核人：</span><span>赵璐</span></div>
        <div class="audit-row"><span class="lab">审核时间：</span><span>--</span></div>
      </div>
    </div>

    <div class="block">
      <div class="sec-title">辅助操作记录</div>
      <div class="empty">无辅助操作记录</div>
    </div>

    <div class="footer">
      <button type="button" class="btn-share">分享</button>
    </div>
  </div>

  <script>
    const SCENES = {
      "pending-zl": {
        qty: "200包(8吨)",
        html: `
          <div class="audit-row"><span class="lab">审批类型：</span><span>提货吨数超过5吨</span></div>
          <div class="audit-row"><span class="lab">提交时间：</span><span>2026-09-03 18:47:59</span></div>
          <div class="audit-row"><span class="lab">提交人：</span><span>王园康</span></div>
          <div class="audit-row"><span class="lab">审核状态：</span><span class="st-wait">待审核</span></div>
          <div class="audit-row"><span class="lab">审核人：</span><span>赵璐</span></div>
          <div class="audit-row"><span class="lab">审核时间：</span><span>--</span></div>
        `
      },
      "pending-dg": {
        qty: "300包(12吨)",
        html: `
          <div class="audit-row"><span class="lab">审批类型：</span><span>提货吨数超过5吨</span></div>
          <div class="audit-row"><span class="lab">提交时间：</span><span>2026-09-05 10:12:20</span></div>
          <div class="audit-row"><span class="lab">提交人：</span><span>王园康</span></div>
          <div class="audit-row"><span class="lab">审核状态：</span><span class="st-wait">待审核</span></div>
          <div class="audit-row"><span class="lab">审核人：</span><span>东哥</span></div>
          <div class="audit-row"><span class="lab">审核时间：</span><span>--</span></div>
        `
      },
      passed: {
        qty: "200包(8吨)",
        html: `
          <div class="audit-row"><span class="lab">审批类型：</span><span>提货吨数超过5吨</span></div>
          <div class="audit-row"><span class="lab">提交时间：</span><span>2026-09-03 18:47:59</span></div>
          <div class="audit-row"><span class="lab">提交人：</span><span>王园康</span></div>
          <div class="audit-row"><span class="lab">审核状态：</span><span class="st-ok">已通过</span></div>
          <div class="audit-row"><span class="lab">审核人：</span><span>赵璐</span></div>
          <div class="audit-row"><span class="lab">审核时间：</span><span>2026-09-04 09:15:32</span></div>
        `
      }
    };

    document.querySelectorAll(".demo-bar button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".demo-bar button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const s = SCENES[btn.dataset.scene];
        document.getElementById("auditInfo").innerHTML = s.html;
        document.getElementById("pickQty").textContent = s.qty;
      });
    });
  </script>
</body>
</html>
